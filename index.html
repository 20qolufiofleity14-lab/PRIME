<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><meta name="apple-mobile-web-app-title" content="PRIME">
<title>PRIME</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* American gym poster: black, red, gold, condensed caps. Same dark world as the Academy. */
:root{
  color-scheme:dark;
  --ink:#0b0b0e;--panel:#141418;--panel-2:#1d1d23;--line:#2b2b33;
  --fg:#f5f2ec;--muted:#a3a09a;--dim:#66645f;
  --vio:#e8322e;--hot:#ff6a3d;--amber:#f2c14e;--mint:#5ee6a0;--cyan:#4fc3f7;--bad:#ff7a7a;
  --grad:linear-gradient(120deg,#e8322e 0%,#ff6a3d 60%,#f2c14e 100%);
  --f-display:"Bebas Neue","Barlow Condensed","Noto Sans JP","Hiragino Sans",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans",sans-serif;
  --f-num:"Barlow Condensed","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--ink) 88%,transparent);backdrop-filter:blur(10px);margin:0 -16px;border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;padding:12px 16px}
.home-link{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:12px;border:1px solid var(--line);color:var(--muted);text-decoration:none;font-size:18px;flex:none}
.logo{width:38px;height:38px;border-radius:8px;background:var(--grad);display:grid;place-items:center;flex:none;font-family:var(--f-display);color:#140a0a;font-size:22px;letter-spacing:.02em}
.brand b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1;letter-spacing:.06em}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.12em}
.stat{margin-left:auto;font-family:var(--f-num);font-size:12px;text-align:right;line-height:1.4}
.stat b{color:var(--vio);font-size:15px}
.stat small{display:block;color:var(--muted);font-family:var(--f-body);font-size:10px;letter-spacing:.08em}
h1,h2,h3{margin:0;text-wrap:balance}
.screen{display:flex;flex-direction:column;gap:14px;padding-top:18px}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--muted)}
.title{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;letter-spacing:.04em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3{font-size:15px;font-weight:700;margin-bottom:6px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:18px;border:1px solid var(--line);background:
  radial-gradient(120% 90% at 100% 0%,rgba(232,50,46,.38),transparent 60%),
  radial-gradient(80% 70% at 0% 100%,rgba(242,193,78,.14),transparent 60%),var(--panel)}
.identity{font-family:var(--f-body);font-weight:700;font-size:19px;line-height:1.45;margin:6px 0 2px}
.votes{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.votes b{color:var(--fg);font-size:24px;font-weight:700}
.trigger{margin-top:10px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.trigger b{color:var(--fg);font-weight:500}
.alert{border-radius:14px;padding:12px 14px;font-size:13.5px;background:color-mix(in srgb,var(--amber) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--amber) 45%,var(--line))}
.alert.good{background:color-mix(in srgb,var(--mint) 12%,var(--panel));border-color:color-mix(in srgb,var(--mint) 45%,var(--line))}
.week{display:flex;gap:6px;margin-top:10px}
.wd{flex:1;text-align:center;font-size:11px;color:var(--dim)}
.wd i{display:block;height:30px;border-radius:9px;border:1px solid var(--line);margin-bottom:3px;background:var(--panel-2)}
.wd.on i{background:var(--grad);border-color:transparent}
.wd.rest i{background:repeating-linear-gradient(45deg,var(--panel-2) 0 5px,#26262e 5px 10px)}
.wd.today{color:var(--fg);font-weight:700}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvb{border:1px solid var(--line);background:var(--panel-2);border-radius:16px;padding:12px 8px;cursor:pointer;text-align:center;line-height:1.35}
.lvb b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.06em}
.lvb span{font-size:11px;color:var(--muted)}
.lvb.mini{border-color:color-mix(in srgb,var(--vio) 70%,var(--line));background:color-mix(in srgb,var(--vio) 16%,var(--panel-2))}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;background:var(--grad);color:#140a0a;font-weight:700;cursor:pointer}
.cta[disabled]{opacity:.4}
.ghost{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.tile .k{font-size:11px;color:var(--muted);letter-spacing:.06em}
.tile .v{font-family:var(--f-num);font-size:26px;font-weight:700;line-height:1.2}
.tile .v small{font-size:11px;color:var(--muted);font-weight:500;font-family:var(--f-body)}
.up{color:var(--bad)}.down{color:var(--mint)}
input.num,input.txt,textarea,select{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%}
input.num{font-family:var(--f-num);font-size:16px}
textarea{min-height:70px;resize:vertical;font-size:14px}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.wt-in{display:flex;gap:8px;align-items:center}
.wt-in input{flex:1}
/* セッション */
.ex{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.chk{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel-2);cursor:pointer;font-size:18px;color:transparent}
.chk.on{background:var(--grad);border-color:transparent;color:#140a0a}
.ex .nm{font-weight:500;line-height:1.35}
.ex .nm small{display:block;color:var(--muted);font-size:11px}
.ex .qty{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.ex .qty input{width:54px;padding:6px 6px;text-align:center;font-size:14px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);font-family:var(--f-num)}
/* チェックイン */
.axis{margin:12px 0}
.axis .lb{display:flex;justify-content:space-between;font-size:13px}
.axis .lb span{color:var(--muted);font-size:11px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.scale button{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:7px 0;cursor:pointer;font-family:var(--f-num);font-size:13px}
.scale button.on{background:var(--c,var(--vio));color:#140a0a;border-color:transparent;font-weight:700}
.modal{position:fixed;inset:0;z-index:20;background:rgba(8,5,14,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.encourage{font-weight:700;font-size:18px;line-height:1.55;margin:4px 0 10px}
/* 比較バー */
.cmp{margin:12px 0}
.cmp .lb{font-size:13px;display:flex;justify-content:space-between}
.bar2{display:grid;grid-template-columns:62px 1fr 32px;gap:8px;align-items:center;font-size:11px;color:var(--muted);margin-top:4px}
.bar2 .tr{height:10px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.bar2 .tr i{display:block;height:100%;border-radius:99px}
.bar2 b{font-family:var(--f-num);color:var(--fg);font-size:12px;text-align:right}
/* カレンダー */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:11px}
.cal .h{color:var(--dim)}
.cal .d{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;background:var(--panel-2);font-family:var(--f-num);font-size:10.5px;color:var(--dim);position:relative}
.cal .d.on{background:var(--grad);color:#140a0a;font-weight:700}
.cal .d.rest{background:repeating-linear-gradient(45deg,var(--panel-2) 0 4px,#26262e 4px 8px);color:var(--muted)}
.cal .d.today{outline:1.5px solid var(--fg)}
.cal .d .w{position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--cyan)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* vision / 30day / pillars / night / spark */
.vision{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13px}
.vision li{padding-left:14px;position:relative;color:var(--fg)}
.vision li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;background:var(--amber);transform:rotate(45deg)}
.c30{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:8px}
.c30 i{display:block;aspect-ratio:1;border-radius:4px;background:var(--panel-2);border:1px solid var(--line)}
.c30 i.on{background:var(--grad);border-color:transparent}
.c30 i.rest{background:repeating-linear-gradient(45deg,var(--panel-2) 0 3px,#26262e 3px 6px)}
.c30 i.miss{background:#0f0f12}
.c30 i.now{outline:1.5px solid var(--fg);outline-offset:1px}
.pillars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pb{border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:8px 2px 6px;cursor:pointer;text-align:center;line-height:1.25;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.pb b{font-family:var(--f-display);font-size:14px;letter-spacing:.06em;color:var(--c)}
.pb span{font-size:11px;color:var(--muted)}
.pb small{display:block;font-size:9px;color:var(--dim);line-height:1.2;margin-top:2px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pb.on{background:color-mix(in srgb,var(--c) 22%,var(--panel-2));border-color:var(--c)}
.pb.on span{color:var(--fg)}
.pb:disabled{cursor:default;opacity:.9}
.spark{display:block;width:100%;border:0;background:transparent;padding:10px 0 0;cursor:pointer;text-align:left}
.spark svg{width:100%;height:56px;display:block}
.night{background:linear-gradient(180deg,#121220,var(--panel))}
.radar{width:100%;max-width:200px;height:auto;display:block;margin:0 auto}
.pb.on small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip.on{background:color-mix(in srgb,#f2c14e 22%,var(--panel-2));border-color:#f2c14e;color:var(--fg)}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(242,193,78,.0)}30%{box-shadow:0 0 0 3px rgba(242,193,78,.7)}100%{box-shadow:0 0 0 0 rgba(242,193,78,0)}}
.flash{animation:flash 1.2s ease}
/* 巻物 */
.scroll{border-radius:20px;padding:18px;background:linear-gradient(180deg,color-mix(in srgb,var(--vio) 12%,var(--panel)),var(--panel));border:1px solid var(--line)}
.scroll .src{font-size:11px;letter-spacing:.14em;color:var(--vio)}
.scroll h2{font-weight:700;font-size:19px;line-height:1.4;margin:6px 0 10px}
.scroll p{margin:0 0 10px}
.scroll .q{border-left:3px solid var(--vio);padding:4px 0 4px 12px;color:var(--fg);font-size:14px;background:color-mix(in srgb,var(--vio) 8%,transparent);border-radius:0 10px 10px 0}
.clist{display:flex;flex-direction:column;gap:6px}
.citem{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;width:100%}
.citem .no{font-family:var(--f-num);font-size:11px;color:var(--dim);width:22px}
.citem.read .no{color:var(--vio)}
.citem.lock{opacity:.4;cursor:default}
/* チャート */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:4px 11px;font-size:12px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--panel-2);color:var(--fg)}
.chart svg{width:100%;height:auto;display:block}
.hist{display:flex;flex-direction:column;font-size:13px}
.hist div{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid var(--line)}
.hist button{border:0;background:none;color:var(--dim);cursor:pointer;font-size:12px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav button{border:0;background:none;padding:9px 0 10px;font-size:10.5px;color:var(--dim);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-family:var(--f-display);font-weight:400;font-size:16px;line-height:1.15;letter-spacing:.03em}
nav button.on{color:var(--fg)}
nav button.on b{color:var(--vio)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13px;z-index:30;white-space:nowrap}
.exedit{display:grid;grid-template-columns:1fr 54px;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.exedit .lvs{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tg{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.tg.on{background:color-mix(in srgb,var(--vio) 30%,var(--panel-2));color:var(--fg);border-color:var(--vio)}
.epi{font-size:12px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.epi span{color:var(--dim);white-space:nowrap}
.scroll .nar{color:color-mix(in srgb,var(--fg) 82%,var(--muted));margin:0 0 12px}
.ln{margin:0 0 8px;padding:5px 11px 6px;border-radius:10px;line-height:1.7;background:color-mix(in srgb,var(--c) 7%,transparent);border-left:2px solid var(--c)}
.ln.t{--c:var(--mint)}.ln.s{--c:var(--amber)}.ln.o{--c:var(--cyan)}
.ln .who{display:block;font-size:10.5px;letter-spacing:.08em;color:var(--c);line-height:1.5}
.ln p{margin:0}
.fch summary{list-style:none}.fch summary::-webkit-details-marker{display:none}.fch summary::before{content:"▸ ";color:var(--dim)}.fch[open] summary::before{content:"▾ "}
.brk{text-align:center;color:var(--dim);margin:16px 0;letter-spacing:1em}
/* FUEL */
.scroll.fuel{background:linear-gradient(180deg,color-mix(in srgb,var(--mint) 10%,var(--panel)),var(--panel))}
.scroll.fuel .src{color:var(--mint)}
.scroll.fuel .q{border-left-color:var(--mint);background:color-mix(in srgb,var(--mint) 8%,transparent)}
.fopts{display:flex;flex-direction:column;gap:6px}
.fo{text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:10px 12px;font-size:14px;cursor:pointer;line-height:1.5}
.fo.done{cursor:default;opacity:.55}
.fo.ok{opacity:1;border-color:var(--mint);background:color-mix(in srgb,var(--mint) 18%,var(--panel-2))}
.fo.ng{opacity:1;border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--panel-2))}
.fexp{margin-top:10px;font-size:13.5px;line-height:1.7;padding:10px 12px;border-radius:12px;background:var(--panel-2)}
.flist{display:flex;flex-direction:column;gap:6px}
.fitem{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 12px}
.fh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fh b{font-size:14.5px}
.fk{font-family:var(--f-num);font-size:22px;color:var(--amber);white-space:nowrap}
.fk small{font-size:11px;color:var(--dim);margin-left:2px}
.pfc{display:flex;gap:6px;margin-top:6px;font-family:var(--f-num);font-size:13px}
.pfc span{border-radius:8px;padding:1px 8px;background:var(--panel-2)}
.pfc .p{color:var(--mint)}.pfc .f{color:var(--hot)}.pfc .c{color:var(--cyan)}
.fx{margin-top:6px;font-size:12px;color:var(--fg);border-left:2px solid var(--amber);padding-left:8px}
</style></head><body>
<div class="wrap">
  <header class="top"><div class="top-in">
    <a class="home-link" id="homeLink" href="https://20qolufiofleity14-lab.github.io/Academylab/" aria-label="内分泌アカデミーへ戻る">‹</a>
    <div class="logo">P</div>
    <div class="brand"><b>PRIME</b><span>いちばんかっこいい30代をつくる</span></div>
    <div class="stat"><small>VOTES</small><b id="hdrVotes">0</b></div>
  </div></header>
  <main id="app"></main>
</div>
<nav><div class="in">
  <button data-tab="today" class="on"><b>TODAY</b>きょう</button>
  <button data-tab="body"><b>BODY</b>体重・BMI</button>
  <button data-tab="look"><b>REVIEW</b>ふりかえり</button>
  <button data-tab="scroll"><b>MIND</b>メンタル</button>
  <button data-tab="fuel"><b>FUEL</b>栄養</button>
  <button data-tab="set"><b>SETUP</b>設定</button>
</div></nav>
<script>
/* ================= データ ================= */
const K="prime_30s_v1";
const EX_DEFAULT=[
  {id:"sq",n:"スクワット",u:"回",lv:[1,2,3],d:[10,15,20],s:[1,3,4]},
  {id:"pu",n:"腕立て（膝つきOK）",u:"回",lv:[1,2,3],d:[5,10,15],s:[1,3,4]},
  {id:"pl",n:"プランク",u:"秒",lv:[1,2,3],d:[20,30,45],s:[1,3,3]},
  {id:"hr",n:"ヒップリフト",u:"回",lv:[2,3],d:[10,15,20],s:[1,2,3]},
  {id:"lu",n:"ランジ（左右それぞれ）",u:"回",lv:[2,3],d:[8,10,12],s:[1,2,3]},
  {id:"bs",n:"ブルガリアンスクワット",u:"回",lv:[3],d:[8,8,10],s:[1,1,3]},
  {id:"pk",n:"パイク腕立て",u:"回",lv:[3],d:[5,6,8],s:[1,1,3]},
  {id:"cr",n:"クランチ",u:"回",lv:[3],d:[10,15,20],s:[1,2,3]}
];
const LV={1:{n:"ミニ",s:"1分・どれか1つでOK"},2:{n:"ふつう",s:"10分くらい"},3:{n:"がっつり",s:"20分くらい"}};
const AXES=[
  {id:"body",n:"体",s:"からだの軽さ",c:"#5ee6c8"},
  {id:"focus",n:"頭",s:"集中・学び",c:"#3ee8ff"},
  {id:"mood",n:"心",s:"気分の安定",c:"#ffb547"},
  {id:"self",n:"自分",s:"自分を信じられる度",c:"#e8322e"}

function dkey(d){ return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

 {s:"DaiGoさんの考え方から",t:"自信は、姿勢と視線から作れる",b:["メンタリズムでは、心と体は双方向だと考えます。気持ちが姿勢を作るだけでなく、姿勢が気持ちを作ります。","胸を開き、あごを引き、相手の目を見てゆっくり話す。それだけで、自分も相手も「余裕のある人」と感じます。","筋トレで背中と体幹が強くなると、この姿勢が自然にできるようになります。"],q:"今日、人と話すとき姿勢を一つ変えるなら？"},
 {s:"モテる技術",t:"清潔感は、筋肉より先に効く",b:["第一印象で最も強く効くのは、体型より清潔感です。髪、肌、爪、靴、服のサイズ感。","これらは全部「手入れをしている人」というメッセージで、それが自己管理できる人という印象につながります。","週に一度、鏡の前で5分。筋トレと同じで、小さな手入れの積み重ねが人の印象を変えます。"],q:"今週、5分で整えられる身だしなみは？"},

 {s:"自己効力感",t:"1か月続いた自分へ",b:["ここまで読み進めたなら、もう何度も戻ってきたはずです。","続けることは、才能ではなく技術です。小さく始める、きっかけを決める、休んだら戻る、記録する。","その技術は、勉強にも、仕事にも、そのまま使えます。"],q:"この道場で身につけた「続ける技術」を、次はどこに使う？"}
];
function cardUnlocked(){ /* 1日1枚ずつ開く（はじめの日に1枚） */ return Math.min(CARDS.length, daysBetween(pkey(D.start),new Date())+1); }
function todayCard(){ const n=cardUnlocked(); for(let i=0;i<n;i++) if(!D.read[i]) return i; return (daysBetween(pkey(D.start),new Date()))%CARDS.length; }

function session(lv){
  const list=D.ex.filter(e=>e.lv.includes(lv));
  const sel={};
  const sheet=openSheet(`<div class="eyebrow">${LV[lv].n} ・ ${LV[lv].s}</div>
    <h2 class="title" style="font-size:20px;margin:4px 0 6px">${lv===1?"どれか1つ、やったらチェック":"やった種目にチェック"}</h2>
    <p class="small muted" style="margin:0 0 6px">${lv===1?"気分が乗ったら、ほかの種目も足してOK。":"全部できなくても大丈夫。やった分だけ記録します。"}</p>
    <div id="exList">${list.map(e=>{ const lvI=lv-1, last=lastVal(e.id);
      const v=last&&lv>1? last.v : e.d[lvI], s=e.s[lvI];
      return `<div class="ex"><button class="chk" data-id="${e.id}" aria-label="${esc(e.n)}をやった">✓</button>
        <div class="nm">${esc(e.n)}${last?`<small>前回 ${last.v}${esc(e.u)}×${last.s}</small>`:""}</div>
        <div class="qty"><input type="number" inputmode="numeric" data-v="${e.id}" value="${v}">${esc(e.u)}×<input type="number" inputmode="numeric" data-s="${e.id}" value="${s}" style="width:40px">set</div></div>`; }).join("")}</div>
    <div class="row" style="margin-top:14px;justify-content:space-between"><button class="ghost" id="cancel">やめる</button><button class="cta" id="fin" disabled>やった！</button></div>`);
  sheet.querySelectorAll(".chk").forEach(b=>b.onclick=()=>{ sel[b.dataset.id]=!sel[b.dataset.id]; b.classList.toggle("on",sel[b.dataset.id]); sheet.querySelector("#fin").disabled=!Object.values(sel).some(Boolean); });
  sheet.querySelector("#cancel").onclick=closeSheet;
  sheet.querySelector("#fin").onclick=()=>{
    const items=list.filter(e=>sel[e.id]).map(e=>({id:e.id,n:e.n,u:e.u,v:+sheet.querySelector(`[data-v="${e.id}"]`).value||0,s:+sheet.querySelector(`[data-s="${e.id}"]`).value||1}));
    closeSheet(); checkin({lv,items});
  };
}

function checkin(work){
  const k=TODAY(), prev=D.log[k]||{};
  const cond=Object.assign({},prev.cond||{});
  if(work){ D.log[k]=Object.assign({},prev,{lv:work.lv,items:work.items,at:Date.now(),rest:false}); save(); }
  const enc=work? pickEnc(k,work.lv) : "休むと決めて休むのも、自分で選んだこと。明日のための一日です。";
  const sheet=openSheet(`<div class="eyebrow">${work?"今日の一票":"休養日"}</div>
    <div class="encourage">${esc(enc)}</div>
    <p class="small muted" style="margin:0">いまの状態に近いものを選んでください（あとで「やった日」と「やらない日」を比べます）。</p>
    ${AXES.map(a=>`<div class="axis"><div class="lb"><b>${a.n}</b><span>${a.s}</span></div>
      <div class="scale" data-ax="${a.id}" style="--c:${a.c}">${[1,2,3,4,5].map(n=>`<button data-n="${n}" class="${cond[a.id]===n?"on":""}">${n}</button>`).join("")}</div></div>`).join("")}
    <label class="f">今日の自分にひとこと（任意）</label>
    <textarea id="note" placeholder="例：眠かったけどミニはできた">${esc(prev.note||"")}</textarea>
    <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="cta" id="ok">記録する</button></div>`);
  sheet.querySelectorAll(".scale").forEach(sc=>sc.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    cond[sc.dataset.ax]=+b.dataset.n; sc.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); }));
  sheet.querySelector("#ok").onclick=()=>{
    const cur=D.log[k]||{lv:0,rest:true,at:Date.now()};
    cur.cond=cond; cur.note=sheet.querySelector("#note").value.trim(); if(!work&&!(cur.lv>0)) cur.rest=true;
    D.log[k]=cur; save(); closeSheet(); toast(work?"一票、入りました":"休養日として記録しました"); setTab("today"); };
}

/* ================= 体重・BMI ================= */
function bmi(w){ if(!D.height||!w) return null; const m=D.height/100; return (w/(m*m)).toFixed(1); }
function bmiLabel(b){ b=+b; return b<18.5?"低体重":b<25?"普通体重":b<30?"肥満（1度）":b<35?"肥満（2度）":"肥満（3度以上）"; }
let range=30, metric="w";
function wSeries(){ return Object.keys(D.w).map(k=>({k,d:pkey(k),v:D.w[k]})).sort((a,b)=>a.d-b.d); }
function ma7(series,d){ const from=addDays(d,-6); const xs=series.filter(p=>p.d>=from&&p.d<=d).map(p=>p.v); return xs.length? xs.reduce((a,b)=>a+b,0)/xs.length:null; }

      <div class="tile"><div class="k">BMI</div><div class="v">${last&&bmi(last.v)?bmi(last.v):"—"}</div><div class="k">${last&&bmi(last.v)?bmiLabel(bmi(last.v)):"設定で身長を入力"}</div></div>

      <div class="tile"><div class="k">記録をはじめてから</div><div class="v ${first&&last&&last.v-first.v>0?"up":"down"}">${first&&last&&s.length>1?sign(last.v-first.v):"—"}<small> kg</small></div><div class="k">記録 ${s.length} 日</div></div>

      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <div class="seg" id="mSeg"><button data-m="w" class="${metric==="w"?"on":""}">体重</button><button data-m="b" class="${metric==="b"?"on":""}">BMI</button></div>
        <div class="seg" id="rSeg">${[[30,"1か月"],[90,"3か月"],[365,"1年"],[0,"全部"]].map(([r,n])=>`<button data-r="${r}" class="${range===r?"on":""}">${n}</button>`).join("")}</div>
      </div>
      ${chartSVG(s)}
      <div class="legend"><span><i style="background:#4fc3f7;border-radius:50%"></i>毎日の値</span><span><i style="background:#e8322e"></i>7日平均（トレンド）</span>${D.goalW&&metric==="w"?`<span><i style="background:#ffb547"></i>目標</span>`:""}<span><i style="background:var(--grad)"></i>トレーニングした日</span></div>
      <p class="small muted" style="margin:8px 0 0">体重は水分や食事で毎日1kgくらい揺れます。見るのは紫の線（7日平均）だけで十分です。</p>
    </div>
    <div class="card">

/* TODAY用の小さな推移グラフ（直近30日・体重と7日平均） */
function sparkSVG(){ const all=wSeries(); const end=new Date(), start=addDays(end,-29);
  const pts=all.filter(p=>p.d>=start&&p.d<=end); if(pts.length<2) return `<span class="small muted">体重が2日分たまると、ここに推移が出ます</span>`;
  const W=320,H=56,L=4,R=36; const ma=[]; for(let i=0;i<30;i++){ const d=addDays(start,i); const m=ma7(all,d); if(m!=null) ma.push({d,v:m}); }
  const vs=pts.map(p=>p.v).concat(ma.map(p=>p.v)); let lo=Math.min(...vs),hi=Math.max(...vs); const pad=Math.max(0.3,(hi-lo)*.2); lo-=pad;hi+=pad;
  const x=d=>L+(W-L-R)*daysBetween(start,d)/29, y=v=>4+(H-8)*(1-(v-lo)/(hi-lo));
  const last=ma[ma.length-1], first=ma[0], diff=last&&first? last.v-first.v:0;
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${pts.map(p=>`<circle cx="${x(p.d)}" cy="${y(p.v)}" r="2" fill="#4fc3f7" opacity=".6"/>`).join("")}
    <path d="${ma.map((p,i)=>(i?"L":"M")+x(p.d).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ")}" fill="none" stroke="#e8322e" stroke-width="2.2" stroke-linecap="round"/>
    <text x="${W-2}" y="${H/2+4}" text-anchor="end" fill="${diff<0?"#5ee6a0":diff>0?"#ff7a7a":"#a3a09a"}" font-size="11" font-family="Barlow Condensed" font-weight="700">${diff>0?"+":""}${diff.toFixed(1)}kg</text></svg><span class="small muted">30日 ・ タップでくわしく</span>`; }
/* 5つの柱のレーダー（今週） */
function radarSVG(ws){ const n=PILLARS.length, cx=90, cy=90, r=62;
  const cnt=PILLARS.map(p=>{ let c=0; for(let i=0;i<7;i++) if(pillarOn(p.id,dkey(addDays(ws,i)))) c++; return c; });
  const pt=(i,v)=>{ const a=-Math.PI/2+i*2*Math.PI/n; return [cx+r*v*Math.cos(a), cy+r*v*Math.sin(a)]; };
  let s=`<svg viewBox="0 0 180 180" class="radar" role="img" aria-label="今週の5つの柱">`;
  [0.33,0.66,1].forEach(f=>{ s+=`<polygon points="${PILLARS.map((_,i)=>pt(i,f).join(",")).join(" ")}" fill="none" stroke="#2b2b33"/>`; });
  PILLARS.forEach((_,i)=>{ const [x,y]=pt(i,1); s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#2b2b33"/>`; });
  s+=`<polygon points="${cnt.map((c,i)=>pt(i,Math.max(.04,c/7)).join(",")).join(" ")}" fill="rgba(232,50,46,.28)" stroke="#e8322e" stroke-width="2" stroke-linejoin="round"/>`;
  PILLARS.forEach((p,i)=>{ const [x,y]=pt(i,1.22); s+=`<text x="${x}" y="${y+4}" text-anchor="middle" fill="${p.c}" font-size="10" font-family="Barlow Condensed" font-weight="700">${p.n} ${cnt[i]}</text>`; });
  return s+`</svg>`; }
function isoDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function chartSVG(all){
  const W=340,H=200,L=34,R=8,T=10,B=24;
  const end=new Date(); let start= range? addDays(end,-(range-1)) : (all[0]?all[0].d:addDays(end,-29));
  if(start>end) start=addDays(end,-29);
  const val=p=> metric==="b"? +bmi(p) : p;
  const pts=all.filter(p=>p.d>=start&&p.d<=end).map(p=>({d:p.d,k:p.k,v:val(p.v)}));
  if(pts.length===0) return `<div class="small muted" style="padding:40px 0;text-align:center">この期間の記録はまだありません</div>`;
  const span=Math.max(1,daysBetween(start,end));
  const ma=[]; for(let i=0;i<=span;i++){ const d=addDays(start,i); const m=ma7(all,d); if(m!=null) ma.push({d,v:metric==="b"?+bmi(m):m}); }
  let vs=pts.map(p=>p.v).concat(ma.map(p=>p.v)); const g=metric==="b"?(D.goalW&&D.height? +bmi(D.goalW):null):D.goalW||null;
  if(g) vs.push(g);
  let lo=Math.min(...vs), hi=Math.max(...vs); const pad=Math.max(0.5,(hi-lo)*0.15); lo-=pad; hi+=pad;
  const x=d=>L+(W-L-R)*daysBetween(start,d)/span, y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const ticks=[lo+pad, (lo+hi)/2, hi-pad];
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${metric==="b"?"BMI":"体重"}の推移">`;
  ticks.forEach(t=>{ svg+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="#33274a" stroke-dasharray="2 4"/><text x="${L-5}" y="${y(t)+3}" fill="#6d6386" font-size="9" text-anchor="end" font-family="Unbounded">${t.toFixed(1)}</text>`; });
  if(g) svg+=`<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke="#ffb547" stroke-width="1.2" stroke-dasharray="6 4"/>`;
  for(let i=0;i<=span;i++){ const d=addDays(start,i); if(trained(dkey(d))) svg+=`<rect x="${x(d)-1.5}" y="${H-B+4}" width="3" height="6" rx="1" fill="#f2c14e"/>`; }
  pts.forEach(p=>{ svg+=`<circle cx="${x(p.d)}" cy="${y(p.v)}" r="${pts.length>120?1.5:2.4}" fill="#4fc3f7" opacity=".55"/>`; });
  if(ma.length>1) svg+=`<path d="${ma.map((p,i)=>(i?"L":"M")+x(p.d).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ")}" fill="none" stroke="#e8322e" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  const f=d=>(d.getMonth()+1)+"/"+d.getDate();
  svg+=`<text x="${L}" y="${H-2}" fill="#6d6386" font-size="9" font-family="Unbounded">${f(start)}</text><text x="${W-R}" y="${H-2}" fill="#6d6386" font-size="9" text-anchor="end" font-family="Unbounded">${f(end)}</text></svg>`;
  return svg;
}

{s:"栄養士の基本",t:"成分表は「可食部100g」で読む",sub:"ゆで卵がわからない",
body:`ジムの受付の奥に、小さな扉がある。「栄養相談室」と書かれた木の札が、少しだけ傾いてかかっていた。
青木航は、その札の前で三十秒ほど立ち止まっていた。三十二歳、営業職。先月の健診で、体重は七十八キロ。身長は百七十二センチだから、BMIは二十六を少し超えている。
きっかけは、去年の秋、娘の保育園の運動会だった。保護者リレーで五十メートル走っただけで、ゴールのあと息が戻らなかった。娘は笑っていたけれど、航は笑えなかった。それから半年、何かを始めようと思っては、やめてきた。
扉をノックすると、「どうぞ」と落ち着いた声がした。
＊
部屋には本棚と、木のテーブルと、体重計がひとつ。窓際に座っていた女性が顔を上げた。五十歳前後だろうか。背筋がまっすぐで、短い髪に白いものがまじっている。
楠木：管理栄養士の楠木です。今日は、どんなご相談ですか。
航：あの……痩せたいんです。いや、痩せたいっていうか、ちゃんとした体になりたいというか。
楠木：ちゃんとした体。いい言葉ですね。座ってください。
航は椅子に腰を下ろすと、鞄からコンビニの袋を取り出した。ゆで卵がふたつ入っている。
航：正直に言うと、何を信じていいかわからないんです。このゆで卵、パッケージには「1個あたり」って書いてある。でもネットで調べると「100gあたり142kcal」って出てくる。で、別のサイトでは「1個80kcal」。どれが本当なんですか。
楠木：どれも、たぶん本当です。
航：え。
楠木：数字が違うのは、どれかが嘘だからではなくて、「何をはかったか」が違うからです。今日はそこから始めましょう。栄養の勉強は、ほとんどの人がここでつまずきます。
楠木先生は立ち上がって、本棚から分厚い本を一冊抜き出した。表紙には『日本食品標準成分表』とある。
楠木：これが、栄養士がいちばん最初に手にする道具です。文部科学省が出している、食べ物の栄養の「台帳」のようなもの。いまの版は2020年に出た八訂で、2,000を超える食品が載っています。
航：辞書みたいですね。
楠木：辞書です。そして、この辞書にはひとつだけ決まりがあります。すべての数字が「可食部100gあたり」で書かれている。
航：かしょくぶ？
楠木：食べられる部分、という意味です。卵なら殻を除いた中身。魚なら骨や頭を除いた身。バナナなら皮を除いた実。そこを100gそろえて比べているから、卵と鶏肉とごはんを同じ物差しで並べられるんです。
航：なるほど……。じゃあ、この卵の「100gあたり142kcal」は、殻を除いた中身100gの話ってことですか。
楠木：そのとおり。では、ここからが本題です。あなたが手に持っている卵、Mサイズですよね。中身は何グラムだと思いますか。
航は卵を手のひらにのせて、少し考えた。
航：……60グラムくらい？
楠木：殻ごとならそのくらいです。殻はだいたい1割強なので、中身は約50gです。
航：じゃあ、142の半分で……71kcal。
楠木：正解です。
航：ということは、「1個80kcal」っていうのは？
楠木：Lサイズで計算しているか、昔の版の数字を使っているのかもしれません。成分表は版が変わると計算の方法も少し変わるんです。大事なのは、どの数字を見ても、「これは何gあたりの話か」を最初に確かめる習慣です。
航は、少し拍子抜けした顔をした。
航：なんか、思ってたのと違いますね。もっとこう、「卵は1日1個まで」とか、「夜は炭水化物を抜け」とか、そういうのを言われると思ってました。
楠木：そういうルールが知りたいですか。
航：……知りたい、です。正直。早く結果が出るなら。
楠木先生は、少しだけ笑った。
楠木：ルールは便利ですが、ルールだけで動く人は、ルールが合わなくなった日に止まります。旅行の日、接待の日、子どもの誕生日。そのたびに「今日はダメな日」になって、三日もすればやめてしまう。
航は黙った。図星だった。去年は糖質制限を二週間、その前は朝バナナを一週間。どれも、出張か飲み会で途切れた。
楠木：でも、数字の読み方を知っている人は、どんな日でも自分で計算できます。居酒屋でも、実家でも。私があなたに渡したいのは、ルールではなくて、物差しです。
航：物差し……。
楠木：使い方はひとつだけです。「100gあたりの値 × 実際に食べる重さ ÷ 100」。これだけ。
航：それだけ、ですか。
楠木：それだけです。ただ、「実際に食べる重さ」のところで、もうひとつだけ知っておくと便利な言葉があります。廃棄率。
航：はいきりつ。捨てる率？
楠木：そうです。成分表には、食品ごとに「買ったときの重さのうち、何%を捨てるか」も載っています。卵は殻の分で約14%。バナナは皮で約40%。
航：バナナ、半分近く皮なんですか。
楠木：店で1本150gのバナナを買っても、食べる実は90gくらい。お店の重さで計算すると、カロリーを多く見積もってしまう。逆に、骨つきの鶏肉や、頭つきの魚も同じです。だから栄養士は、いつも「この重さは、捨てる部分を含んでいるか」を気にします。
航は、ペンを持っていない自分に気づいて、スマートフォンのメモを開いた。「廃棄率」と打つ。変換候補に出てこなかったので、ひらがなで打った。
楠木：それと、この辞書を毎回持ち歩く必要はありません。文部科学省が「食品成分データベース」というサイトを無料で公開しています。食品名で検索すると、同じ数字がすぐに出てきます。
航：あ、それならスマホで見られる。
楠木：もうひとつ。あなたが持っているゆで卵のパッケージの裏、見てみてください。
航は袋を裏返した。小さな枠の中に、「栄養成分表示」とあった。熱量、たんぱく質、脂質、炭水化物、食塩相当量。
楠木：加工食品には、この5つの表示が法律で義務づけられています。そして、ここにも必ず「何あたり」が書いてある。1個あたり、1袋あたり、100gあたり。商品によってバラバラです。
航：本当だ。「1個（標準55g）あたり」って書いてある。
楠木：55gと書いてあるのは、たぶん殻つきか、少し大きめのサイズで計算しているんでしょう。そういうことがわかるようになると、数字に振り回されなくなります。
航：振り回されてたんですね、僕。
楠木：みんなそうです。数字が多すぎる時代ですから。
＊
楠木：もうひとつやってみましょう。ごはん。成分表では、炊いたごはん100gあたり156kcal。お茶碗に軽く1杯、だいたい150gです。
航：156×1.5で……234kcal。
楠木：鶏むね肉、皮なし。100gあたり105kcal。スーパーのパックは一枚250gくらいあります。
航：え、一枚で262kcalくらい？ ごはん1杯とそんなに変わらない。
楠木：そう。ではポテトチップス。100gあたり541kcal。一袋60gです。
航：……325kcal。ごはん1杯半ぶん。あんなに軽いのに。
楠木：その「あんなに軽いのに」という感覚を、これからたくさん集めていきます。重さとカロリーが一致しない食べ物を知ることが、いちばん役に立つんです。
航は、スマートフォンのメモに数字を書き写した。手が少し速くなっているのが自分でもわかった。
航：先生——あ、楠木さん。これ、全部の食べ物を覚えないといけないんですか。
楠木：まさか。私だって全部は覚えていません。よく食べるものを、三十個くらい。それで日常の八割はまかなえます。残りは、そのつど辞書を引けばいい。
航：三十個なら、なんとかなりそうです。
楠木：では今日の宿題です。
航：宿題があるんですか。
楠木：あります。明日から一週間、毎朝、体重を量ってください。それと、食べたものを「何をどれくらい」で書き留めてください。カロリーは書かなくていい。重さの見当だけでいいです。
航：重さ、わかるかな。
楠木：わからなければ、わからないと書けばいい。「ごはん、たぶん茶碗1杯」で十分。大事なのは正確さより、書くことです。
＊
帰りの電車で、航はもう一度ゆで卵の袋を見た。「1個あたり」の下に、小さく内容量が書いてあった。今まで一度も見たことのない欄だった。
家に着くと、洗面所の奥に押し込んであった体重計を引っ張り出した。電池が切れていた。コンビニに電池を買いに行きながら、航は、自分が少しだけ楽しんでいることに気づいた。
＊
翌朝。体重計は77.9キロを示した。航はそれをメモに書き、続けて朝食を書いた。「ごはん 茶碗1杯」「ゆで卵 1個」「みそ汁」。
台所で、六歳の娘の結衣が、卵の殻をむくのに苦戦していた。
結衣：パパ、なに書いてるの。
航：今日たべたもの。
結衣：なんで？
航は少し考えた。「痩せるため」と言いかけて、やめた。
航：パパの体が、何でできてるか知りたいから。
結衣：たまごでできてるの？
航：ちょっとはね。
結衣は、むきかけの卵をじっと見て、それから殻をていねいに皿のはしに置いた。
結衣：じゃあ、これは食べないところ。
航は、思わず吹き出した。廃棄率、約14%。昨日覚えたばかりの言葉が、六歳の手の中にあった。
＊
その日の昼、航はコンビニで、いつものおにぎりを手に取ってから、裏を見た。「1個あたり 熱量180kcal」。ツナマヨは、235kcalだった。昆布にした。
大したことではない。たった55kcalの差だ。でも、選んだ理由が自分でわかっている選択をしたのは、ずいぶん久しぶりな気がした。
ルールは、まだ何ももらっていない。それなのに、なぜか、次に何をすればいいかはわかっていた。`,

＊
楠木先生はノートを開いて、三つの文字を書いた。P、F、C。
楠木：食べ物の中で、エネルギーになるものは、大きく三つしかありません。たんぱく質、Protein。脂質、Fat。炭水化物、Carbohydrate。頭文字をとってPFCと呼びます。
航：ビタミンとかは？
楠木：ビタミンやミネラルは、体の調子を整える大事な栄養素ですが、エネルギー、つまりカロリーにはなりません。カロリーを決めているのは、このPFCだけです。それと、アルコール。
航：アルコールも入るんですか。
楠木：入ります。それは後で。まず、それぞれ1gあたり、どれくらいのエネルギーになるか。
楠木先生は、P・F・Cの下に数字を書き足した。4、9、4。
楠木：たんぱく質は1gあたり約4kcal。炭水化物も約4kcal。でも脂質だけは、約9kcal。2倍以上です。
航：脂質だけ、そんなに。
楠木：アトウォーターという人が100年以上前に示した係数で、いまも基本はこの考え方です。アルコールは1gあたり約7kcal。
航は自分の記録を見直した。唐揚げ、ポテトチップス、ビール。
航：……なんか、見えてきました。
楠木：何が見えましたか。
航：重さじゃないんですね。何でできているか、なんだ。
楠木：そう。ポテトチップスは、重さのおよそ3分の1が脂質です。60gの袋なら、脂質が約21g。それだけで190kcal近くになります。ごはん150gには脂質がほとんどなくて、中身はほぼ炭水化物と水です。だから、重いのにカロリーは控えめ。
航：水か。ごはんって水が多いんですね。
楠木：炊いたごはんは、6割くらいが水です。野菜も果物も、ほとんどが水。逆に、油はほぼ100%が脂質です。オリーブオイル大さじ1杯、12gで約107kcal。
航：大さじ1杯で、卵1個半。
楠木：今、自然に卵で換算しましたね。
航は、言われて初めて気づいた。先週覚えた数字が、勝手に物差しになっていた。
＊
楠木：せっかくなので、ひとつ試してみましょう。先週お話しした、パッケージの裏の栄養成分表示。あれを使うと、「4・9・4」が本当かどうか、自分で確かめられます。
楠木先生は、引き出しからサラダチキンの空き袋を取り出した。
航：なんでそんなもの持ってるんですか。
楠木：教材です。読んでみてください。
航：1袋あたり、熱量112kcal。たんぱく質24.0g、脂質1.5g、炭水化物0.5g。
楠木：では、PFCから計算してみて。
航はノートに書いた。24×4で96。1.5×9で13.5。0.5×4で2。
航：……111.5。ほぼ112だ。
楠木：ぴったりではないこともありますが、たいていの食品は、この計算で表示とだいたい合います。合わないときは、食物繊維が多い食品か、アルコールが入っているか、あるいは糖アルコールのような特殊な甘味料が入っているかです。
航：食物繊維は違うんですか。
楠木：食物繊維は、人の消化酵素ではほとんど分解できません。でも、腸内細菌が少し分解してくれるので、1gあたり約2kcalとして計算します。八訂からは、このあたりもきちんと分けて計算されるようになりました。
航：ややこしいけど、なんか面白いですね。答え合わせができるのが。
楠木：その「答え合わせができる」という感覚を、大事にしてください。誰かが言った数字を信じるのではなく、自分で確かめられる。それが、物差しを持つということです。
＊
航：さっき、アルコールは後でって言ってましたよね。
楠木：言いました。あなたの記録にビールが多いので、ちょうどいい。
航は、少し身構えた。
楠木：ビール350ml缶1本は、約140kcal。そのうち、アルコール由来がおよそ90kcalです。アルコールは約13g入っていて、1gあたり約7kcalですから。
航：残りは？
楠木：炭水化物です。麦芽の糖ですね。
航：じゃあ、糖質ゼロのビールなら、ほとんどゼロカロリー？
楠木：糖質はゼロでも、アルコールのカロリーは残ります。それに、アルコールにはもうひとつ特徴があります。体はアルコールをためておく場所を持っていないので、飲むと、ほかの栄養素より先にアルコールを処理しようとする。そのあいだ、脂肪を燃やす作業は後回しになりがちです。
航：飲んでるあいだは、脂肪が減りにくい。
楠木：それに加えて、飲むと食欲が増えて、つまみの揚げ物に手が伸びやすくなる。あなたの記録でも、ビールの日は唐揚げとセットになっていますね。
航：……セットです。完全に。
楠木：お酒そのものより、「お酒とセットになっているもの」を見ていくと、変えやすいところが見つかります。
＊
航：あと、ずっと気になってたんですけど、「糖質」と「炭水化物」って同じものですか。糖質制限のときは、糖質って言葉ばっかり見てたんですけど。
楠木：近いけれど、同じではありません。炭水化物は、糖質と食物繊維を合わせたものです。炭水化物から食物繊維を引いた残りが、糖質。
航：じゃあ、食物繊維が多い食べ物は、炭水化物の数字のわりに糖質が少ない。
楠木：そうです。オートミールや玄米、さつまいもは、白いごはんやパンより食物繊維が多い。同じ炭水化物の量でも、血糖値の上がり方がゆるやかになりやすく、腹持ちもよくなります。
航：糖質制限のとき、オートミールって糖質多いからダメって書いてあるサイトもありました。
楠木：オートミールは、30gで炭水化物が約21g。そのうち食物繊維が約3gです。糖質としては18gほど。ごはん1杯の3分の1くらいですね。
航：食べていいかダメかじゃなくて、どれくらいかで見ればいいのか。
楠木：そう。どんな食べ物も、量と組み合わせしだいです。「この食べ物はダメ」と決めるのは、物差しを捨てて、ルールに戻るということなんです。
航は、二週間で挫折した糖質制限のことを思い出した。毎日、何が「ダメ」かを覚えるのに疲れていた。
＊
航：じゃあ、脂質を減らせばいいってことですか。油を全部やめれば。
楠木：また、ルールを欲しがりましたね。
航：……すみません。
楠木：謝ることはありません。そう考えるのは自然です。でも、脂質はホルモンの材料にもなりますし、ビタミンAやDのように、脂と一緒でないと吸収されにくい栄養素もあります。ゼロにするのは、体にとって良いことではない。
航：じゃあ、どうすれば。
楠木：「どこで多くとっているか」を知ることです。あなたの記録を見ると、脂質が多いのは、揚げ物、スナック菓子、それとマヨネーズですね。
航：マヨネーズ、そんなに書いてました？
楠木：サラダに「マヨ多め」が三回。マヨネーズは大さじ1杯で約80kcal。ほぼ全部が脂質です。
航は、頭をかいた。サラダを食べているから健康的だと思っていた。
＊
楠木：もうひとつ、大事な話をしておきます。この成分表のカロリー、実は八訂から計算の方法が変わりました。
航：変わった？
楠木：以前は、P・F・Cをざっくり測って係数をかけていました。八訂からは、アミノ酸や脂肪酸、糖の種類など、より細かい成分から計算するようになったんです。その結果、たとえばごはん100gは、以前の168kcalから156kcalになりました。
航：12kcalも違う。
楠木：何が言いたいかというと、カロリーの数字は、どこまでいっても「目安」だということです。食べ物によって、体がどれだけ吸収するかも少しずつ違う。だから私は、数字を信じすぎないでほしいんです。
航：じゃあ、何を信じれば。
楠木：あなたの体重計です。数字で見当をつけて、体重で答え合わせをする。その往復が、いちばん確かです。
＊
相談が終わる頃、航は自分のノートに大きく「4・9・4」と書いた。その横に、「重さじゃない、中身」。
楠木：今週の宿題です。記録はそのまま続けてください。それに加えて、一日一回だけでいいので、「これは主に何でできているか」を考えてみてください。PなのかFなのかCなのか。
航：一日一回なら。
楠木：それと、火曜日のポテトチップスは、やめなくていいです。
航：え、いいんですか。
楠木：嫌なことがあった日に、何かで自分をなぐさめるのは、人間として自然なことです。ただ、次にそういう日が来たら、袋の裏を一度だけ見てから食べてください。それだけでいい。
航は、少し考えてからうなずいた。叱られると思っていた。でも、この人は一度も「ダメ」と言わない。
部屋を出るとき、航はふと振り返った。
航：楠木さんは、ポテトチップス食べるんですか。
楠木：好きですよ。うすしお。
楠木先生は、本棚に成分表を戻しながら、何でもないように答えた。`,
pt:"カロリーを決めるのはP・F・C（＋アルコール）。1gあたり P4・F9・C4・アルコール7。いちばん効くのは脂質。",
q:["脂質1gあたりのエネルギーは約何kcal？","9kcal","4kcal","7kcal","12kcal"],
e:"P・Cは約4kcal、Fは約9kcal、アルコールは約7kcal。大さじ1杯のオリーブ油（12g）だけで約107kcalになります。",
r:"日本食品標準成分表（八訂）・アトウォーター係数"},

{s:"栄養士の基本",t:"自分に必要なカロリーを出してみる",sub:"答えは体重計の中にある",
body:`三回目の相談の日、航は少し不満そうだった。
航：二週間記録して、体重はほとんど変わってません。77.6キロ。正直、何のためにやってるのか、わからなくなってきました。
楠木：わからなくなってきた。正直でいいですね。
航：だって、痩せるために来てるんですよ。記録して、PFCを考えて、それで終わりじゃ意味ないじゃないですか。
楠木：ちなみに、火曜日のポテトチップスはどうでしたか。
航：……また食べました。木曜日に。でも、ちゃんと袋の裏は見ました。541kcal、100gあたり。1袋60gで325kcal。脂質は21g。見たら、半分でいいかなって思って、半分残して輪ゴムでとめました。
楠木：残りは？
航：次の日に食べました。
楠木：それで十分です。一度に325kcal食べるのと、二日に分けるのとでは、合計は同じでも、あなたの中で起きたことはまったく違う。
航：何が違うんですか。
楠木：「つい食べた」が、「選んで食べた」に変わった。行動を変えるのは、たいていそこからです。
航は、そう言われても、まだピンとこなかった。体重が減っていないのだから。
航：でも、結局、体重は変わってないんです。
楠木先生は、怒るでも慌てるでもなく、航の記録を自分の方に向けた。
楠木：では今日、その「意味」をお見せします。この二週間の記録が、あなたにしか作れない答えになっているんです。
＊
楠木：その前に、一般的な計算から。人が一日に必要なエネルギーは、ざっくり言うと「何もしなくても使う分」と「動いて使う分」の合計です。
航：何もしなくても使う分？
楠木：基礎代謝です。心臓を動かす、呼吸する、体温を保つ。寝ていても使うエネルギー。厚生労働省の「日本人の食事摂取基準」には、年齢と性別ごとに、体重1kgあたりの基礎代謝の目安が載っています。基礎代謝基準値といいます。30歳から49歳の男性なら、体重1kgあたり約22.5kcal。
航：僕は78キロだから……22.5×78で、1,755kcal。
楠木：計算が速くなりましたね。
航：毎日やらされてますから。
楠木先生は、少し笑ってから続けた。
楠木：その基礎代謝に、身体活動レベルという係数をかけます。デスクワーク中心でほとんど動かない人は1.5。座り仕事でも通勤や家事で動く「ふつう」の人は1.75。立ち仕事や運動習慣がある人は2.0。
航：営業なんで、外回りもあるけど、車移動が多いです。
楠木：では、1.5から1.75のあいだでしょうね。計算してみてください。
航：1,755×1.5で……約2,630。1.75だと、約3,070。
楠木：これが、教科書的な「あなたの一日に必要なエネルギー」です。
航：3,000kcalも食べていいんですか？ そんなに食べてないと思うけど。
楠木：そこです。
＊
楠木先生は、航の二週間の記録を指でとんとんと叩いた。
楠木：この二週間、あなたの体重はほとんど変わらなかった。食べたものも、だいたい同じくらい。ということは、何がわかりますか。
航は記録を見つめた。少しして、顔を上げた。
航：……今食べてる量が、ちょうど釣り合ってる量ってことですか。
楠木：そうです。それが「維持カロリー」。教科書の計算はあくまで推定です。同じ体重でも、筋肉の量や、日々の動き方で、実際の消費は何百kcalも違う。でも、体重が二〜三週間変わらない食べ方をしているなら、それがあなたの本当の答えです。
航：じゃあ、この二週間は無駄じゃなかったってこと？
楠木：無駄どころか、いちばん大事な二週間でした。あなたは、自分の「ゼロ地点」を見つけたんです。
航は、自分のメモを見返した。その数字が、急に違うものに見えた。
＊
航：でも、教科書の計算と、僕の実際の量がずれるのはなんでなんですか。2,630と3,070の間って、けっこう幅がありますよね。
楠木：いい質問です。一日のエネルギー消費は、大きく三つに分けられます。ひとつ目が基礎代謝で、全体の6割くらい。ふたつ目が、食べたものを消化・吸収するときに使うエネルギーで、1割くらい。食事誘発性熱産生といいます。
航：食べるだけでエネルギーを使うんですか。
楠木：使います。しかも栄養素によって違う。たんぱく質は、食べたエネルギーの2〜3割を消化と代謝で使います。炭水化物は1割未満、脂質はさらに少ない。
航：たんぱく質、得なんですね。
楠木：少しだけ。ただ、それだけで痩せるほどの差ではありません。大事なのは三つ目です。活動で使うエネルギー。これには、ジムでの運動のような「意図した運動」と、それ以外の日常の動きがあります。歩く、立つ、階段を上る、家事をする、子どもと遊ぶ。この「運動ではない日常の動き」をNEATと呼びます。
航：ニート？
楠木：非運動性熱産生、の英語の頭文字です。実は、人によっていちばん差が出るのが、ここなんです。同じ体格の人でも、よく動く人と座りっぱなしの人で、一日に数百kcal違うことがあります。
航：数百kcal。ごはん2杯分くらい。
楠木：週に一回ジムで1時間走るより、毎日こまめに歩くほうが、合計では大きいこともある。
航は、自分の一日を思い浮かべた。車で移動して、商談先ではほとんど座っている。会社に戻ればデスク。帰りは駅まで車で迎え。
航：……僕、ほとんど動いてないかも。
楠木：それも、記録してみるとわかります。スマートフォンの歩数計、見てみてください。
航が画面を開くと、先週の平均は一日4,200歩だった。
楠木：今のところ、何かを変えなくていいです。ただ、知っておいてください。「食べる量を減らす」以外にも、天秤を動かす方法はある。
＊
楠木：もうひとつ大事なこと。毎朝の体重は、日によって1キロくらい平気で上下します。
航：します。昨日、ラーメン食べた次の日に一気に増えてて、焦りました。
楠木：それは脂肪ではなく、ほとんどが水分です。塩分の多い食事のあとは、体が水をため込みます。炭水化物を多くとった日も、筋肉にグリコーゲンという形でためるときに水が一緒にくっつく。だから、一日の数字に一喜一憂しないこと。
航：じゃあ、何を見れば。
楠木：一週間の平均です。七日分を足して七で割る。それを週ごとに並べて、下がっていれば順調、変わらなければ維持。アプリを使っているなら、移動平均の線を見てください。
航：あ、それ、グラフに出てます。ギザギザの線と、なめらかな線。
楠木：なめらかな方が、あなたの体の「本当の声」です。
航は、ある朝のことを思い出した。体重が前の日より0.9キロ増えていて、洗面所で「うわ」と声を出した。妻の千夏が後ろから覗き込んで、「昨日ラーメン食べたからでしょ」と言った。そのときは、なぐさめられたのか、からかわれたのか、わからなかった。
航：妻のほうが、わかってたのかもしれません。
楠木：奥さんは、何と？
航：ラーメン食べたからでしょ、って。
楠木：正解です。翌朝の体重は、前の晩の食事の「重さ」と「塩分」をそのまま映します。脂肪が1日で0.9キロ増えるには、6,000kcal以上余分に食べる必要がありますから。
航：ラーメン何杯分だろう。
楠木：あまり計算したくない数字ですね。
二人は、そこで初めて声を出して笑った。
＊
航：じゃあ、痩せたい場合は、維持カロリーからどれくらい減らせばいいんですか。
楠木：よく「脂肪1kgは約7,000kcal」と言われます。一日500kcal減らせば、二週間で約1kg、という計算です。
航：わかりやすい。
楠木：わかりやすいけれど、実際はその通りにはいきません。食べる量を減らすと、体は少しずつ省エネになっていく。だから最初は計算通りに減っても、だんだん鈍くなります。それに、どれくらいのペースで減らすのがいいかは、また別の話です。それは、筋トレの話をするときにしましょう。
航：筋トレ……。正直、そっちはまだ自信ないです。
楠木：今日はそこまでで十分です。
＊
帰り際、航は立ち止まった。
航：楠木さん。最初の日に「数字は目安だ、体重で答え合わせする」って言ってましたよね。あれ、今日やっとわかりました。
楠木：そうですか。
航：計算って、答えを出すためじゃなくて、答え合わせの見当をつけるためにあるんですね。
楠木先生は、ほんの一瞬、驚いたような顔をした。
楠木：……それは、私が十年かけてわかったことです。
航：え。
楠木：来週から、少しだけ食べる量を変えてみましょう。どこを変えるかは、あなたが決めてください。記録を見れば、もうわかるはずです。
航は、記録のなかのポテトチップスと、「マヨ多め」の文字を思い浮かべた。答えは、たしかにもう、そこに書いてあった。`,
pt:"推定エネルギー必要量＝基礎代謝基準値×体重×身体活動レベル。本当の答えは、体重の週平均が変わらない食べ方。",
q:["体重70kg・活動レベル「ふつう（1.75）」・基礎代謝基準値22.5kcal/kgの推定エネルギー必要量は？","約2,760kcal","約1,575kcal","約2,100kcal","約3,500kcal"],
e:"22.5 × 70 × 1.75 ≒ 2,756kcal。基礎代謝（約1,575kcal）だけを答えにしないこと。",
r:"厚生労働省 日本人の食事摂取基準（2020年版）基礎代謝基準値・身体活動レベル"},

{s:"栄養士の基本",t:"はからなくても量が分かる「手ばかり」",sub:"居酒屋で、手を見る",
body:`その週、航は初めて「失敗」を報告しに来た。
航：金曜日、取引先との飲み会でした。記録しようとしたんですけど、大皿料理って、何をどれだけ食べたか全然わからなくて。結局、途中でメモするのやめちゃいました。
楠木：途中まではメモしていたんですね。
航：唐揚げのあたりまでは。
楠木：では、唐揚げまでの記録は役に立ちます。それに、その「わからなかった」という経験が、今日の話にぴったりです。
＊
楠木：この一か月、あなたは食べ物の重さを見当で書いてきました。家では、量りを使いましたか。
航：最初の週だけ。ごはんと鶏肉を何回か量って、あとは目分量です。
楠木：それで正解です。毎食キッチンスケールで量る人は、まず続きません。私たちの現場でも、量るのは最初だけにして、あとは「手」を物差しにする方法をよく使います。
航：手？
楠木：自分の手は、どこにでも持っていけますから。居酒屋にも、取引先の接待にも。
楠木先生は自分の右手を開いて、テーブルの上に置いた。
楠木：手のひら。指を除いた部分の大きさと厚み。これと同じくらいの肉や魚が、だいたい100g前後です。
航は、自分の手のひらを見た。
航：思ったより小さいですね。ステーキって、もっとでかい。
楠木：レストランのステーキは200gや300gが多いですから、手のひら2〜3枚分ですね。では、鶏むね肉の皮なし100g、たんぱく質は何gでしたか。
航：……23g、ですよね。成分表で見ました。
楠木：鮭は100gで約22g。豚ヒレで約22g。豚ロースは脂身があるので約19g。こうしてみると？
航：だいたい20g前後。
楠木：そう。肉や魚は「手のひら1枚で、たんぱく質約20g」と覚えておけば、外でも大きく外しません。
＊
楠木先生は、今度は手を握った。
楠木：握りこぶし。これが、ごはんお茶碗1杯の目安です。約150g、234kcal。
航：あ、それなら居酒屋の締めのおにぎりも計算できる。
楠木：コンビニのおにぎりは、ごはんが100〜110gくらいです。こぶし1つより少し小さい。
航：じゃあ、両手は？
楠木：両手に山盛りの野菜が、1食分の野菜の目安です。野菜はカロリーが低いので、多めに越したことはありません。ゆでたブロッコリーなら小房5つで、たったの23kcal。
航：油は？ 前回、大さじ1杯で107kcalって聞いて、ちょっと怖くなったんですけど。
楠木：親指の先、第一関節から先くらいの量で、小さじ1杯弱。大さじ1杯の3分の1くらいです。
航：親指の先でも、35kcalくらい。
楠木：油は見えにくいので、外食では多めに見積もっておくくらいがちょうどいいです。
＊
航：でも、これって精度は低いですよね。人によって手の大きさも違うし。
楠木：いい疑問です。たしかに、量りより精度は落ちます。でも、ふたつ理由があって、私はこの方法をすすめています。ひとつは、手の大きさは体の大きさにある程度比例するので、体の大きい人ほど少し多めに見積もる形になること。
航：なるほど、自動で調整されるのか。
楠木：もうひとつは、「続くこと」です。
楠木先生は、そこで少し間を置いた。
楠木：あなたは最初の日、早く結果が出るルールを欲しがりました。
航：……覚えてます。
楠木：完璧な方法で一週間やるより、そこそこの方法で一年続けるほうが、結果はずっと大きい。手ばかりは、そこそこの方法です。でも、どこにでも持っていけて、一年続けられる。
＊
楠木：手ばかりと一緒に覚えておくと便利な考え方が、もうひとつあります。日本の栄養指導で昔から使われている、「主食・主菜・副菜」です。
航：給食で聞いたことがある気がします。
楠木：主食は、ごはん・パン・麺。エネルギーの中心になる炭水化物。主菜は、肉・魚・卵・大豆製品。たんぱく質の中心。副菜は、野菜・きのこ・海藻・いも。ビタミン、ミネラル、食物繊維の中心です。
航：それぞれ、手ばかりでいうと。
楠木：主食がこぶし1つ、主菜が手のひら1枚、副菜が両手に山盛り。これが、1食のひとつの目安になります。もちろん体の大きさや目的で変えますが、まずはこの形がそろっているかを見る。
航：計算しなくてもいいんですね。
楠木：形がそろっていれば、数字は大きく外れません。逆に、数字を合わせても形が崩れていると、どこかに無理が出ます。たとえば、カロリーを抑えようとしてサラダだけの昼食にすると、主菜がなくてたんぱく質が足りないし、主食がなくて午後に集中力が落ちる。
航：……それ、先月やってました。サラダとサラダチキンだけ。夕方に限界が来て、帰りにコンビニでパン2個食べてました。
楠木：よくある流れです。昼に抑えたぶんを、夕方にまとめて取り返してしまう。
＊
楠木：せっかくなので、ちょっと外に出ましょうか。
航：外？
楠木：このビルの一階、コンビニがありますよね。
五分後、二人は冷蔵ケースの前に立っていた。楠木先生は、腕を組んで航を見た。
楠木：今日の昼ごはんを、ここで組み立ててみてください。手ばかりと、主食・主菜・副菜で。
航は、おにぎりの棚、サンドイッチの棚、総菜のケースを行ったり来たりした。
航：主食は……おにぎり1個。こぶし1つより少し小さいけど。主菜は、焼き鮭の総菜？ いや、こっちのサラダチキンのほうが手のひら1枚に近い。副菜は、このカップのほうれん草のおひたしと、ミニサラダ。
楠木：両手山盛りには、少し足りませんね。
航：じゃあ、野菜スープも。
楠木：いい組み合わせです。値段も見ましたか。
航：……あ、680円。いつもの唐揚げ弁当と同じくらいだ。
楠木：栄養のことを考えると高くつく、と思われがちですが、組み立て方しだいです。
航：これ、裏の表示を足したら何kcalくらいになるんだろう。
楠木：足してみてください。答え合わせです。
航は、四つの袋の裏を見ながら、スマートフォンの電卓を叩いた。おにぎり180、サラダチキン112、おひたし30、サラダ20、スープ60。
航：402kcal。たんぱく質は……29g。
楠木：形をそろえただけで、カロリーはほどほど、たんぱく質はしっかり。計算は、あとからの答え合わせで十分なんです。
レジに向かいながら、航は、先週まで唐揚げ弁当の前で一秒も迷わなかった自分を思い出していた。
＊
航：金曜日の飲み会、手ばかりで考え直してみてもいいですか。
楠木：やってみましょう。
航は記録を開いて、思い出しながら指を折った。
航：唐揚げ、5個くらい食べてて、あれは……手のひら1枚ちょっと？ 刺身の盛り合わせを少し。手のひら半分くらいかな。枝豆。焼きそばを取り分けで、こぶし1つくらい。ビールが中ジョッキ3杯……。
楠木：そこまで思い出せれば上出来です。
航：思い出しながら、ビール3杯が一番効いてるってわかりました。
楠木：ジョッキ1杯で、だいたい350ml缶1本分くらいの量です。1本約140kcal。
航：3杯で、ごはん2杯近く。
楠木：そうですね。でも、飲み会に行くなとは言いません。仕事の一部ですし、楽しい時間でもある。
航：また「やめなくていい」って言うんですね。
楠木：言います。代わりに、「何杯目まで」と自分で決めて行ってみてください。決めるのは私ではなく、あなたです。
＊
その夜、航は妻の千夏に、コンビニでの話をした。
千夏：先生と一緒にコンビニ行ったの？ 授業参観みたい。
航：ほんとにそんな感じだった。見られてると思うと、緊張して。
千夏：で、何買ったの。
航が説明すると、千夏は自分の手のひらを開いて、まじまじと見た。
千夏：私の手のひら、あなたより小さいよ。
航：だから、体の小さい人は自然に少なめになるんだって。うまくできてるよね。
千夏：ふうん。じゃあ、うちの晩ごはんも手で見てみてよ。
その日の献立は、豚の生姜焼きと、ほうれん草のごま和えと、豆腐のみそ汁だった。航は皿の上に手をかざした。
航：肉は手のひら1枚ちょっと。ごはんはこぶし1つ。副菜は……両手には足りないかな。でも、みそ汁に豆腐がある。主食、主菜、副菜、全部そろってる。
千夏：当たり前でしょ。毎日そうしてるんだから。
航は、箸を持ったまま、しばらく黙った。毎日、目の前にあったのに、何も見えていなかった。
航：……いつも、ありがとう。
千夏は、変な顔をして笑った。
＊
翌日の帰り道、航は駅前の定食屋の前で立ち止まった。ショーケースの生姜焼き定食を見て、無意識に手のひらを開いていた。
肉は、手のひら1枚半。ごはんは、こぶし2つぶん。キャベツは、片手。
航は、ショーケースの前で小さく笑った。一か月前の自分なら、これを見ても「うまそう」としか思わなかった。今は、うまそうな上に、中身が見える。
ごはんを半分にしてもらおうか、と少し考えて、やめた。今日は筋トレをする予定はない。でも、明日は、楠木さんにまだ聞いていない「たんぱく質」の話を聞く日だ。だから今日は、手のひら1枚半の肉を、ちゃんと食べておこうと思った。
自分で決めた、ということが、なぜか少し誇らしかった。`,
pt:"手のひら1枚の肉・魚 ≒ 100g ≒ たんぱく質20g。握りこぶし1つ ≒ ごはん1杯。両手山盛り ≒ 1食の野菜。",
q:["手のひら1枚分（約100g）の鶏むね肉（皮なし）に含まれるたんぱく質は？","約23g","約5g","約50g","約12g"],
e:"鶏むね皮なしは100gあたりたんぱく質23.3g。肉・魚は「100gで約20g」とまとめて覚えると便利です。",
r:"日本食品標準成分表（八訂）"},

{s:"栄養士の基本",t:"たんぱく質「○g」を、食べ物に置きかえる",sub:"「先生」と呼んだ日",
body:`五回目の相談の日、航は、ジムの会員証を持ってきた。
航：入会しました。週三回、仕事帰りに。
楠木：それは——おめでとうございます。
航：まだ二回しか来てないですけど。トレーナーさんに「たんぱく質を体重1kgあたり何gとってください」って言われて、ネットで調べたら、毎日100g以上必要みたいなことが書いてあって。
航は、困った顔でスマートフォンを見せた。
航：100gって、ステーキ100gのことじゃないですよね？ それくらいは、わかるようになりました。
楠木：わかるようになりましたね。
航：でも、じゃあ何をどれだけ食べればいいかは、全然わからないんです。
楠木：トレーナーさんには、聞かなかったんですか。
航：聞きました。そしたら、「とりあえずプロテイン飲んで、鶏むねとブロッコリー食べとけば大丈夫っすよ」って。
楠木先生は、少しだけ眉を上げた。
航：いや、悪い人じゃないんです。体もすごいし。でも、毎日鶏むねとブロッコリーって、僕には無理だと思うんです。妻のごはんもあるし、昼は社食だし、接待もあるし。
楠木：その感覚は、正しいと思います。鶏むねとブロッコリーは、たしかに優秀な食材です。でも、毎日それだけを食べる生活が続く人は、ほとんどいません。それに、トレーナーさんの言うことも間違ってはいない。ただ、あなたの生活に合う形に翻訳する必要があるだけです。
航：翻訳。
楠木：数字を、あなたの冷蔵庫と、あなたの社食と、あなたの家の食卓に置きかえる作業です。それができるのは、あなた自身だけです。
＊
楠木：では、一緒に組み立ててみましょう。あなたが最初に覚えた「物差し」を使えば、もうできるはずです。
楠木先生は、ノートに六つの食べ物を書いた。卵、納豆、牛乳、豆腐、鮭、鶏むね。
楠木：ふだんよく食べるもので、たんぱく質の量を見ていきます。成分表の100gあたりの値に、ふだん食べる量をかける。先週までにやってきたことと同じです。まず卵。100gあたり約12g。M玉の中身は？
航：50g。だから……約6g。
楠木：納豆、100gあたり16.5g。1パック40g。
航：6.6だから、約7g。
楠木：牛乳、コップ1杯200mlで約206g。100gあたり3.3g。
航：約7g。牛乳って意外とある。
楠木：木綿豆腐、100gあたり7.0g。半丁で150g。
航：10.5g。
楠木：鮭、1切れ80g。100gあたり22.3g。
航：……約18g。
楠木：鶏むね、手のひら1枚。
航：100gで23g。
航は、書き出した数字を見つめた。
航：卵6、納豆7、牛乳7、豆腐10、鮭18、鶏むね23。
楠木：それと、もうひとつ。ごはん1杯にも、たんぱく質が約4gあります。
航：ごはんにも？
楠木：炭水化物の印象が強いですが、穀物にもたんぱく質は含まれています。毎食食べるので、ばかにならない量です。
＊
楠木：では、あなたのふだんの食事に当てはめてみましょう。昨日、何を食べましたか。
航：朝は、卵かけごはんと納豆。昼は、社食で鶏むねのグリル定食。夜は、鮭の塩焼きと冷奴とごはん。あ、昨日は珍しく、かなりちゃんとしてます。
楠木：では、計算してみてください。
航はノートに書いた。
航：朝は卵6、納豆7、ごはん4で、17g。昼は、鶏むね23とごはん4で27g。夜は鮭18、豆腐10、ごはん4で32g……全部で76g。
楠木：かなりちゃんとした日で、76gです。
航：……足りないんですか。
楠木：あなたの体重は今、77キロ前後ですね。筋トレをする人のたんぱく質の目安については、次の章でしっかり話しますが、先に数字だけ言うと、体重1kgあたり1.6gくらいが目安です。
航：77×1.6で……123g。全然足りない。
楠木：「かなりちゃんとした日」で、まだ50g近く足りない。これが、多くの人の現実です。
＊
航は、しばらく黙ってノートを見ていた。
航：プロテイン、飲んだほうがいいですか。
楠木：飲んでもいいですし、飲まなくてもいい。どちらでも同じ数字に届きます。たとえば、さっきの一日に、牛乳1杯とヨーグルトを足せば約10g。夜の鮭をもう1切れにすれば18g。昼の鶏むねを手のひら1.5枚にすれば、さらに12g。
航：あ、それで116gくらい。
楠木：プロテイン1杯は、商品にもよりますが20g前後です。食事で足りない分を補う道具としては便利です。でも、魔法の粉ではありません。成分表のどの食べ物とも同じ、たんぱく質です。
航：なんか、プロテインって特別なものだと思ってました。
楠木：牛乳から作ったものが多いですから、言ってしまえば、乾燥させた牛乳の一部です。
航は、思わず笑った。
＊
航：でも、たんぱく質ならなんでも同じなんですか。肉の20gと、豆腐の20gって。
楠木：鋭い質問ですね。量が同じでも、「質」が少し違います。たんぱく質は、アミノ酸という小さな部品がつながってできています。体の中で使われるアミノ酸は20種類ほど。そのうち9種類は、体の中で作ることができないので、食べ物からとるしかありません。必須アミノ酸といいます。
航：9種類。
楠木：その必須アミノ酸が、体に必要なバランスでそろっているかどうかを点数にしたのが、アミノ酸スコアです。卵、牛乳、肉、魚、大豆は、ほぼ満点。お米や小麦は、リシンというアミノ酸が少なめで、点数が下がります。
航：じゃあ、ごはんのたんぱく質はダメなんですか。
楠木：ダメではありません。ごはんと納豆、パンと牛乳のように、組み合わせて食べれば、足りないアミノ酸をおたがいに補えます。日本の昔ながらの食事は、それを自然にやっているんです。
航：卵かけごはん、えらいな。
楠木：それと、筋肉にとって特に大事なのが、ロイシンというアミノ酸です。筋肉を作るスイッチを入れる役割があって、肉や魚、乳製品、卵に多い。プロテインに牛乳由来のものが多いのも、そのためです。
航：植物性だけだと、筋肉はつきにくいんですか。
楠木：同じ量なら、少し不利になることはあります。でも、量を少し多めにしたり、いろいろな食品を組み合わせたりすれば十分に補えます。大事なのは、ひとつの食品に頼りきらないことです。
＊
航：そういえば、厚生労働省の基準だと、たんぱく質ってどれくらいなんですか。
楠木：食事摂取基準では、成人男性の推奨量は1日65gです。
航：65g？ さっきの123gの半分くらいじゃないですか。
楠木：そこが大事なところです。推奨量は、ほとんどの人が「不足しない」ための量です。欠乏を防ぐための物差し。一方、筋トレで筋肉を増やしたい人がめざす量は、「筋肉を最大限に育てる」ための物差し。目的が違えば、数字も違います。
航：数字を見るときは、「何gあたり」だけじゃなくて、「何のための数字か」も見ないといけないんですね。
楠木先生は、少し黙って、航の顔を見た。
楠木：……今の、もう一度言ってもらえますか。
航：え？ 何のための数字か、も見ないといけない。
楠木：それは、一か月前のあなたには出てこなかった言葉です。
航は、照れくさくなって、ノートに目を落とした。
＊
相談の終わりに、楠木先生は航のノートを閉じて言った。
楠木：今日で、私があなたに渡したかった「道具」は、だいたいそろいました。
航：道具？
楠木：成分表の読み方。PFCとカロリーの関係。自分の必要量の出し方と、体重での答え合わせ。手ばかり。そして、たんぱく質を食べ物に置きかえる方法。この五つがあれば、たいていの栄養の話は、自分で確かめられます。
航は、この一か月を思い返した。最初の日、ゆで卵の数字がわからなくて、ルールばかり欲しがっていた。
航：最初の日、ルールをくださいって言ったじゃないですか。
楠木：言いましたね。
航：ルールはひとつももらってないのに、今は、自分で決められることが増えてます。何を食べるか、どれくらいか。飲み会で何杯までにするか。
楠木：それが、物差しを持つということです。
航は、少し言いよどんでから、顔を上げた。
航：あの。これから、楠木先生って呼んでもいいですか。
楠木先生は、ほんの少し目を細めた。
楠木：呼び方は、ご自由に。でも、ひとつだけ。
航：はい。
楠木：私は答えを教える人ではなくて、あなたが自分で答えにたどり着くのを、隣で見ている人です。それでもよければ。
航：それがいいです。
＊
その夜、航はジムの帰りにスーパーに寄った。カゴに入れたのは、卵のパック、納豆三個、ヨーグルト、それに鮭の切り身を二切れ。

航：数字を見たら、「何gあたり」「何のための」、それと「どれくらい確かか」。

航は、ノートに三つ書き並べた。最初の日に覚えたひとつ目から、もう二か月近くたっている。

楠木：いいところに気づきましたね。脂肪は、たんぱく質をほとんど必要としない組織です。だから、体脂肪がかなり多い人が、今の体重そのままで計算すると、必要以上に多い数字が出ることがあります。そういう人は、目標の体重や、脂肪を除いた体重をもとに計算するほうが現実的です。

楠木：BMIが26前後なら、そこまで気にしなくていいでしょう。ただ、目標体重の72キロで計算すると、1.6gで115g。今の体重で123g。その間のどこかに入っていれば十分です。

{s:"筋トレの栄養",t:"1日分を、3〜4回に分ける",sub:"朝ごはんの空白",
body:`次の週、航は記録の画面を見せながら、首をかしげていた。
航：先生、1日のたんぱく質、ちゃんと計算したんです。プロテイン1杯にして、平均で118g。ほぼ目標です。
楠木：きちんとやりましたね。
航：でも、なんか変なんです。並べてみたら、朝が12g、昼が30g、夜が60g、それと寝る前のプロテインが20g。夜にどかっと固まってる。
楠木先生は、うれしそうに目を細めた。
楠木：それに、自分で気づいたんですね。
航：気づいたっていうか、グラフにしたら、夜だけ山になってて。これ、いいのかなって。
楠木：今日は、まさにその話をしようと思っていました。
＊
楠木：筋肉は、一度作られたら終わりではありません。体の中では毎日、古い筋肉のたんぱく質が分解されて、新しく作り直されています。その「作る」側を、筋たんぱく質合成と呼びます。
航：毎日、作り直してる。
楠木：食事でたんぱく質をとると、血液の中のアミノ酸が増えて、合成のスイッチが入ります。でも、そのスイッチは、ずっと入りっぱなしではありません。数時間たつと、いったん落ち着く。
航：じゃあ、一回にたくさん食べても……。
楠木：それを確かめた研究があります。2013年のAretaらの研究。筋トレのあと12時間のあいだに、同じ80gのたんぱく質を、三つのやり方でとってもらいました。10gずつを1.5時間ごとに8回。20gずつを3時間ごとに4回。40gずつを6時間ごとに2回。
航：合計は全部80g。
楠木：そう。結果、筋たんぱく質の合成がいちばん高かったのは、20gを4回に分けた群でした。
航：10gを8回じゃないんですね。こまめなほうがいいのかと思った。
楠木：10gでは、一回あたりのスイッチが弱い。40gでは、回数が少なくて、スイッチの入っていない時間が長い。ちょうどいい「一回の量」と「回数」のバランスがあるんです。
＊
楠木：国際スポーツ栄養学会は、1回あたり体重1kgあたり約0.25g、量でいうと20〜40gを目安にしています。それを3〜4時間おきに。
航：0.25×77で……19g。20gくらい。
楠木：それと、前に少し話したロイシン。筋肉を作るスイッチ役のアミノ酸です。1回の食事で2〜3gくらいのロイシンが入ると、スイッチがしっかり入りやすいと考えられています。肉や魚、卵、乳製品を20〜30g分のたんぱく質でとれば、だいたい届く量です。
航：じゃあ、僕の朝の12gは。
楠木：スイッチが入りきらない可能性があります。それに、夕食の60gは、全部が無駄になるわけではないけれど、少し偏っている。
航：夜を減らして、朝に回せばいい？
楠木：夜を減らす必要はありません。朝を「足す」ほうが簡単です。
＊
楠木：あなたの朝ごはんは、たいてい何ですか。
航：卵かけごはんと、みそ汁。忙しいときはパンとコーヒーだけ。
楠木：卵かけごはんで、卵6g、ごはん4gで10g。パンとコーヒーだと、食パン1枚で5gくらいですね。
航：パンの日は、ほぼゼロに近いのか。
楠木：日本の朝食は、たんぱく質が少なくなりやすいんです。炭水化物中心で、主菜がない。では、どうすれば20gを超えますか。あなたが考えてみてください。
航は、いつもの台所を思い浮かべた。
航：卵かけごはんの日は……納豆を足せば7g増えて17g。ヨーグルトか牛乳を足せば、20gを超える。
楠木：パンの日は？
航：パンに、チーズとハム？ いや、卵を焼いて乗せて、牛乳を一杯。それなら、5と6と7で18g。もうひと声、ヨーグルト。
楠木：いいですね。どれも、特別な食材ではない。
航：コンビニのサラダチキンを朝に食べるのは、ありですか。
楠木：ありです。朝に鶏むねは、ちょっと重いと感じる人も多いですが、慣れればいちばん手軽な20gです。
＊
航：じゃあ、寝る前のプロテインは？ 夜に固まってるなら、あれはやめたほうがいいですか。
楠木：あれは、意外と悪くないんです。
航：え、そうなんですか。
楠木：寝ているあいだは、7時間も8時間も何も食べない、一日でいちばん長い空白です。その空白の前に、たんぱく質を入れておく。オランダのResらの研究では、夜にトレーニングしたあと、寝る前に40gのカゼインというたんぱく質をとると、寝ているあいだの筋たんぱく質の合成が高まりました。12週間続けた別の研究では、寝る前にとったグループのほうが、筋肉と筋力の伸びが大きかった。
航：カゼイン。
楠木：牛乳のたんぱく質の8割はカゼインです。ゆっくり消化されて、長くアミノ酸を出し続ける。だから、寝る前なら、プロテインでなくても、牛乳やヨーグルト、カッテージチーズでも代わりになります。
航：じゃあ、寝る前はそのままでいい。足すのは朝。
楠木：そう。夜を削る必要はない。朝の空白と、夜の空白、両方を埋めるイメージです。そうすると、自然と1日4回、たんぱく質が入る形になります。
航は、ノートに一日の線を引いて、そこに四つの点を打った。朝、昼、夜、寝る前。点と点の間が、だいたい4〜5時間ずつあいている。
航：なんか、きれいですね。
楠木：きれいな形は、続けやすいんです。
＊
楠木：もうひとつ、話しておきたいことがあります。年齢の話です。
航：年齢？
楠木：同じたんぱく質の量でも、年をとるにつれて、筋肉の反応が鈍くなっていきます。若い人なら1食あたり体重1kgあたり0.24gで足りる量が、高齢の人では0.4g近く必要だったという研究があります。
航：ほぼ倍。
楠木：だから、高齢の人ほど、1食ごとのたんぱく質をしっかりとることが大事になります。朝はおかゆと漬物だけ、という食事が続くと、筋肉はどんどん落ちていく。
航は、ふと、実家の父を思い浮かべた。六十八歳。最近、階段で手すりを使うようになった、と母が電話で言っていた。
航：……うちの父、朝はいつも、ごはんとみそ汁と漬物です。
楠木：今度、帰省したときに、卵をひとつ足してみてはどうでしょう。
＊
その夜、航は久しぶりに実家に電話をかけた。
父：なんだ、急に。
航：いや、最近、栄養の勉強しててさ。朝、卵食べてる？
父：卵？ 食べてないな。コレステロールが、とか言うだろ。
航は、少し考えた。それは、楠木先生にまだ聞いていない話だった。
航：それ、今度ちゃんと調べて教えるよ。とりあえず、朝に納豆かヨーグルトでも足してみて。たんぱく質ってのが、年とると余計に大事らしいから。
父：お前が親の食事に口出すようになるとはなあ。
電話の向こうで、父は笑っていた。迷惑そうではなかった。
電話を切ったあと、千夏が台所から顔を出した。
千夏：お義父さん、なんて？
航：卵は食べてないって。コレステロールが心配なんだってさ。
千夏：うちの父もそう言ってる。卵は一日一個まで、って。
航：それ、本当なのかな。
千夏：知らない。昔からそう言われてるもん。
航は、ふと、最初の日の自分を思い出した。「卵は1日1個まで」。あの日、ルールの例として、自分の口から出てきた言葉だった。
誰が決めたのかも知らないのに、みんなが知っているルール。それが本当かどうかを、自分で確かめたことは一度もなかった。
航：今度、先生に聞いてみる。
千夏：先生、先生って、最近そればっかり。
千夏は笑っていたが、少しだけ興味がありそうな顔もしていた。
＊
翌週の相談で、航は開口一番に言った。
航：先生、卵とコレステロールの話、教えてください。
楠木先生は、少し驚いた顔をした。航がノートを開く前に質問をしてきたのは、初めてだった。
楠木：それは、ビタミンやミネラルの章で、ちゃんと話しましょう。お父さんのためですか。
航：はい。あと、自分のためにも。
楠木：では、その質問、ノートに書いておいてください。忘れないように。
航のノートの最後のページに、「先生に聞くことリスト」という見出しが、その日はじめて書かれた。`,

{s:"筋トレの栄養",t:"「ゴールデンタイム30分」は、思ったより広い",sub:"会議が長引いた日",
body:`その日の航は、相談室に入ってくるなり、ため息をついた。
航：先生、昨日、最悪でした。
楠木：何がありましたか。

楠木：運動のあとは、筋肉がたんぱく質を取り込みやすい状態になっている。これは本当です。それで、「運動直後の30分が勝負」という話が広まりました。アナボリック・ウィンドウ、と呼ばれることもあります。

楠木：開いている時間が短い窓、というイメージですね。でも、研究を集めてみると、話はもう少しおおらかでした。2013年に、Schoenfeldらが、たんぱく質をとるタイミングについての研究をまとめたメタ解析を出しています。

楠木：前回の話を覚えていますか。証拠の強さ。

楠木：その結果、運動の直後にたんぱく質をとったグループのほうが、一見、筋肉や筋力が増えているように見えた。ところが、よく見ると、直後にとったグループは、1日のたんぱく質の合計量そのものが多かったんです。
航：あ。
楠木：合計量をそろえて分析し直すと、タイミングの差は、ほとんど消えました。
航：じゃあ、直後に飲んだから効いたんじゃなくて、たくさん飲んだから効いてた。

航：じゃあ、タイミングは全然関係ないんですか。
楠木：まったく関係ない、とまでは言いません。同じ研究者たちが、別の論文で、こう整理しています。トレーニングの前と後、それぞれ数時間以内に、たんぱく質を含む食事が1回ずつあれば、窓は十分に開いている。

航：昨日は、昼に鶏むねの定食を食べて、トレーニングが6時、夕食が10時くらい。

航：……無駄じゃなかった。
楠木：むしろ、とても良い一日です。

航：トレーニングの前は、どれくらい前に食べるのがいいんですか。直前に食べると、お腹が重くて。

航：脂質は、消化がゆっくり。

航：前にコンビニでやったやつだ。主食と、主菜の小さい版。

＊
航は、しばらくノートを見つめてから、顔を上げた。
航：先生、僕、またやってましたね。
楠木：何をですか。
航：ルールを欲しがるやつ。「30分以内」っていうルールを、自分で勝手に絶対にして、守れなかったら全部ダメって思ってた。最初の日と、同じです。
楠木先生は、すぐには答えなかった。窓の外を、少しのあいだ見ていた。
楠木：自分で、それに気づいたんですね。
航：今、話しながら。
楠木：私が言うより、ずっと意味があります。
航：でも、ルールって、なんでこんなに欲しくなるんでしょう。
楠木：ルールは、考えなくていいからです。考えるのは、疲れますから。忙しい人ほど、誰かに決めてほしくなる。それは悪いことではありません。ただ、ルールを守れなかったときに、全部を投げてしまうのが問題なんです。
航：全部かゼロか。
楠木：それが、多くの人が続かない理由です。30分を過ぎたから、もう今日は意味がない。お菓子を一つ食べたから、今日はもう好きに食べよう。そうやって、ひとつのルール違反が、全部の放棄につながる。
航は、アプリの中で読んだ、心の巻物の一枚を思い出していた。「全部かゼロか」の罠。読んだときは、他人事だと思っていた。
＊
楠木：では、あなたなら、どういう決まりにしますか。ルールではなく、自分のための決まりです。
航は、少し考えて、ノートに書いた。

{s:"筋トレの栄養",t:"筋肉を残してやせるペース",sub:"一週間で2.5キロ",
body:`六月の終わり。相談室の扉は、いつもより遠慮がちに叩かれた。
入ってきた航は、目の下にうっすら隈があった。椅子に座っても、しばらく何も言わなかった。
楠木：記録、見せてもらえますか。
航は、黙ってスマートフォンを差し出した。
楠木先生は、画面をゆっくりスクロールした。月曜日、76.0キロ。火曜日、75.3。水曜日、74.6。木曜日、74.1。金曜日、73.5。一週間で2.5キロ。食事の記録は、日に日に短くなっていた。金曜日は「サラダチキン、ゆで卵、プロテイン」だけ。
そして土曜日の欄には、何も書かれていなかった。日曜日の体重は、75.8キロ。
楠木：……土曜日に、何がありましたか。
航：……全部、食べました。
声が、少しかすれていた。
航：佐伯に、やせたって言われて、嬉しくなって。もっと早く落としたいと思ったんです。夏までに70キロ切りたくて。それで、1日1,500kcalにしました。最初の三日は順調で、どんどん減って、楽しかった。でも、木曜日あたりからジムで全然力が出なくなって、ベンチプレスの重さも下がって。家でも、娘にちょっとしたことでイライラして、怒鳴っちゃって。
楠木先生は、何も言わずに聞いていた。
航：土曜日、娘の誕生日だったんです。ケーキがあって、ピザがあって。一切れだけって思ったのに、気づいたら止まらなくて。夜中にコンビニまで行って、アイスとポテトチップス買って、全部食べました。袋の裏も、見なかった。
航は、そこで言葉を切った。
航：三か月、何やってたんだろうって。
＊
しばらく、部屋には時計の音だけがあった。
楠木：お話ししてくれて、ありがとうございます。

航は、うつむいたまま小さく笑った。

＊
楠木：一週間で2.5キロ減った。そのうち、脂肪はどれくらいだと思いますか。
航：……全部じゃ、ないですよね。
楠木：脂肪1kgがおよそ7,000kcal。あなたが一週間で削ったカロリーは、維持カロリーとの差で一日1,000kcalくらい、合計7,000kcal前後でしょう。つまり脂肪は、多くても1キロ。残りの1.5キロは、ほとんどが水分と、筋肉や肝臓にたまっていたグリコーゲンです。
航：グリコーゲン。
楠木：炭水化物をためておく形です。グリコーゲンは、1gあたり約3gの水と一緒にたまっている。食事を急に減らすと、グリコーゲンが使われて、水と一緒に一気に抜ける。だから最初の数日は、驚くほど体重が減ります。
航：それで、楽しかったのか。
楠木：そして、グリコーゲンは筋トレの燃料でもある。木曜日に力が出なくなったのは、そのせいです。食べた分が戻れば、水も戻る。日曜日に1.7キロ戻ったのは、脂肪がついたからではなく、ほとんどがその水です。
航は、顔を上げた。
航：じゃあ、土曜日に食べたことで、全部台無しになったわけじゃない？
楠木：一日で台無しになるほど、体は単純ではありません。土曜日に余分にとったのは、多く見積もっても2,000〜3,000kcal。脂肪にすれば数百gです。
＊
楠木：では、筋肉を残しながらやせるには、どれくらいのペースがいいか。競技者の減量について、研究をもとにした提言があります。2014年のHelmsらの論文では、1週間に体重の0.5〜1%のペースがすすめられています。
航：75キロなら……週に0.4〜0.75キロ。

＊

楠木：それも大きいと思います。お腹がすいている状態が続くと、集中力が落ちて、気持ちに余裕がなくなる。それに、睡眠はどうでしたか。
航は、PRIMEの睡眠の欄を開いた。月曜日は7時間。木曜日は5時間半。
航：……空腹で、夜中に目が覚めてました。
楠木：睡眠と食欲は、強くつながっています。睡眠を削った実験では、食欲を高めるホルモンが増えて、満腹を伝えるホルモンが減ることが示されています。つまり、寝不足の日は、意志の問題ではなく、体の仕組みとしてお腹がすく。
航：土曜日に止まらなかったのも。
楠木：空腹と寝不足が一週間たまったところに、ケーキとピザが目の前に出てきた。むしろ、よく金曜日までもちましたね。
航は、少しだけ肩の力が抜けた。
＊
楠木：減量中の空腹は、ゼロにはできません。でも、小さくすることはできます。ひとつ、たんぱく質を毎食入れる。たんぱく質は、満腹感が続きやすい栄養素です。ふたつ、野菜や海藻、きのこ、汁物でかさを増やす。カロリーが低くて、お腹がふくれる。みっつ、主食を食物繊維の多いものに一部置きかえる。そして、よっつ目。
航：寝る。
楠木：そうです。
航：全部、前に聞いたことばっかりですね。
楠木：減量のための特別な方法は、ほとんどありません。これまでの話を、少しずつ寄せていくだけです。
＊
楠木：少し、私の話をしてもいいですか。
航は、驚いて顔を上げた。楠木先生が自分のことを話すのは、陸上をやっていたと聞いた、あのとき以来だった。
楠木：大学二年の春、記録が伸び悩んでいました。コーチに「あと3キロ軽ければ」と言われて、私は一か月で5キロ落としました。最初は記録が出ました。でも、夏には走れなくなった。疲れが抜けない。生理が止まった。冬に、走っている途中で、すねの骨にひびが入りました。
航は、何も言えなかった。
楠木：当時は、それが「食べなさすぎ」のせいだとは、誰も教えてくれなかった。私自身、頑張りが足りないからだと思っていました。今は、運動の量に対して食べる量が足りないと、ホルモンや骨や心にまで影響が出ることがわかっています。その話は、いつか別の章でちゃんとします。
航：先生が、栄養士になったのは。
楠木：あのとき、隣に誰かいてほしかったからです。急いでいる人の隣で、「急がなくていい」と言える人が。
窓の外で、ジムのマシンが規則正しく動く音がしていた。
＊
楠木：土曜日のことは、記録に書いてください。「娘の誕生日。たくさん食べた」。それだけでいい。
航：ケーキとピザとアイスとポテトチップスって書きます。
楠木：正直でいいですね。そして、次の月曜日から、また普通に食べてください。急に減らして取り返そうとしないこと。

帰りぎわ、航は扉の前で振り返った。

楠木：先週、グリコーゲンの話をしましたね。炭水化物を、筋肉と肝臓にためておく形。
航：1gあたり、3gの水と一緒に。
楠木：そうです。体全体で、だいたい400〜500gくらいのグリコーゲンを持っています。その大部分は筋肉の中。そして、筋トレのような短くて強い運動では、このグリコーゲンが主な燃料になります。
航：脂肪じゃないんですか。
楠木：脂肪は、ゆっくり長く動くときの燃料として優秀です。歩く、軽く走る。でも、重いバーベルを持ち上げるような強い力は、すばやく取り出せる燃料が必要です。それが、グリコーゲン。
航：だから、1,500kcalにしてたとき、ベンチプレスが上がらなくなった。
楠木：燃料タンクが空に近かったんです。そして、空のタンクでトレーニングすると、セットの後半で粘れなくなる。トレーニングの質そのものが落ちる。
航：質が落ちると。
楠木：筋肉に届く刺激が弱くなります。つまり、筋肉を残したくてごはんを減らしているのに、結果として筋肉を育てる刺激を弱めてしまう。本末転倒なんです。
航は、自分のノートを見下ろした。「ごはん半分」の文字が並んでいる。
＊
航：でも、糖質制限で痩せたって人、たくさんいますよね。
楠木：いますね。それには理由があります。糖質を減らすと、まずグリコーゲンと水が抜けて、体重がすぐに落ちる。それに、食べられるものが減るので、結果として全体のカロリーも減りやすい。
航：じゃあ、効いてるんじゃ。
楠木：効いているのは、主に「カロリーが減ったこと」です。国際スポーツ栄養学会が、いろいろな食事法を比べた研究をまとめています。そこでは、たんぱく質の量と総カロリーをそろえて比べると、糖質を減らした食事が、体脂肪の減り方や筋肉の面で一貫して有利だという根拠はない、と整理されています。
航：カロリーとたんぱく質が同じなら、糖質が多くても少なくても、そんなに変わらない。
楠木：そうです。だから、どちらを選ぶかは、「自分が続けられるか」と「トレーニングの質を保てるか」で決めればいい。
航：僕は、糖質制限、二週間で挫折しました。
楠木：知っています。最初の日に聞きましたから。
＊
楠木：それと、炭水化物にはもうひとつ、大事な役割があります。脳です。
航：脳？
楠木：脳は、ふだんはほとんどブドウ糖だけをエネルギーにしています。1日におよそ120g前後のブドウ糖を使うと言われています。糖質をかなり減らすと、体は肝臓でケトン体という別の燃料を作って脳に回しますが、慣れるまでの間は、頭がぼんやりしたり、集中力が落ちたりしやすい。
航：糖質制限のとき、午後の商談で頭が回らなかったの、覚えてます。数字の計算を間違えて、上司に怒られた。
楠木：それも、ひとつの答え合わせですね。
航：営業って、頭の仕事でもあるんだな。
楠木：あなたの仕事に合わない食べ方は、どれだけ体重が落ちても、長くは続けられません。食事は、体のためだけでなく、あなたの一日のためにあるんです。
＊
楠木：では、どれくらい食べればいいか。筋力系のスポーツをする人では、1日に体重1kgあたり4〜7g程度の炭水化物が目安とされることが多いです。ただ、これは競技者の数字です。あなたは週3回のトレーニングと、ふだんは営業の仕事。
航：じゃあ、もっと少なくていい？
楠木：あなたの場合は、目安の数字より、やり方を考えたほうがいいと思います。航さん、ここからは、あなたが組み立ててみてください。
航：僕が？
楠木：材料は、もう全部持っています。PFCとカロリーの関係。維持カロリーと、体重の週平均。減量のペース。たんぱく質の量と配分。それと、今日のグリコーゲンの話。
航は、ペンを持ったまま、しばらく考えた。それから、ゆっくり書き始めた。
航：まず、たんぱく質は毎日同じ。123g前後を、朝昼晩に分ける。これは動かさない。
楠木：はい。
航：減量のペースは、週0.5キロ。だから、維持カロリーから一日400kcalくらい引く。
楠木：はい。
航：で、その400kcalを、どこから引くか。ごはんを減らすと、トレーニングの燃料が足りなくなる。だから、まず脂質から減らす。揚げ物、マヨネーズ、ポテトチップス、それとビール。それで足りなければ、トレーニングをしない日のごはんを少し減らす。
楠木：トレーニングの日は？
航：トレーニングの日は、ごはんを普通に食べる。特に、トレーニングの前の食事。昼にごはんをしっかり食べておけば、夕方のジムで力が出る。
楠木先生は、黙ってうなずいた。
航：……これ、合ってますか。
楠木：私が作っても、ほとんど同じものになります。
＊
航は、自分で書いたノートを見つめていた。
航：先生、これって、すごく普通ですよね。
楠木：普通です。
航：最初の日に、もっと特別なルールを期待してたんです。夜は炭水化物を抜け、とか。でも、結局、組み立ててみたら、普通のことしか書いてない。
楠木：栄養学の答えは、たいてい普通です。特別に見える方法は、多くの場合、普通のことのどこかを極端にしただけ。極端にすると、短い期間ははっきり効く。でも、続かない。
航：普通のことを、自分の生活に合わせて組み立てる。
楠木：それが、いちばん難しくて、いちばん効くことです。
＊
楠木：ひとつ、補足をしておきます。炭水化物の「質」の話です。
航：前に聞いた、食物繊維ですか。
楠木：そうです。同じ炭水化物でも、白いごはんやパンより、玄米、オートミール、さつまいも、そばのほうが、食物繊維が多い。腹持ちがよくて、血糖値の上がり方もゆるやかになりやすい。減量中に空腹がつらいなら、主食の一部をこういうものに置きかえるのも手です。
航：さつまいも、好きです。
楠木：蒸したさつまいも100gで、約131kcal。ごはん1杯の半分ちょっとで、食物繊維はごはん1杯の倍以上あります。
航：おやつにちょうどいい。
楠木：トレーニングの前の間食にも向いています。
＊
二週間後、航の記録には、ちょっとした変化が書き込まれていた。
月曜日、トレーニング日。夕方のジムで、ベンチプレスが、六月の最高記録に並んだ。昼は社食で、ごはんをふつうに食べていた。
水曜日、トレーニング日。スクワットの回数が、一回増えた。三時に、蒸したさつまいもを食べていた。
金曜日の夕食。結衣が、航のお茶碗をのぞきこんだ。
結衣：パパ、ごはん、またいっぱいになったね。
航：わかる？
結衣：ずっと半分だったもん。ママが「パパ、ごはんきらいになったのかな」って言ってた。
航は、台所の千夏のほうを見た。千夏は、聞こえないふりをして、みそ汁をよそっていた。
航：きらいになってないよ。ちょっと、こわかっただけ。
結衣：ごはんがこわいの？
航：何をしてくれてるか、知らなかったから。
結衣は、よくわからないという顔で、自分のごはんを口に入れた。それから、もぐもぐしながら言った。
結衣：ごはんは、走るための、ちから。
航：……誰に聞いたの。
結衣：先生。体育のとき、朝ごはん食べてきなさいって。
航は、思わず千夏と顔を見合わせた。どこの先生も、言うことは同じらしかった。
そして体重は、ごはんを戻したのに、週平均で0.4キロ減っていた。
航は、その数字を、相談の前日の夜に何度も見返した。体重が減ったことより、ごはんを食べて、力が出て、それでも減っていることのほうが、ずっと嬉しかった。
相談室で記録を見せると、楠木先生は短く言った。
楠木：燃料、戻りましたね。
航：戻りました。
楠木：ごはんは、まだ怖いですか。
航は少し考えてから、首を横に振った。
航：怖くなくなりました。何をしてくれてるか、わかったので。
楠木先生は、ファイルを本棚に戻しながら、小さくうなずいた。わからないものは怖い。わかれば、怖くなくなる。それは、この人が最初の日からずっと言い続けてきたことだった。`,
pt:"炭水化物は筋トレの主な燃料（グリコーゲン）。主食は抜かずに量で調整し、削るなら先に脂質とアルコールから。",
q:["たんぱく質と総カロリーをそろえた比較で、糖質制限食について言えることは？","筋肉・体脂肪の面で一貫した優位性は示されていない","筋肉が確実に増えやすい","体脂肪が2倍減る","筋トレの燃料として最適"],
e:"エネルギー収支とたんぱく質量をそろえると、食事の糖質比率による体組成の差はほとんど見られません。続けやすさとトレーニングの質で選べばよい。",
r:"Aragon AA et al. J Int Soc Sports Nutr 2017;14:16 / Slater G, Phillips SM. J Sports Sci 2011;29 Suppl 1:S67-77"},

{s:"サプリメント",t:"クレアチンは、いちばん根拠のあるサプリ",sub:"健診の赤い字",
body:`七月の半ば、航は会社の健診の結果を握りしめて相談室に来た。
航：先生、これ、見てください。腎臓の数字が、引っかかったんです。
用紙には、いくつかの項目に赤い字がついていた。クレアチニン、1.18。基準値の上限を、少しだけ超えている。その下に、「腎機能精査をおすすめします」とあった。
航：去年は0.95だったんです。こんなに上がるなんて、腎臓が悪くなったのかって。たんぱく質、とりすぎたのかなって。夜、眠れなくて。
楠木先生は、用紙を受け取って、しばらく見ていた。それから、静かに尋ねた。
楠木：航さん、最近、何か新しいサプリメントを飲み始めましたか。
航は、はっとした顔をした。
航：……クレアチン。佐伯にすすめられて、一か月前から。
楠木：それを、健診の問診に書きましたか。
航：書いてないです。サプリなんて、関係ないと思って。
楠木先生は、ほんの少し表情をゆるめた。
楠木：今日は、クレアチンの話をしましょう。そのあとで、この数字の話をします。
＊
楠木：サプリメントの多くは、正直に言えば、効果がはっきりしません。宣伝の言葉は強くても、証拠は弱い。でも、クレアチンは例外です。研究の量も質も、群を抜いています。国際スポーツ栄養学会は、クレアチンを「高強度の運動能力と除脂肪量を高める、もっとも効果的なサプリメント」と位置づけています。
航：佐伯も、そう言ってました。
楠木：クレアチンは、もともと体の中にある物質です。肝臓や腎臓で作られ、肉や魚からもとれます。筋肉の中では、クレアチンリン酸という形でたくわえられていて、短い時間に強い力を出すときの、エネルギーの予備になります。
航：グリコーゲンとは違うんですか。
楠木：役割が違います。グリコーゲンは、数十秒から数分の運動の燃料。クレアチンリン酸は、最初の数秒、いちばん強い力を出す瞬間の燃料です。バーベルを持ち上げる一回一回の、最初の爆発力。その予備が増えると、セットであと一回、二回が上がるようになる。
航：それが積み重なって、筋肉が育つ。
楠木：そうです。肉や魚にも入っていますが、筋肉の予備を満タンにするほど食べるのは、現実的ではありません。それで、サプリメントが役に立つ。
＊
楠木：飲み方は、どうしていますか。
航：佐伯に言われて、最初の一週間は一日20g、そのあとは毎日5gです。
楠木：ローディングという方法ですね。最初に体重1kgあたり0.3g、だいたい20gを5〜7日とって、早く筋肉の中を満たす。そのあと、1日3〜5gで維持する。間違ってはいません。
航：ローディング、しなくてもいいんですか。
楠木：しなくても、1日3〜5gを毎日とり続ければ、3〜4週間で同じところに届きます。急ぐ理由がなければ、お腹への負担も少ないので、そちらでも十分です。
航：急ぐ理由はないです。もう、急ぐのはやめたので。
楠木先生は、くすりと笑った。
航：そういえば、ローディングの一週間で、体重が1キロ増えたんです。またやらかしたかと思って焦りました。
楠木：それは、クレアチンのよく知られた作用です。クレアチンは筋肉の中に取り込まれるとき、水も一緒に引き込みます。だから、飲み始めの時期は、体重が1〜2キロ増えることがあります。
航：グリコーゲンと同じだ。水と一緒にたまる。
楠木：そうです。脂肪が増えたわけではありません。週平均の体重で見ると、その後はまた同じペースに戻っているはずです。
航は記録を見た。たしかに、ローディングの週に跳ね上がった線は、そのあと元の傾きに戻っていた。
航：先に知ってたら、焦らなかったのにな。
楠木：サプリメントを始めるときは、何が起きるかを先に調べておく。それも、袋の裏を見るのと同じ習慣です。
＊
航：体の中でも作られてるなら、なんでわざわざ飲むんですか。
楠木：量の問題です。体の中では、1日に1g前後のクレアチンが作られ、食事からもとっています。一方で、毎日だいたい2gくらいが分解されて出ていく。ふつうの食事でも、その出入りはだいたい釣り合っています。でも、筋肉の予備を「満タン」にするには、そこから上乗せが必要なんです。
航：肉をたくさん食べれば？
楠木：生の牛肉や魚1kgで、クレアチンは数g程度です。毎日5g分を食事だけでとろうとすると、肉を1キロ以上。現実的ではないでしょう。
航：1キロは無理です。
楠木：もうひとつ。もともと肉や魚をあまり食べない人、たとえば菜食の人は、筋肉の中のクレアチンが少なめなので、サプリメントの効果が出やすいと言われています。逆に、肉や魚をたくさん食べている人では、効果が小さく感じられることもある。同じものを飲んでも、反応には個人差があるんです。
楠木：長期の安全性も、健康な人ではよく調べられています。腎臓や肝臓の機能を悪くするという証拠は、健康な人では見つかっていません。
航：じゃあ、この数字は。
＊
楠木：クレアチニンという名前、クレアチンと似ていると思いませんか。
航は、用紙をもう一度見た。
航：……あ。
楠木：クレアチニンは、筋肉の中のクレアチンが分解されてできる、いわば「燃えかす」です。毎日、ほぼ一定の量ができて、腎臓から尿に捨てられる。腎臓の働きが落ちると、捨てきれずに血液の中にたまる。だから、血液のクレアチニンは、腎臓の働きの目安として使われています。
航：でも、クレアチンを飲めば。
楠木：筋肉の中のクレアチンが増えます。そのぶん、燃えかすのクレアチニンも増える。腎臓が悪くなっていなくても、血液のクレアチニンは少し上がるんです。筋肉量が増えても、同じように上がります。
航：じゃあ、僕の数字は、腎臓じゃなくて。
楠木：その可能性が高いと思います。ただ、ここから先は、私の領域ではありません。
楠木先生は、まっすぐ航を見た。
楠木：私は管理栄養士で、医師ではありません。この数字が何を意味しているかを判断するのは、医師です。必ず受診してください。そして、そのときに、クレアチンを飲んでいること、筋トレを始めたことを、ちゃんと伝えてください。
航：伝えたら、どうなるんですか。
楠木：医師が考えることですが、たとえば、シスタチンCという、筋肉の量やクレアチンの影響を受けにくい別の腎臓の指標で確かめる、という方法があります。あるいは、しばらくクレアチンを止めて測り直す。いずれにしても、情報がなければ、医師は正しく判断できません。
航：問診に書かなかったの、まずかったですね。
楠木：まずかった、というより、もったいなかった。サプリメントも、食べているものの一部です。体に入れたものは、全部、記録に残す。それは、最初の日からやってきたことと同じですよ。
＊
一週間後、航は近所の内科を受診した。若い医師は、問診票の「クレアチン 5g/日、筋トレ週3回」の欄を見ると、ああ、とうなずいた。
医師：たぶん、それですね。念のため、シスタチンCも測っておきましょう。
数日後に出た結果は、基準値の中だった。尿の検査にも異常はなかった。
医師：腎臓は問題ないと思います。クレアチンを続けるなら、来年の健診でも、そのことを書いておいてください。毎回これで呼ばれるのも、面倒でしょうから。
病院を出たとき、航は、ふっと肩の力が抜けるのを感じた。
＊
次の相談で、航は結果を報告した。
航：シスタチンC、正常でした。先生の言ったとおりでした。
楠木：よかった。でも、判断したのはお医者さんですよ。
航：わかってます。でも、先生が「受診して、全部伝えて」って言ってくれなかったら、たぶん怖くてクレアチンだけやめて、病院には行かなかったと思います。
楠木：それが、いちばん困るパターンです。原因がわからないまま、不安だけが残る。
航：あと、佐伯にも言っておきました。健診の前に、問診に書いとけって。
楠木：先輩らしくなってきましたね。
航は、照れくさそうに頭をかいた。
航：先生、今回、思ったんです。栄養の知識って、自分の体のことだけじゃなくて、人に伝えるときにも役に立つんだなって。医者に、ちゃんと説明できたんです。何を、どれくらい、いつから飲んでるか。
楠木：それができる患者さんは、実は多くありません。
航：記録、続けててよかったです。
楠木先生は、ノートの最後のページを指さした。「先生に聞くことリスト」。その下に、新しい行が増えていた。「クレアチニンとクレアチン：自分で説明できるようになった」。
楠木：これは、聞くことリストではなくて、もう「わかったことリスト」ですね。
航は、その見出しの横に、小さく「わかったこと」と書き足した。`,
pt:"クレアチンは1日3〜5gを毎日。血清クレアチニンが少し上がることがあるので、健診や受診では必ず伝える。",
q:["国際スポーツ栄養学会が示すクレアチンの維持量は？","1日3〜5g","1日0.3g","1日20gをずっと","週に1回10g"],
e:"維持量は1日3〜5g。ローディング（約20g/日 × 5〜7日）は任意で、なくても3〜4週間で筋内貯蔵は満たされます。血清クレアチニンの軽い上昇は腎障害を意味しないことが多いが、判断は医師に。",
r:"Kreider RB et al. J Int Soc Sports Nutr 2017;14:18"},

{s:"サプリメント",t:"カフェインは、量とタイミングで使う",sub:"眠れない理由",
body:`八月。航は、相談室に入るなり、スマートフォンの画面を楠木先生のほうへ向けた。
航：先生、今日は先に、僕から見せたいものがあります。
画面には、PRIMEの睡眠の記録が並んでいた。寝た時刻と起きた時刻、そこから計算された睡眠時間。航は、その横に自分で印をつけていた。
航：最近、ジムに行く日だけ、眠れないんです。それで、記録を見直してみました。ジムの日は、平均で5時間半。行かない日は、6時間50分。
楠木：一時間以上の差ですね。
航：最初は、筋トレで興奮してるのかと思ったんです。でも、よく考えたら、ジムの日だけ、プレワークアウトを飲んでました。佐伯がくれた、トレーニング前に飲むやつ。
楠木：成分表示は、見ましたか。
航：見ました。1杯に、カフェイン200mg。
航は、少し得意げな顔をした。
航：袋の裏、見る癖がついたので。
＊
楠木先生は、記録の画面をじっと見ていた。それから、ゆっくり顔を上げた。
楠木：航さん。今日の話は、私がする必要がないかもしれません。
航：え。
楠木：あなたはもう、自分で原因を見つけかけています。私は、それを確かめる材料を足すだけにしましょう。
＊
楠木：まず、カフェインそのものは、悪者ではありません。むしろ、スポーツの世界では、効果がはっきりしている数少ない成分です。国際スポーツ栄養学会は、2021年の声明で、カフェインが筋力や持久力、集中力をはっきり高めることをまとめています。
航：じゃあ、プレワークアウトは効いてる。
楠木：おそらく、効いています。目安は、体重1kgあたり3〜6mgを、運動の約60分前。あなたは74キロですから。
航：222mgから444mg。200mgは、下限よりちょっと少ないくらいか。
楠木：コーヒー1杯、150mlでカフェインはだいたい90mg。2杯で下限に近づきます。
航：コーヒー2杯分なら、そんなに多くない気がする。
楠木：量は、多くありません。問題は、時間です。
＊
楠木：カフェインは、体の中で半分に減るまで、平均で5時間前後かかると言われています。人によって、3時間の人もいれば、7時間以上かかる人もいる。
航：半分になるまで、5時間。
楠木：あなたは何時に飲んでいますか。
航：ジムが7時からなので、6時に飲んでます。
楠木：寝るのは。
航：12時くらい。
楠木：6時間後です。そのとき、体の中にはまだ、飲んだ量の半分近くが残っている計算になります。
航：……コーヒー1杯分くらい、まだ入ってる状態で寝てるのか。
楠木：Drakeらの研究では、寝る0時間前、3時間前、6時間前に400mgのカフェインをとってもらって、睡眠を家で測りました。6時間前にとった場合でも、睡眠時間ははっきり短くなっていた。だから、少なくとも寝る6時間前からは、まとまった量のカフェインを控えることがすすめられています。
航：6時間前でも、ダメなんだ。
楠木：しかも、本人は「よく眠れた」と感じていても、測ってみると眠りは浅くなっていることがあります。
航：コーヒー以外にも、カフェインって入ってますよね。
楠木：たくさんあります。成分表で見ると、煎茶は100mlあたり約20mg。紅茶は約30mg。玉露は約160mgで、実はコーヒーよりずっと多い。エナジードリンクやコーラにも入っていますし、チョコレートにも少し含まれます。
航：玉露、そんなに。
楠木：見落としやすいのは、「一日の合計」です。朝のコーヒー2杯、昼のお茶、午後の缶コーヒー、夕方のプレワークアウト。足していくと、すぐに数百mgになります。健康な大人では、一日400mgくらいまでなら、健康への悪影響は考えにくいとされています。妊娠中の人などは、もっと少なくする必要があります。
航は、昨日の自分の一日を指で数えた。朝のコーヒー1杯、営業先で出されたコーヒー1杯、午後の缶コーヒー、プレワークアウト。
航：……たぶん、450mgくらいいってます。
楠木：トレーニングの前に効かせたいなら、その日のほかのカフェインを減らすのも手です。同じ量でも、ふだんとりすぎていると、効き目を感じにくくなることもありますから。
航は、自分の記録を見下ろした。
航：これ、睡眠時間だけじゃなくて、質も落ちてたのかもしれない。
＊
楠木：では、どうしますか。
楠木先生は、それだけ聞いて、黙った。
航は、しばらく考えた。
航：選択肢は、三つくらいあると思います。ひとつ、プレワークアウトをやめる。でも、効いてるなら、もったいない。ふたつ、量を半分にする。でも、時間が同じなら、根本的には変わらない。みっつ、トレーニングの時間を変える。
楠木：みっつ目は、できますか。
航：……朝なら。会社の近くのジム、朝6時からやってるんです。週3回のうち、2回を朝にして、そのときだけプレワークアウトを飲む。夜の日は、カフェインなしにする。
楠木：朝のトレーニングは、続けられそうですか。
航：わかりません。でも、試してみる価値はある気がします。記録で、確かめられるので。
楠木：では、それでやってみてください。二週間後、睡眠の記録を見せてもらえますか。
航：はい。
＊
次の週の月曜日、朝5時半。目覚ましの音で起きた航は、しばらく布団の中で天井を見ていた。
起きられるかどうか、正直、自信がなかった。でも、前の晩、トレーニングウェアを枕元に出しておいた。靴下まで。MINDのタブで読んだ「環境を、やる側に倒しておく」の一枚を思い出して、試してみたのだ。
着替えて、バナナを1本食べて、プレワークアウトを半分だけ水に溶かした。前の晩に計算しておいた。半分で100mg。バナナは、燃料。
朝6時のジムは、思っていたより人がいた。スーツをロッカーにかけた会社員、白髪の男性、若い女性。みんな、黙々と自分のメニューをこなしていた。
トレーニングを終えて、シャワーを浴び、コンビニでおにぎりとサラダチキンと牛乳を買って、会社の近くの公園で食べた。朝の光が、まだやわらかかった。
その日の午後、航は、いつもより頭がすっきりしていることに気づいた。商談の資料を作りながら、夕方までまったく眠くならなかった。
そして、その夜、ベッドに入って五分もしないうちに、眠っていた。
＊
楠木：ひとつ、私からも足しておきます。夜の日にカフェインをやめると、最初のうちは、トレーニングで力が出にくく感じるかもしれません。でも、それは「カフェインに頼っていた分」が見えただけです。よく眠れた日の体のほうが、長い目で見れば、ずっとよく動きます。
航：睡眠が、筋トレより大事？
楠木：比べるものではありません。どちらも、体を作る土台です。筋肉は、トレーニングの最中ではなく、休んでいるあいだに作り直されます。睡眠が削られると、その作り直しの時間も削られる。
航は、MIND のタブで読んだ一枚を思い出していた。七時間の睡眠が、すべての土台。あのときは、読んで終わりだった。
＊
二週間後。航の記録には、きれいな変化が出ていた。
朝トレーニングの日、睡眠は平均6時間40分。夜トレーニングでカフェインなしの日、6時間35分。休みの日、6時間50分。ジムの日だけ極端に短い、という山は、消えていた。
航：先生、見てください。差が、ほとんどなくなりました。
楠木先生は、記録をゆっくりスクロールした。それから、意外なことを言った。
楠木：この記録、コピーをもらってもいいですか。
航：え、いいですけど。何に使うんですか。
楠木：ほかの相談者の方に、見せたいんです。「カフェインの時間を変えたら、こうなった人がいる」と。もちろん、名前は出しません。
航は、驚いて、それから少しくすぐったい気持ちになった。
航：先生が、僕から何かもらうの、初めてですね。
楠木：そうですね。
楠木先生は、少しだけ笑った。
楠木：教えている側も、相談者の方の記録から学ぶことのほうが多いんですよ。本に書いてあることを、本当に生活の中で確かめてくれるのは、いつも相談者の方ですから。
航は、自分の記録が、誰かの役に立つかもしれないということを、しばらく考えていた。四か月前、ゆで卵のカロリーがわからなくて、この部屋に来た自分の記録が。`,
pt:"カフェインは体重×3〜6mgを運動の約60分前。半減期は約5時間。寝る6時間前からはまとまった量を控える。",
q:["Drake ら（2013）の研究で、就寝6時間前にカフェイン400mgをとった場合について示されたことは？","睡眠が有意に妨げられた","睡眠への影響はまったくなかった","深い睡眠が増えた","入眠が早くなった"],
e:"0・3・6時間前のいずれでも、プラセボに比べて睡眠が有意に妨げられ、6時間前でも睡眠時間の短縮は無視できない大きさでした。",
r:"Guest NS et al. J Int Soc Sports Nutr 2021;18:1 / Drake C et al. J Clin Sleep Med 2013;9:1195-1200"},

{s:"スポーツ医学",t:"汗で減った体重は、水で戻す",sub:"教える側の椅子",
body:`八月の終わり、記録的な暑さが続いていた。
その日、相談室の扉を開けたのは、航ひとりではなかった。後ろに、日焼けした若い男性が、少し気まずそうに立っていた。
航：先生、すみません。後輩の佐伯です。どうしても一緒に話を聞きたいって。
佐伯：佐伯です。突然すみません。
楠木：どうぞ。椅子をもうひとつ出しましょう。
佐伯は、腰を下ろすと、すぐに話し始めた。
佐伯：先週の日曜、会社の仲間とフットサルをやったんです。屋外のコートで。後半、急に頭が痛くなって、足がつって、気持ち悪くなって。青木さんが気づいて、日陰に連れて行って、スポーツドリンクを飲ませてくれて。
航：熱中症の手前だったと思います。
佐伯：俺、ちゃんと水は飲んでたんです。ペットボトル1本。でも、それじゃ足りなかったみたいで。
楠木先生は、佐伯の話を聞いてから、航のほうを見た。
楠木：航さん、そのとき、何を考えて動きましたか。
航：え。
楠木：あなたが判断したのでしょう。何を見て、何をしたか、教えてください。
＊
航は、少し戸惑ってから、話し始めた。
航：佐伯は、試合前に体重を量ってたんです。最近、俺がうるさく言ってるので。72キロ。で、ばてたあと、念のためにコートの横の事務所の体重計で量ったら、70.3キロでした。
楠木：どれくらい減っていましたか。
航：1.7キロ。体重の2%を超えてました。
佐伯：2%って、そんなにまずいんですか。
航は、楠木先生のほうを見た。先生は、軽くうなずいた。「続けて」という意味だと、航にはわかった。
航：体重の2%以上の水分が抜けると、持久力も、集中力も、はっきり落ちることがわかってる。それに、体温を下げる汗が出にくくなって、熱中症のリスクも上がる。前に、アメリカのスポーツ医学会の資料で読んだ。
佐伯：1.7キロ分も、汗かいてたんだ。
航：試合前と後の体重の差が、そのまま汗の量の目安になるんだよ。1キロ減ってたら、だいたい1リットル。脂肪じゃなくて、ほとんど水。お前はペットボトル1本、500ml飲んでたから、実際は2リットル以上汗をかいてた計算になる。
佐伯：……2リットル。
＊
楠木先生は、そこで初めて口を開いた。
楠木：飲ませたのは、水ではなくスポーツドリンクでしたね。
航：はい。汗には塩分が入ってるから、水だけだと、塩分が足りなくなるかもしれないと思って。あと、足がつってたので。
楠木：正しい判断です。汗をたくさんかいたときに、水だけを大量に飲むと、血液の中のナトリウムが薄くなりすぎることがあります。低ナトリウム血症といって、ひどいときは意識が悪くなる。だから、長い時間、汗をたくさんかく運動では、塩分を含む飲み物が向いています。
佐伯：飲みすぎも、まずいんですか。
楠木：飲みすぎも、まずいことがあります。大事なのは、出た分を、出た分だけ戻すことです。
楠木先生は、ノートを佐伯のほうへ向けた。
楠木：運動のあとは、減った体重の1.2〜1.5倍くらいの量を、数時間かけて飲みます。尿で出ていく分があるので、減った分ぴったりでは足りないんです。1.7キロ減っていたなら、2リットルから2.5リットル。一気にではなく、少しずつ。
佐伯：そんなに。
楠木：そして、いちばん大事なのは、そうなる前に防ぐことです。のどが渇いたと感じたときには、もう少し水分が足りなくなり始めています。暑い日の運動は、こまめに、少しずつ。
佐伯：汗の塩分って、どれくらい出てるんですか。
楠木：人によって大きく違います。汗1リットルあたり、食塩にしてだいたい1〜3gくらい。帽子やシャツに白い塩のあとが残る人は、多いほうです。
佐伯：俺、黒いTシャツが真っ白になります。
楠木：では、あなたは塩分を多く失うタイプかもしれません。そういう人ほど、水だけでなく、塩分の入った飲み物や、梅干し、みそ汁のような食事で補うことが大事です。
＊
航：先生、もうひとつ。同じ暑さでも、夏の初めのほうがきつい気がするんです。
楠木：それは、暑熱順化という体の仕組みです。暑い環境で少しずつ体を動かしていると、1〜2週間ほどで、汗をかき始めるのが早くなって、汗の塩分も薄くなっていく。体が暑さに慣れて、熱を逃がすのがうまくなるんです。
佐伯：じゃあ、俺がばてたのって。
楠木：ふだんエアコンの効いた部屋とジムで過ごしていて、いきなり真夏の屋外で全力で動いた。体が慣れていない状態だったんでしょう。暑い季節の初めや、久しぶりの屋外の運動は、時間と強度を控えめにして、体を慣らしていくことが大事です。
航：暑さ指数も見るといいって、テレビでやってました。
楠木：WBGTですね。気温だけでなく、湿度や日差しも含めた指標です。環境省が毎日、地域ごとに出しています。数字が高い日は、運動そのものを見合わせる判断も必要です。
佐伯は、スマートフォンにメモをとりながら、しみじみと言った。
佐伯：知らないって、怖いですね。
航は、その言葉を、自分も何度も心の中で言ってきたことを思い出していた。
＊
楠木：もうひとつ、航さんに聞きたいことがあります。
航：はい。
楠木：体重の2%、汗の量の計算、スポーツドリンク。どこで覚えましたか。
航は、少し考えた。
航：最初は、PRIMEのFUELのところで読みました。でも、本当にわかったのは、自分でジムの前と後に体重を量るようになってからです。夏になって、トレーニングのあとに1キロ減ってる日があって、最初は脂肪が燃えたって喜んでたんです。でも、次の朝には戻ってて。あ、これは水なんだって。
楠木：自分の体で確かめた。
航：先生がいつも言ってることです。数字で見当をつけて、体重で答え合わせする。
＊
相談が終わる頃、佐伯はノートいっぱいにメモをとっていた。
佐伯：青木さん、すごいですね。なんでも知ってる。
航は首を横に振った。
航：全然。五か月前まで、ゆで卵のカロリーもわからなかった。
佐伯：え、マジっすか。
航：100gあたりと、1個あたりの区別がつかなかったんだよ。
佐伯は、信じられないという顔で、航と楠木先生を見比べた。楠木先生は、何も言わずに微笑んでいた。
佐伯が先に部屋を出たあと、航は、少しだけ残った。
＊
航：先生。今日、変な感じでした。
楠木：どういうふうに。
航：先生の前で、佐伯に説明してて。間違ってたらどうしようって、ずっと緊張してて。でも、先生が途中で口を挟まなかったから、たぶん、大きくは間違ってなかったんだろうなって。
楠木：大きくどころか、ほとんど間違っていませんでした。
航：先生、最初から、こうなるってわかってたんですか。
楠木先生は、窓の外に目をやった。ジムの中では、夕方の会員たちが、汗を流しながらマシンを動かしていた。
楠木：わかっていた、というより、こうなってほしいと思っていました。いちばん深く学べるのは、人に教えるときです。教えようとすると、自分がどこまでわかっているか、どこがあいまいか、全部見えますから。
航：インプットより、アウトプット。
楠木：それも、MINDのところで読みましたか。
航：読みました。樺沢先生の。
楠木先生は、少しだけ声を出して笑った。
楠木：もう、教える側の椅子に座っていますね。
＊
帰り道、空はまだ明るかった。十月の運動会まで、あと七週間。小学校に上がって初めての運動会で、保護者リレーの出場者を募集する紙が、昨日、結衣のランドセルから出てきた。
千夏は「今年も出るの？」と半分からかうように聞いた。航は「出る」と答えた。
体重は、73キロになっていた。四月から5キロ。ペースは、週に0.3キロ弱。最初に思い描いていたよりずっと遅い。でも、ベンチプレスは、四月より15キロ重いものが上がるようになっていた。
走れるかどうかは、走ってみないとわからない。でも、今の自分なら、走ったあとに何が起きているかは、説明できる。汗の量も、燃料のことも、息が上がる理由も。
航は、楠木先生のノートの最後のページを思い出していた。最初は「先生に聞くことリスト」だった見出しの横に、自分で書き足した「わかったこと」の文字。その下の行は、もう二十を超えていた。
そして、その次のページには、まだ何も書かれていない。ビタミン、ミネラル、骨のこと、先生が若いころに走れなくなった理由のこと。聞きたいことは、まだたくさんある。
次の相談は、来週の火曜日だった。`,
pt:"運動前後の体重差 ≒ 汗の量（1kg ≒ 1L）。体重の2%を超えない。運動後は減った分の1.2〜1.5倍を、塩分も含めて数時間かけて戻す。",
