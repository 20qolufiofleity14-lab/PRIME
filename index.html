楠木：自分で引けるようになりましたね。
航：最初の日に、この本の使い方を教わったので。
楠木：その185mgという数字を、どう考えるか。日本人の食事摂取基準では、以前はコレステロールに「この量までにしましょう」という上限の目標がありました。
航：それが、一日一個の根拠ですか。
楠木：たぶん、そのあたりから広まった話でしょう。でも、2015年版の改定で、その上限の目標はなくなりました。食事のコレステロールと、病気になるリスクの関係について、はっきりした上限を決めるだけの根拠が十分ではない、という理由です。
航：なくなったんですか。
楠木：ただし、ここが大事なところです。2020年版でも、すでに脂質異常症、つまり血液のコレステロールが高いと診断されている人については、重症化を防ぐために、食事のコレステロールを1日200mg未満にするのが望ましい、と書かれています。
航：200mg未満なら……卵1個で、ほぼいっぱいだ。
楠木：そうです。だから、「卵は一日一個まで」は、ある人にとっては正しく、ある人にとっては根拠のないルールなんです。
航は、しばらく黙っていた。
航：また、「何のための数字か」だ。
楠木：そして、「誰のための数字か」。
＊
楠木：せっかくなので、卵そのものの話もしておきましょう。卵は、ときどき「完全栄養食品」と呼ばれます。
航：完全。
楠木：ひよこ一羽が、殻の中の材料だけで育つわけですから。たんぱく質はアミノ酸スコアが満点。ビタミンA、D、E、B群、鉄、亜鉛。足りないのは、ビタミンCと食物繊維くらいです。
航：ビタミンCがないのは、なんでですか。
楠木：鳥は、体の中で自分でビタミンCを作れるからだと考えられています。人やサルは、進化の途中で、その能力を失ってしまった。だから、食べ物からとるしかないんです。
航：人間のほうが、不便なんだ。
楠木：そのぶん、果物や野菜を食べる楽しみがありますね。それに、卵は安くて、どこでも手に入って、料理の幅も広い。1個約71kcalで、たんぱく質が約6g。朝のたんぱく質を足すのに、これほど便利な食べ物は、ほかにあまりありません。
航：父の朝ごはんに足したかったのも、それなんです。
楠木：お父さんにとって卵が「怖いもの」なら、まずは怖いかどうかを確かめるところからですね。
＊
楠木：もうひとつ、知っておいてほしいことがあります。血液の悪玉コレステロール、LDLを上げやすいのは、食事のコレステロールよりも、飽和脂肪酸のほうだと考えられています。
航：ほうわしぼうさん。
楠木：肉の脂身、バター、生クリーム、ラードなどに多い脂です。常温で固まる脂、と覚えておくとわかりやすい。食事摂取基準では、大人は1日のエネルギーの7%以下を目標にしています。
航：じゃあ、卵を避けて、そのかわりにベーコンとかソーセージを食べてたら。
楠木：本末転倒ですね。卵には、良質なたんぱく質も、ビタミンもたくさん入っています。一個の卵を怖がるより、食事全体の脂の種類と量を見るほうが、ずっと意味があります。
＊
楠木：さて、お父さんの話に戻りましょう。
航：はい。
楠木：お父さんが「医者に言われた」のが、健診で脂質異常症を指摘されたからなのか、それとも昔、なんとなく言われたことなのか。それによって、答えはまったく変わります。もし、今まさに治療中なら、卵の数を決めるのは、私やあなたではなく、お父さんの主治医です。
航：僕が勝手に「もっと食べていいよ」って言うのは。
楠木：危ないこともあります。あなたが今日知ったのは、「卵は一日一個まで」が、全員に当てはまるルールではないということ。それだけです。お父さんに当てはまるかどうかは、お父さんの体の数字を知っている人が決めます。
航は、ノートに書いた。「知識は、相手の状態を知ってから使う」。
＊
その週末、航は、運動会の日程を伝えるために実家に電話した。
父：十月の何日だ。
航：第二日曜。結衣の、小学校の初めての運動会だから、見に来てよ。
父：行くよ。母さんも楽しみにしてる。
航は、少し間を置いてから切り出した。
航：あのさ、前に、卵は一日一個までって医者に言われたって言ってたじゃん。あれ、いつの話？
父：いつだったかな。十年くらい前の健診で、コレステロールが高めだって言われてな。そのとき、近所のかかりつけの先生に。
航：今も、薬とか飲んでる？
父：いや、飲んでない。そのあと数値は下がったから、もう何も言われてない。
航：今年の健診の結果、見せてもらってもいい？ 運動会のときにでも。
父：お前、本当に変わったなあ。
父は電話の向こうで、少し照れたように笑った。
＊
十年前の健診で言われたこと。それが、十年たっても父の朝食を決めていた。誰が決めたのかも、何のための数字かも、もう誰も覚えていないのに。
航は、自分の中にも、そういうルールがいくつあるのだろうと考えた。「夜にごはんを食べると太る」「汗をかけば痩せる」「プロテインは三十分以内」。そのいくつかは、この半年で、楠木先生と一緒にほどいてきた。でも、まだ自分では気づいていないものも、たぶんある。
次の相談の日、航はリストの新しい行に書き足した。「父の健診の結果を見て、主治医に聞く」。その下に、もう一行。「自分の中の、誰が決めたかわからないルールを探す」。`,
pt:"食事のコレステロールの上限目標は2015年版でなくなった。ただし脂質異常症の人は200mg/日未満が望ましい。卵1個は約185mg。LDLへの影響は飽和脂肪酸のほうが大きい。",
q:["卵M玉1個（可食部約50g）のコレステロールは約何mg？（全卵100gあたり370mg）","約185mg","約37mg","約370mg","約740mg"],
e:"370 × 50 ÷ 100 ≒ 185mg。脂質異常症の重症化予防では1日200mg未満が望ましいとされるので、その人にとっては卵1個でほぼ上限に近づきます。",
r:"日本食品標準成分表（八訂）/ 厚生労働省 日本人の食事摂取基準（2015年版・2020年版）"},

{s:"ビタミン・ミネラル",t:"ビタミンは、13種類を2つに分けて覚える",sub:"サプリの棚の前で",
body:`その週の土曜日、航は千夏と結衣と一緒に、ドラッグストアに来ていた。
千夏が、サプリメントの棚の前で立ち止まった。マルチビタミン、ビタミンC、ビタミンD、鉄、亜鉛、カルシウム。色とりどりの瓶とパッケージが、天井近くまで並んでいる。
千夏：最近、なんか疲れやすいんだよね。マルチビタミンでも飲もうかな。
航：どれがいいんだろう。
千夏：あなた、栄養の勉強してるんでしょ。
航は、棚を見上げた。どれもよさそうに見える。でも、何がどれくらい入っていて、自分たちに足りているのかいないのか、まるでわからなかった。
航：……ごめん、わかんない。ビタミン、まだ習ってない。
千夏は、少しおかしそうに笑った。
千夏：じゃあ、先生に聞いてきてよ。
＊
火曜日、航は相談室でそのまま話した。
航：情けなかったです。半年も勉強してるのに、サプリの棚の前で何も言えなくて。
楠木：情けなくはありません。わからないことを「わからない」と言えたのは、大事なことです。わかったふりをして、適当にすすめるより、ずっといい。
航：でも、ビタミンって種類が多すぎて。どこから手をつければいいのか。
楠木：では、今日は地図を描きましょう。細かい話は、そのあとで一つずつ。
楠木先生は、ノートの真ん中に縦線を一本引いた。
＊
楠木：ビタミンは、人にとって必要なものが13種類あります。まず、これを大きく二つに分けます。水に溶けるビタミンと、油に溶けるビタミン。
航：水溶性と、脂溶性。
楠木：そうです。左に水溶性。ビタミンB群の8種類と、ビタミンC。右に脂溶性。ビタミンA、D、E、K。
楠木先生は、線の左右に書き込んでいった。左にB1、B2、B6、B12、ナイアシン、パントテン酸、葉酸、ビオチン、C。右に、A、D、E、K。
航：脂溶性は、4つだけ。
楠木：「DAKE（だけ）」と覚える人もいます。
航：だけ。覚えやすい。
楠木：この二つの違いが、いちばん大事です。水溶性のビタミンは、とりすぎても、余った分は尿に出ていきやすい。そのかわり、体にためておけないので、毎日少しずつとる必要があります。それに、水に溶けるので、ゆでたり水にさらしたりすると、ゆで汁に流れ出てしまう。
航：だから、野菜をゆでると減る。
楠木：一方、脂溶性のビタミンは、体の脂肪や肝臓にためておけます。毎日きっちりとらなくても、すぐには足りなくならない。ただし、ためられるということは、とりすぎたときに出ていきにくい、ということでもあります。
航：とりすぎると、たまっちゃう。
楠木：そう。だから、脂溶性ビタミンには「とりすぎ」の害、過剰症があります。たとえばビタミンAは、妊娠中にとりすぎると赤ちゃんに影響が出る可能性がある。サプリメントで大量にとり続けるのは、慎重にすべきなんです。
＊
楠木：それと、脂溶性ビタミンには、もうひとつ特徴があります。油と一緒にとると、吸収されやすい。
航：前に聞いた気がします。脂質を全部やめちゃダメな理由。
楠木：覚えていましたね。にんじんのビタミンAは、生で食べるより、油で炒めたほうが吸収がよくなります。サラダにドレッシングやオリーブオイルを少しかけるのは、味だけでなく、意味があるんです。
航：マヨ多めは。
楠木：少しなら、意味があります。多めは、別の話です。
航は笑った。四月の「マヨ多め」のことを、先生はまだ覚えていた。
＊
航：ビタミンはわかりました。ミネラルは？
楠木：ミネラルは、体を作ったり、調子を整えたりする元素です。カルシウム、鉄、亜鉛、マグネシウム、カリウム、ナトリウム。食事摂取基準では13種類に基準が決められています。これも、とりすぎると害があるものが多い。特に鉄や亜鉛のサプリメントは、量に注意が必要です。
航：じゃあ、千夏が飲もうとしてたマルチビタミンは。
楠木：ふつうの量のマルチビタミンを、表示どおりに飲む分には、大きな問題になることは少ないでしょう。でも、その前に、ふたつ確かめてほしいことがあります。
航：はい。
楠木：ひとつ目は、本当に何かが足りていないのか。疲れやすさの原因は、ビタミン不足だけではありません。睡眠、ストレス、貧血、甲状腺の病気。いろいろな可能性があります。サプリメントで「なんとなく」ごまかしているあいだに、本当の原因を見逃すのがいちばん怖い。
航は、七月の健診のことを思い出していた。原因がわからないまま不安だけが残る。先生は、あのときもそう言っていた。
楠木：ふたつ目は、食事でとれないか。サプリメントは、食事で足りないものを補うための道具です。食事の代わりにはなりません。食べ物には、ビタミンやミネラルだけでなく、食物繊維や、まだ名前もついていないような成分が、たくさん一緒に入っています。
航：前に、プロテインのときも同じことを言ってましたね。魔法の粉じゃない、って。
楠木：サプリメントも、魔法の粒ではありません。
＊
航：でも、パッケージに「健康にいい」みたいなこと、書いてありますよね。トクホとか、機能性なんとかとか。あれは、国が認めてるんじゃないんですか。
楠木：いいところに気づきましたね。それも、物差しが必要な話です。日本には、食品が健康への効果をうたえる制度が、大きく三つあります。
楠木先生は、ノートの端に三つ書いた。
楠木：ひとつ目は、特定保健用食品、トクホ。国が、ひとつひとつの商品について、効果や安全性を審査して許可したものです。ふたつ目は、栄養機能食品。ビタミンやミネラルが国の決めた量だけ入っていれば、届け出なしで、その栄養素の働きを表示できます。
航：審査なし？
楠木：決められた範囲の表示しかできない代わりに、ですね。三つ目が、機能性表示食品。これは、企業が自分たちの責任で、科学的な根拠を国に届け出て表示するもので、国が個別に審査して許可しているわけではありません。
航：同じ「健康にいい」でも、根拠の強さが違う。
楠木：そうです。それに、どの制度でも、「病気を治す」とは書けません。食品は、薬ではないからです。もし、病気が治ると書いてあるサプリメントを見かけたら、それだけで疑ってかかっていい。
航：根拠の強さを見る。
楠木：Mortonのメタ解析のときと、同じ考え方ですね。
＊
楠木：では、次回から、ひとつずつ見ていきましょう。どれから始めたいですか。
航は、少し考えた。千夏の「疲れやすい」という言葉が、頭に残っていた。
航：……鉄、ですか。妻が疲れやすいって。
楠木：鉄は大事なテーマです。ただ、鉄の話をするには、その前に知っておいてほしいビタミンがいくつかあります。順番に行きましょう。まずは、疲れと関係の深いビタミンB1から。それから、ビタミンC、ビタミンD、カルシウム、そして鉄。
航：最後が鉄なんですね。
楠木：全部、つながっていますから。それに、奥さんの疲れの原因が鉄なのかどうかは、まだわかりません。もし気になるなら、まずは一度、病院で血液検査を受けてもらうのがいちばん確かです。
＊
その夜、航は、千夏にノートを見せた。真ん中に縦線が一本。左に水溶性の九つ、右に脂溶性の四つ。
千夏：だけ、って書いてある。
航：DAKE。脂溶性は、D、A、K、E。
千夏：へえ。
千夏は、しばらくノートを眺めていた。それから、ぽつりと言った。
千夏：マルチビタミン、買うのやめとく。今度の健診のとき、貧血も見てもらう。
航：うん、それがいいと思う。
千夏：あなた、ちょっと先生っぽくなってきたね。
航は、首を横に振った。先生っぽいのは、自分ではない。わからないことをわからないと言って、聞きに行けるようになっただけだ。それでも、ドラッグストアの棚の前で黙っていた土曜日よりは、少しだけ前に進んだ気がした。`,
pt:"ビタミンは13種類。水溶性（B群8種＋C）は毎日少しずつ、ゆでると流れ出る。脂溶性（D・A・K・E）は油と一緒に吸収され、ためられる分、とりすぎに注意。",
q:["次のうち、脂溶性ビタミンはどれ？","ビタミンD","ビタミンC","ビタミンB1","葉酸"],
e:"脂溶性ビタミンはA・D・E・Kの4つ（DAKE）。B群とCは水溶性です。脂溶性は体にためられるため、サプリメントでのとりすぎに注意が必要です。",
r:"厚生労働省 日本人の食事摂取基準（2020年版）"},

{s:"ビタミン・ミネラル",t:"ビタミンB1は、糖をエネルギーに変える鍵",sub:"夏の疲れと、豚肉",
body:`九月の半ばを過ぎても、暑さは続いていた。
航は、相談室に入るなり、椅子に深く座り込んだ。
航：先生、なんか、だるいんです。夏の終わりから、ずっと。
楠木：記録を見せてもらえますか。
楠木先生は、航のスマートフォンをスクロールした。睡眠は六時間半前後で安定している。トレーニングも週三回、続いている。体重は72キロ台。
楠木：睡眠もトレーニングも、崩れていませんね。食事は……昼が、そばかうどんの日が多い。
航：暑くて、食欲がなくて。冷たいそばとか、そうめんばっかりで。
楠木：夜は。
航：夜は、ふつうに食べてます。あ、でも、取引先との飲み会が、八月から多くて。週に二回くらい。
楠木先生は、少しうなずいた。
楠木：今日のテーマに、ぴったりですね。ビタミンB1の話をしましょう。
＊
楠木：ビタミンB1は、炭水化物、つまり糖をエネルギーに変えるときに必要な、鍵のようなビタミンです。ごはんやパン、麺を食べて、それを体の中で燃やすとき、B1が足りないと、うまく燃えない。
航：燃料はあるのに、火がつかない。
楠木：そういうイメージです。そうすると、エネルギーが作られにくくなって、疲れやすくなる。それに、燃え残りのような物質がたまって、だるさにつながることもあります。
航：僕の昼ごはん、そばとかうどんばっかりだった。
楠木：糖質はしっかりとっている。でも、B1は少ない。冷たい麺だけの食事は、まさにそういう組み合わせです。昔から「夏バテ」と言われるものの一部には、こういう食事の偏りも関係していると考えられています。
＊
楠木：では、B1はどこに多いか。成分表で調べてみてください。
航は、成分表を開いた。最近は、楠木先生が言う前に、手が伸びるようになっていた。
航：……豚肉。ヒレで、100gあたり1.32mg。ロースで0.69mg。
楠木：大人の男性の推奨量は、1日1.4mgくらいです。
航：豚ヒレ100gで、ほぼ1日分。
楠木：豚肉は、肉の中でも群を抜いてB1が多いんです。牛肉や鶏肉の何倍もあります。ほかには、うなぎ、玄米、大豆、たらこなど。
航：うなぎ。夏の土用の丑の日って、そういうこと？
楠木：昔の人が栄養学を知っていたわけではないでしょうが、結果として理にかなった習慣ですね。それと、豚肉と一緒に、にんにくや玉ねぎ、にらを食べると、B1の吸収がよくなると言われています。アリシンという、においの成分がB1と結びついて、体に取り込まれやすい形になるんです。
航：豚の生姜焼きに、玉ねぎ。にらレバ炒め。
楠木：どれも、昔からある料理です。
楠木：ついでに言うと、ビタミンB群は、チームで働くビタミンです。B1は糖、B2は脂質、B6はたんぱく質の代謝に深く関わっています。どれか一つだけを大量にとるより、いろいろな食べ物から、まんべんなくとるほうが理にかなっている。
航：チームプレー。
楠木：たんぱく質をたくさんとるようになったあなたは、B6の出番も増えています。B6は、魚や肉、バナナ、さつまいもなどに多い。
航：最近食べてるものばっかりだ。
楠木：自然とそろっているんです。それと、B12。これは肉や魚、卵、乳製品など、動物性の食品にしかほとんど含まれません。もし将来、菜食に切りかえるようなことがあれば、B12だけは気をつけてください。足りないと、貧血や神経の症状が出ることがあります。
航：菜食にする予定は、ないですけど。
楠木：覚えておくと、いつか誰かの役に立ちます。
航は、千夏の作る豚の生姜焼きを思い出していた。四月に、手ばかりで初めて見た料理だった。
＊
楠木：もうひとつ、大事なことがあります。お酒です。
航は、少し身構えた。
楠木：アルコールを分解するときにも、ビタミンB1が使われます。それに、お酒をたくさん飲むと、B1の吸収そのものが悪くなる。だから、飲む量が多い人ほど、B1が足りなくなりやすいんです。
航：飲み会の多い八月から、だるくなった。
楠木：重なっていますね。B1がひどく足りなくなると、脚気や、ウェルニッケ脳症という、脳の重い病気になることもあります。今の日本では多くはありませんが、お酒をたくさん飲んで、あまり食べない人では、今でも起きる病気です。
航：脳の病気まで。
楠木：あなたの場合は、そこまで心配する状況ではないと思います。ただ、だるさが続くなら、お酒の量と、昼の麺だけの食事、この二つを見直す価値はあります。
＊
楠木：それと、B1は水溶性のビタミンです。前回の話、覚えていますか。
航：水に溶けるから、ゆでると流れ出る。体にためておけないから、毎日少しずつ。
楠木：そうです。B1は熱にも弱くて、調理で3割から5割くらい失われることもあります。豚しゃぶにするなら、ゆで汁ごと食べられるスープにすると、流れ出た分も一緒にとれます。
航：そうめんに、豚しゃぶを乗せるのは。
楠木：いいですね。麺だけの食事に、主菜が加わる。B1も、たんぱく質も、どちらも入ります。
航は、手を叩いた。
航：冷しゃぶうどん。社食にある。
楠木：では、明日からそれにしてみてください。
＊
相談の終わりに、航は、少し考えてから聞いた。
航：先生。だるいのが、本当にB1のせいかどうかって、どうやってわかるんですか。
楠木：いい質問です。正直に言えば、食事を変えて、だるさが良くなったかどうかで「たぶんそうだった」と考えるしかない部分もあります。でも、二週間ほど食事を見直しても変わらない、あるいは悪くなるなら、ほかの原因を考える必要がある。そのときは、迷わず病院に行ってください。
航：食事で見当をつけて、体で答え合わせ。
楠木：そして、答えが合わなければ、専門家に聞く。
航は、ノートにその三つを書き並べた。いつのまにか、これが自分の考え方の型になっていた。
＊
二週間後。航は、昼の冷しゃぶうどんを続けていた。飲み会は、週一回に減らした。断るのは少し勇気がいったが、「最近ちょっと体を整えてて」と言うと、取引先の部長が意外にも乗ってきた。
部長：青木くん、最近、顔が締まったと思ってたんだよ。何やってんの。
航：栄養の勉強です。
部長：へえ、俺にも教えてよ。最近、夏バテがひどくてさ。
航：昼、そうめんばっかりじゃないですか。
部長：なんでわかるの。
航は、思わず笑った。ついこのあいだの自分が、目の前にいた。
その日の夕方、会社に戻ると、佐伯が机の上にエナジードリンクの缶を並べていた。
佐伯：青木さん、これ、ビタミンB群入りなんですよ。疲れに効くって。
航は缶を手にとって、裏を見た。ビタミンB群がいくつか、それにカフェインと、糖類がたっぷり。
航：これ、1本でカフェインがコーヒー1杯分くらいあるな。糖もけっこう入ってる。
佐伯：え、そうなんですか。
航：B群は、ふだんの食事が偏ってなければ、わざわざ缶でとらなくていいらしいよ。水溶性だから、余った分は出ていくし。それより、昼にそばだけ、とかやめたほうが効く。
佐伯：……昼、毎日コンビニのパスタです。
航：主食しかないじゃん。
言いながら、航は、ほんの一か月前まで自分も同じだったことを思い出して、少し笑った。人に言うと、自分のこともよく見える。
だるさは、いつのまにか消えていた。B1のおかげなのか、飲み会が減ったおかげなのか、秋が近づいて涼しくなったおかげなのか、正確にはわからない。でも、わからないなりに、自分で見当をつけて、変えて、確かめた。それで十分だと、今の航は思えた。`,
pt:"ビタミンB1は糖をエネルギーに変える鍵。豚肉（ヒレ100gで約1.3mg）に多く、にんにく・玉ねぎと相性がいい。麺だけの食事とお酒の多さで不足しやすい。",
q:["ビタミンB1がとくに多く含まれる肉は？","豚肉","鶏むね肉","牛肉","鴨肉"],
e:"豚ヒレは100gあたり約1.3mgで、成人男性の推奨量（約1.4mg/日）にほぼ届きます。アルコールの多飲はB1の需要を増やし吸収を下げるため、不足に注意が必要です。",
r:"日本食品標準成分表（八訂）/ 厚生労働省 日本人の食事摂取基準（2020年版）"},

{s:"ビタミン・ミネラル",t:"ビタミンCは、ためられない。だから毎日",sub:"風邪をひいた娘",
body:`九月の終わり、結衣が熱を出した。
運動会の練習が始まって、毎日くたくたになって帰ってきていた矢先だった。三十八度二分。小児科で、ふつうの風邪だろうと言われた。
その夜、航はスマートフォンで、ビタミンCのサプリメントを調べていた。「1日1,000mgで風邪予防」「免疫力アップ」。どのページにも、強い言葉が並んでいた。
千夏：何見てるの。
航：ビタミンC。結衣に飲ませたら、早く治るかなって。運動会まで、あと二週間しかないし。
千夏は、画面をのぞきこんでから、航の顔を見た。
千夏：先生に、聞いてからにしたら？
航は、苦笑した。最近、千夏のほうが「先生」という言葉をよく使う。
＊
楠木：結衣ちゃん、具合はどうですか。
相談室で、楠木先生は最初にそれを聞いた。
航：熱は二日で下がりました。今は元気です。ただ、運動会が近いので、また風邪をひいたらって思うと。ビタミンCのサプリ、飲ませたほうがいいですか。
楠木：子どもの体のことは、まず、かかりつけの小児科の先生に相談するのがいちばんです。そのうえで、ビタミンCと風邪について、わかっていることをお話ししましょう。
＊
楠木：ビタミンCと風邪の関係は、とてもたくさん研究されてきました。それをまとめた、信頼性の高い総説があります。コクランという、研究のまとめを専門にしている国際的な組織が出したものです。
航：またメタ解析ですか。
楠木：そうです。その結果を、ざっくり言うとこうなります。ふつうの人が、毎日ビタミンCのサプリメントを飲み続けても、風邪をひく回数は、ほとんど減らなかった。
航：減らないんですか。
楠木：ただ、風邪をひいたときの期間は、少しだけ短くなりました。大人で8%くらい、子どもで14%くらい。
航：14%って、どれくらいですか。
楠木：一週間の風邪なら、一日弱、短くなるくらいです。
航：……思ってたより、ずっと小さい。
楠木：もうひとつ、面白い結果があります。マラソンランナーや、極寒の地で訓練する兵士のように、体に強い負担がかかっている人たちでは、ビタミンCを飲んでいたグループで、風邪をひく人がおよそ半分に減っていました。
航：半分。じゃあ、効く人には効くんだ。
楠木：特別に強い負担がかかっている人には、ということですね。ふつうに生活している人や子どもが、予防のために毎日大量に飲む意味は、あまりはっきりしません。それに、風邪をひいてから飲み始めても、効果ははっきりしなかった。
航は、昨夜調べたページの「1日1,000mgで風邪予防」という文字を思い出した。
航：……ネットの言葉、強すぎますね。
楠木：強い言葉ほど、証拠を確かめたほうがいいんです。
＊
楠木：それに、ビタミンCは、たくさん飲めばそのぶん体に入るわけでもありません。1回に1gを超えるような量をとると、吸収される割合は半分以下に下がっていきます。そして、水溶性のビタミンですから、余った分は尿に出ていく。
航：高いサプリを飲んで、尿に出してるだけ。
楠木：プロテイン3杯のときと、少し似ていますね。
航は、頭をかいた。
楠木：では、ビタミンCは、ふだんどれくらい必要か。大人の推奨量は、1日100mgです。
航：100mg。食べ物だと、どれくらいですか。
楠木：調べてみてください。
航は、もう慣れた手つきで成分表を開いた。
航：赤ピーマン、パプリカの赤。100gあたり170mg。半分で70gくらいだから……119mg。これだけで一日分。
楠木：ほかには。
航：ブロッコリー、生で140mg。でも、ゆでると55mgに減ってる。半分以下だ。
楠木：ビタミンCも水溶性で、熱にも弱い。ゆでると、ゆで汁に流れ出て、熱でも壊れる。だから、電子レンジで蒸すか、さっとゆでて、ゆですぎないのがコツです。
航：キウイ、1個で約60mg。みかんは1個で26mg。いちごも多い。じゃがいもにもある。
楠木：じゃがいものビタミンCは、でんぷんに守られて、加熱しても比較的残りやすいんです。日本では昔から、大事なビタミンCの供給源でした。
＊
楠木：野菜全体で考えると、健康日本21という国の目標では、大人は1日350g以上の野菜を食べることが目安とされています。でも、実際の平均は、それより60〜70gほど少ない。
航：350gって、どれくらいですか。
楠木：手ばかりを思い出してください。
航：両手に山盛りで、1食分の野菜。それを三食。
楠木：生野菜なら両手に山盛り、加熱した野菜なら片手に山盛りくらいが、だいたい120gの目安です。それを三回で、350gを少し超えます。
航：昼のそばの日は、ほぼゼロでした。
楠木：野菜を一品足すだけで、ビタミンCもB群も、食物繊維も、一緒についてきます。サプリメントの瓶を一本買うより、ずっと安上がりです。
＊
航：ビタミンCって、風邪以外にも何かしてるんですか。
楠木：たくさんあります。ひとつは、コラーゲンを作るのに欠かせないこと。コラーゲンは、皮膚だけでなく、骨や血管、腱や靭帯の土台になるたんぱく質です。ビタミンCがひどく足りなくなると、壊血病といって、歯ぐきから血が出たり、傷が治りにくくなったりします。
航：大航海時代の病気、ですよね。
楠木：よく知っていますね。長い航海で、新鮮な野菜や果物を食べられなかった船乗りたちがかかった病気です。そして、もうひとつ。ビタミンCは、植物性の食品に含まれる鉄の吸収を助けます。
航：鉄。
楠木：前に、鉄の話は最後にしましょうと言いましたね。ビタミンCは、そのための大事な準備のひとつなんです。
＊
相談が終わる頃、航は、少し考えてから言った。
航：先生。結衣には、サプリじゃなくて、いちごとか、みかんとか、ブロッコリーとか、好きなものを出すようにします。あと、早く寝かせる。
楠木：それがいちばんだと思います。それと、もうひとつ。
航：はい。
楠木：運動会のことで、結衣ちゃんより、あなたのほうが緊張しているように見えます。
航は、ぎくりとした。
航：……わかります？
楠木：保護者リレーに出るんでしょう。
航：出ます。去年、五十メートルで息が上がった、あのリレーです。
楠木先生は、少しだけ目を細めた。
楠木：では、その話は、運動会の前にもう一度しましょう。あなたが走るための話を。
＊
その週末、航はスーパーで、いちごのパックを手にとった。九月の終わりのいちごは高かった。少し迷って、みかんの袋に持ちかえた。1個で26mg。四個食べれば、一日分を超える。
家に帰ると、すっかり元気になった結衣が、みかんの袋に飛びついた。
結衣：みかん！
航：ビタミンC、いっぱいあるよ。
結衣：びたみんしー、なにするの。
航は、少し考えた。コラーゲン、鉄の吸収、風邪の期間を少し短くする。どれも、七歳にはむずかしい。
航：結衣の体の、骨とか、皮とかの、のりみたいなものを作るんだよ。
結衣：のり？
航：くっつけるやつ。
結衣は、みかんの皮をむきながら、自分の腕をじっと見た。
結衣：じゃあ、いっぱい食べたら、走っても、ころばない？
航は、すぐには答えられなかった。それから、正直に言った。
航：ころばないかどうかは、わからない。でも、ころんでも、早くなおる。
結衣は満足そうにうなずいて、みかんをひと房、口に入れた。`,
pt:"ビタミンCの推奨量は1日100mg（赤パプリカ1/2個で十分）。毎日のサプリでも一般の人の風邪の回数はほぼ減らず、期間がわずかに短くなる程度。コラーゲン合成と非ヘム鉄の吸収を助ける。",
q:["コクランのレビュー（2013）で、一般の人がビタミンCを毎日とり続けた場合の結果は？","風邪の回数はほぼ減らず、期間がわずかに短くなった","風邪の回数が半分に減った","風邪をまったくひかなくなった","風邪の期間が2倍に延びた"],
e:"一般集団では罹患率の低下は認められず、期間は大人で約8%、子どもで約14%短縮。マラソンランナーなど強い身体的負荷がかかる人では罹患リスクがおよそ半分になりました。",
r:"Hemilä H, Chalker E. Cochrane Database Syst Rev 2013;(1):CD000980 / 日本食品標準成分表（八訂）"}
];

{s:"ビタミン・ミネラル",t:"ビタミンDは、食べ物と日光の両方から",sub:"骨の話を、そろそろ",
body:`十月に入ってすぐの火曜日。運動会まで、あと十二日だった。
航が相談室に入ると、テーブルの上に、見慣れないものが置かれていた。骨の模型だった。手のひらに乗るくらいの、白い大腿骨。
航：……今日は、骨ですか。
楠木：ビタミンDとカルシウム。骨の話です。運動会の前に、どうしてもしておきたくて。今週は、木曜日にも時間をとりました。来られますか。
航：来ます。
楠木先生が、相談の回数を自分から増やしたのは、初めてだった。
＊
楠木：骨は、一度できたら変わらない、硬い石のようなものだと思われがちです。でも実際は、毎日、少しずつ壊されて、作り直されています。古い骨を壊す細胞と、新しい骨を作る細胞が、休まず働いている。大人の骨は、数年から十年ほどで、ほぼ入れ替わると言われています。
航：筋肉と同じですね。作り直してる。
楠木：そうです。そして、骨の量は、十代で急に増えて、二十歳前後でいちばん多くなります。最大骨量、ピークボーンマスといいます。そこから先は、少しずつ減っていく。
航：二十歳がピーク。
楠木：だから、子どものころから二十歳くらいまでに、どれだけ骨を「貯金」できるかが、一生の骨の強さを大きく左右するんです。
航は、結衣のことを思った。七歳。これから骨の貯金がいちばん増えていく時期だった。
＊
楠木：その骨の貯金に欠かせないのが、ビタミンDです。ビタミンDは、腸からカルシウムを吸収するのを助けます。いくらカルシウムをとっても、ビタミンDが足りないと、うまく体に取り込めない。
航：DAKEの、D。脂溶性。
楠木：覚えていましたね。そして、ビタミンDには、ほかのビタミンにはない特徴があります。食べ物からとるだけでなく、日光を浴びると、皮膚で作られるんです。
航：日光で、ビタミンができる。
楠木：紫外線の一種が、皮膚の中の材料に当たって、ビタミンDに変わります。だから、ビタミンDは「日光のビタミン」とも呼ばれます。
航：じゃあ、外に出てればいい？
楠木：季節と場所によって、ずいぶん違います。国立環境研究所の試算では、晴れた日の昼に顔と両手を出して、1日に必要な量の目安を作るのに、夏のつくばなら数分ですみますが、冬の札幌では1時間以上かかるとされています。
航：冬は、全然足りないんだ。
楠木：それに、今は日焼け止めを塗りますし、外で過ごす時間そのものが減っています。日本人の多くは、ビタミンDが不足ぎみだと考えられています。
＊
楠木：では、食べ物ではどうか。調べてみてください。
航は、成分表を開いた。ビタミンDの欄を、上から順にたどっていく。
航：鮭。100gあたり32µg。1切れ80gで……25.6µg。
楠木：大人の1日の目安量は、8.5µgです。
航：鮭1切れで、3日分。
楠木：魚はビタミンDの宝庫です。さんま、いわし、さば、うなぎ。ほかには、きのこ類。特に干ししいたけや、きくらげ。卵にも少し入っています。
航：肉は？
楠木：肉にはあまりありません。だから、肉中心で魚をあまり食べない人は、不足しやすい。
航は、自分の夏の記録を思い返した。鶏むね、豚肉、牛肉。魚は、週に一度あるかないか。
航：……僕、たんぱく質のことばっかり考えて、魚を忘れてました。
楠木：鶏むねとブロッコリー、ですね。
航は苦笑した。ジムのトレーナーの言葉を、まだ覚えていた。
＊
楠木：ひとつ、注意しておくことがあります。ビタミンDは脂溶性ですから、サプリメントでとりすぎると、体にたまります。血液のカルシウムが高くなりすぎて、腎臓などに負担がかかることがある。食事摂取基準では、大人の耐容上限量は1日100µgとされています。食事でこれを超えることはまずありませんが、高い量のサプリメントを重ねて飲むときは注意が必要です。
航：また、多ければいいわけじゃない。
楠木：それは、この半年、何度も出てきた話ですね。
＊
楠木：骨のビタミンは、Dだけではありません。ビタミンKも、骨を作るのに関わっています。骨の中のたんぱく質がカルシウムをしっかりつかむのを助ける。
航：DAKEの、K。
楠木：そうです。ビタミンKがいちばん多い食べ物、覚えていますか。食材図鑑に載っていますよ。
航は、少し考えて、ぱっと顔を上げた。
航：納豆。1パックで240µg。
楠木：大人の1日の目安量は150µgくらいですから、納豆1パックで十分です。緑の濃い葉物野菜にも多い。
航：お父さんの朝の納豆、骨にもいいんだ。
楠木：ひとつだけ注意があります。ワルファリンという、血を固まりにくくするお薬を飲んでいる人は、ビタミンKがその効き目を弱めてしまうので、納豆を控えるように言われることがあります。お父さんが、そういうお薬を飲んでいないかは、確かめておいてください。
航：……飲んでないとは思うけど、聞いてみます。
楠木：知識は、相手の状態を知ってから使う。あなたが、ノートに書いた言葉です。
＊
楠木先生は、骨の模型を手にとって、航に渡した。
楠木：最近、日本では、赤ちゃんのくる病が、また見つかるようになっています。
航：くる病？
楠木：ビタミンDが足りなくて、骨がうまく硬くならず、足が曲がったりする病気です。昔の病気だと思われていましたが、日光を避ける生活や、食べ物の偏りなどで、また報告が増えている。子どもの骨の話は、私たち大人が思うより、身近なんです。
航は、模型をそっと握った。軽かった。
航：結衣にも、魚、出したほうがいいですね。
楠木：骨の話は、木曜日に続きをしましょう。カルシウムの話を。
＊
相談が終わりかけたとき、航は、ずっと聞きたかったことを口にした。
航：先生。前に、大学のころ、すねの骨にひびが入ったって言ってましたよね。
楠木先生は、模型を棚に戻す手を、少しだけ止めた。
楠木：言いましたね。
航：骨の話をしようって思ったのは、そのことと関係あるんですか。
しばらく、先生は何も言わなかった。窓の外では、秋の日が少しずつ傾き始めていた。
楠木：あります。でも、それは、運動会の前の日に話します。あなたが走る前に、聞いてほしいので。
航：……わかりました。
＊
その週の夕食に、千夏は鮭のムニエルを作った。航が頼んだわけではなかった。
千夏：最近、あなたが魚、魚って言うから。
航：言ってた？
千夏：寝言でも言ってた。
結衣は、鮭の皮をはがして、皿のはしに置いていた。
結衣：これは、食べないところ。
航：皮も食べられるよ。
結衣：でも、ぐにゃっとする。
航は、笑いながら、自分の鮭を口に運んだ。1切れで、3日分のビタミンD。骨の貯金。娘がこれから二十歳までにためていく骨の、ほんの一部。
半年前は、卵の重さもわからなかった。今は、娘の皿の上の鮭を見て、十三年後の骨のことを考えている。航は、その変化が、少しだけ怖くて、少しだけ誇らしかった。
＊
次の土曜日の朝、航は結衣を誘って、近所の川沿いを歩いた。体重を量ったあと、十五分だけ。
結衣：なんで朝にお散歩するの。
航：お日さまにあたると、体の中でビタミンDができるんだって。骨のためのビタミン。
結衣：お日さま、たべてないのに？
航：皮膚が作るんだよ。
結衣は、自分の腕を日にかざして、ふしぎそうに眺めていた。それから、ぱっと走り出して、少し先で振り返った。
結衣：パパ、おそい！
航は、笑いながら追いかけた。朝の光の中で、MINDのタブで読んだ一枚、朝の散歩の話を思い出していた。あのときは、メンタルの話だと思って読んでいた。体のことも、心のことも、結局は同じところにつながっている。`,
pt:"ビタミンDは腸からのカルシウム吸収を助ける。日光で皮膚でも作られるが、冬や屋内中心の生活では不足しやすい。鮭1切れで成人の目安量（8.5µg）の約3日分。",
q:["ビタミンDを多く含む食品の組み合わせとして正しいのは？","鮭・さんま・きくらげ","鶏むね・豚ヒレ・牛もも","ごはん・食パン・うどん","キャベツ・きゅうり・レタス"],
e:"ビタミンDは魚類やきのこ類に多く、肉や穀物、多くの野菜にはほとんど含まれません。脂溶性のため、サプリメントでのとりすぎに注意（成人の耐容上限量100µg/日）。",
r:"日本食品標準成分表（八訂）/ 厚生労働省 日本人の食事摂取基準（2020年版）/ 国立環境研究所 ビタミンD生成に必要な日照時間の試算"},

{s:"ビタミン・ミネラル",t:"カルシウムは、量と吸収率で考える",sub:"木曜日の相談室",
body:`木曜日の夕方。いつもと違う曜日の相談室は、少しだけ雰囲気が違って見えた。ジムの会員も、火曜日とは顔ぶれが違う。
楠木：来てくれてありがとう。
航：先生こそ、時間をとってもらって。
楠木：今日はカルシウムです。骨の材料そのもの。火曜日のビタミンDと、二つでひとつの話です。
＊
楠木：体の中のカルシウムの99%は、骨と歯にあります。残りの1%が、血液や筋肉の中で、筋肉を縮めたり、神経を伝えたり、血を固めたりする仕事をしています。
航：1%しかないのに、大事な仕事。
楠木：大事すぎるので、体は血液のカルシウムの濃さを、とても厳密に一定に保っています。もし食事からのカルシウムが足りないと、どうなると思いますか。
航は、少し考えた。
航：……骨から、持ってくる？
楠木：正解です。血液のカルシウムが下がりそうになると、体はホルモンの働きで、骨を溶かしてカルシウムを取り出します。骨は、カルシウムの貯金箱でもあるんです。
航：足りない日が続くと、貯金がどんどん減っていく。
楠木：そして、それは痛くもかゆくもない。骨がすかすかになっていることに、骨が折れるまで気づかない人も多いんです。
＊
楠木：大人の男性のカルシウムの推奨量は、1日750mgくらいです。でも、日本人の実際の摂取量は、平均で500mg前後。多くの人が足りていない栄養素のひとつです。
航：そんなに足りてないんですか。
楠木：では、あなたの一日で考えてみましょう。成分表を。
航は、ページをめくった。
航：牛乳、100gあたり110mg。コップ1杯206gで、227mg。ヨーグルト100gで120mg。プロセスチーズ1枚で113mg。木綿豆腐、半丁で140mg。小松菜、100gあたり170mg。1/4束70gで119mg。
楠木：それを、ふだんの食事に置いてみてください。
航：朝の牛乳1杯で227。昼は……あんまりない。夜に豆腐の冷奴と小松菜のおひたしで、140と119。寝る前のヨーグルトで120。全部で……606mg。
楠木：かなり意識して、600mgです。
航：750まで、まだ足りない。
楠木：カルシウムは、意識しないと本当に足りにくいんです。
＊
楠木：それと、カルシウムには、もうひとつ大事な数字があります。吸収率です。
航：とった分が、全部吸収されるわけじゃない。
楠木：そうです。食品によって、体に取り込まれる割合が違います。日本で行われた研究では、牛乳で約40%、小魚で約33%、野菜で約19%くらいという結果が出ています。
航：野菜は、半分以下。
楠木：植物には、カルシウムの吸収を邪魔する成分が含まれていることがあるからです。たとえば、ほうれん草には、シュウ酸という成分が多く含まれていて、カルシウムとくっついて吸収されにくくなります。一方、小松菜はシュウ酸が少ないので、野菜の中ではカルシウムの供給源として優秀です。
航：ほうれん草と小松菜、似てるのに。
楠木：見た目は似ていても、中身はかなり違います。成分表を「1行」で見るのではなく、組み合わせや吸収まで考えると、見え方が変わってきます。
＊
航：でも、牛乳を飲むとお腹がゴロゴロする人っていますよね。会社の同僚にもいます。
楠木：乳糖不耐症ですね。牛乳に含まれる乳糖という糖を分解する酵素が、大人になると少なくなる人がいます。日本人を含む東アジアの人には、とても多いんです。
航：じゃあ、その人はカルシウムがとれない？
楠木：工夫しだいです。ヨーグルトは、乳酸菌が乳糖の一部を分解しているので、お腹にやさしいことが多い。チーズは、作る過程で乳糖のほとんどが抜けます。牛乳も、一度にたくさんではなく、少しずつ、温めて飲むと平気な人もいます。最近は、乳糖を分解した牛乳も売られています。
航：それなら、続けられそうですね。
楠木：飲めないから全部やめる、ではなく、自分に合う形を探す。それは、この半年あなたがやってきたことと同じです。
＊
楠木：では、さっきの606mgを、750mgにするには、どうしますか。
航は、ノートをにらんだ。
航：昼が、ほぼゼロなんです。社食の定食に、小鉢でひじきか小松菜があれば足す。ない日は、コンビニでヨーグルトかチーズを一つ。それで100mg前後。あと、夜の汁物を、豆腐とわかめのみそ汁にする。
楠木：それで、750を超えますね。
航：特別なことは、してないですね。
楠木：していません。それがいちばん続きます。
航は、ノートに書いた計算を、もう一度見直した。半年前は、ゆで卵1個のカロリーを出すのにも迷っていた。今は、一日のカルシウムを、牛乳と小松菜と小魚で組み立てている。
航：先生、僕、最初の日にもらった「物差し」、まだ使ってますね。
楠木：最初の日の物差しが、いちばん長く使える物差しです。
＊
楠木：カルシウムを、骨の外へ逃がしてしまうものもあります。
航：逃がす？
楠木：塩分です。塩分を多くとると、尿にカルシウムが一緒に出ていきやすくなります。カフェインやアルコールのとりすぎも、同じような方向に働くと言われています。
航：ラーメンと、コーヒーと、ビール。
楠木：あなたの四月の記録ですね。
航は笑った。笑いながら、少しぞっとしていた。四月の自分の食事は、骨の貯金を、知らないうちに少しずつ引き出していたのかもしれない。
楠木：そして、骨にとって、食べ物と同じくらい大事なのが、運動です。
航：運動。
楠木：骨は、重さや衝撃がかかると、それに耐えられるように強くなろうとします。逆に、寝たきりや無重力のように、骨に力がかからない状態が続くと、どんどん弱くなる。宇宙飛行士は、宇宙にいるあいだに、骨がかなり減ってしまうんです。
航：筋トレは、骨にもいい？
楠木：とてもいい。体重をかけるスクワットや、ジャンプ、走ることも。筋肉が骨を引っ張ることも、骨への刺激になります。
航は、半年前からのスクワットを思い出した。ミニで十回から始めて、今は重りを持って何セットもやっている。
航：筋肉のためだけだと思ってた。
楠木：体は、全部つながっていますから。
＊
楠木：子どもの場合も、考え方は同じです。七歳の女の子なら、カルシウムの推奨量は1日550mgくらい。給食がある日は、牛乳1本でかなりの量がとれます。給食のない休みの日に、どう補うかが大事になります。
航：休みの日。
楠木：それと、外で走り回ること。骨にとっては、それがいちばんの栄養かもしれません。
航は、運動会の練習で毎日くたくたになって帰ってくる結衣の顔を思い浮かべた。
＊
相談の終わりに、楠木先生は、骨の模型を手にとって言った。
楠木：火曜日と今日で、骨の話はだいたい終わりです。ビタミンDで吸収して、カルシウムで材料をそろえて、運動で強くする。
航：そして、二十歳までに貯金する。
楠木：そうです。そして、その貯金を、若いうちに崩してしまうことも、あるんです。
航は、顔を上げた。
楠木：来週の火曜日は、鉄の話をします。奥さんの検査の結果は、出ましたか。
航：今週末に出ます。
楠木：では、それを持ってきてください。そして、運動会の前の金曜日に、もう一度だけ時間をください。そこで、私の話をします。
＊
帰り道、航はスーパーに寄った。カゴに入れたのは、牛乳、小松菜、しらす、それにさんまを三尾。
レジのそばの棚に、子ども向けの小魚のおやつがあった。航はそれを一袋、カゴに追加した。小魚の吸収率、約33%。
家で袋を開けると、結衣は、小魚を一匹つまんで、まじまじと見た。
結衣：目がある。
航：骨もあるよ。結衣の骨になる。
結衣：骨が骨になるの？
航は、しばらく考えた。それから、結衣と一緒に、小魚をひとつ口に入れた。
航：そう。骨が、骨になる。
それは、自分で言っておきながら、なんだかすごいことのような気がした。`,
pt:"カルシウムの推奨量は成人男性で約750mg/日、平均摂取は500mg前後で不足しやすい。吸収率は牛乳約40%・小魚約33%・野菜約19%。塩分のとりすぎは尿中への排泄を増やし、運動は骨を強くする。",
q:["日本の研究で示された、食品別のカルシウム吸収率の高い順として正しいのは？","牛乳 ＞ 小魚 ＞ 野菜","野菜 ＞ 小魚 ＞ 牛乳","小魚 ＞ 野菜 ＞ 牛乳","すべてほぼ同じ"],
e:"牛乳約40%、小魚約33%、野菜約19%。ほうれん草のようにシュウ酸の多い野菜は吸収されにくく、小松菜はシュウ酸が少ない優秀な供給源です。",
r:"上西一弘ほか 日本栄養・食糧学会誌 1998;51:259-266 / 厚生労働省 日本人の食事摂取基準（2020年版）/ 日本食品標準成分表（八訂）"},

{s:"ビタミン・ミネラル",t:"鉄は、ヘム鉄と非ヘム鉄",sub:"千夏の検査結果",
body:`運動会の週の火曜日。本番まで、あと五日。
航は、一枚の紙を持って相談室に来た。千夏の健診の結果だった。本人から、先生に見せてもいいと言われていた。
楠木先生は、紙を受け取って、ゆっくり目を通した。
楠木：ヘモグロビン、11.2。基準値より少し低いですね。フェリチンという項目は。
航：会社の健診には入ってなくて、追加で測ってもらったそうです。6でした。
楠木：低いですね。
航：病院の先生には、鉄欠乏性貧血でしょうって言われて、鉄のお薬が出ました。それと、婦人科も一度受診するように言われたそうです。
楠木：お医者さんが、きちんと見てくださったんですね。よかった。
楠木先生は、紙を丁寧に航に返した。
楠木：治療は、お医者さんにお任せするとして。今日は、鉄という栄養素について、知っておいてほしいことを話しましょう。奥さんのためにも、あなた自身のためにも。
＊
楠木：鉄は、血液の赤血球の中のヘモグロビンの材料です。ヘモグロビンは、肺で受け取った酸素を、全身に運ぶ役目をしています。
航：酸素の運び屋。
楠木：鉄が足りなくなると、酸素をうまく運べなくなる。だから、疲れやすい、息切れがする、頭がぼんやりする、といった症状が出ます。
航：千夏が言ってた「疲れやすい」は。
楠木：その可能性は高いですね。ドラッグストアでマルチビタミンを買わずに、検査を受けてもらってよかった。
航は、九月の土曜日のことを思い出していた。あのとき、自分が何も言えなかったことが、結果としてよかったのかもしれない。
楠木：それから、フェリチン。これは、体の中に貯蔵されている鉄の量の目安です。ヘモグロビンが下がる前に、まずフェリチンが下がっていく。貯金がなくなってから、ようやく財布の中身が減り始める、というイメージです。
航：だから、ヘモグロビンが少し低いだけでも、貯金はもう空っぽに近い。
楠木：そういうことです。
＊
楠木：鉄の推奨量は、大人の男性で1日7.5mgくらい。月経のある女性は、10.5mgくらいです。
航：女性のほうが多い。
楠木：月経で、毎月、血液と一緒に鉄が失われますから。だから、若い女性には鉄欠乏が多いんです。
航：千夏は、出産のあとから、ずっと疲れてるって言ってました。
楠木：妊娠や出産でも、たくさんの鉄が使われます。それが戻りきらないまま、という人は少なくありません。
＊
楠木：では、鉄はどこに多いか。ここで大事なのが、鉄には二種類あるということです。
楠木先生は、ノートに二つの言葉を書いた。ヘム鉄、非ヘム鉄。
楠木：ヘム鉄は、肉や魚、特にレバーや赤身の肉、かつおやまぐろの赤身に多い鉄です。吸収率が比較的高い。非ヘム鉄は、野菜や豆、穀物、卵などに含まれる鉄で、吸収率は低め。食べ合わせによって、吸収されやすくなったり、されにくくなったりします。
航：食べ合わせ。
楠木：ビタミンCを一緒にとると、非ヘム鉄の吸収がよくなります。
航：前回……いや、前々回の、ビタミンCの話。
楠木：そうです。あのときに、鉄の話の準備だと言いました。肉や魚と一緒にとっても、非ヘム鉄の吸収は高まります。逆に、緑茶やコーヒー、紅茶に含まれるタンニンという成分は、非ヘム鉄の吸収を下げると言われています。
航：千夏、食後にいつもコーヒー飲んでます。
楠木：食事のすぐあとより、少し時間をあけるほうがいいかもしれませんね。
＊
楠木：成分表で、鉄の多いものを探してみてください。
航：豚レバー、100gあたり13mg。鶏レバー、9mg。あさりの水煮缶、30mg。
楠木：あさりの缶詰は、鉄の多さで知られています。ほかには。
航：ほうれん草、生で2.0mg。小松菜、2.8mg。……あれ、ほうれん草より小松菜のほうが多い。
楠木：ほうれん草は鉄が多いというイメージがありますが、実は小松菜のほうが多いんです。それに、ほうれん草はゆでると減ります。
航：ひじきは？ 鉄が多いって聞いたことある。
楠木：おもしろいので、見てみてください。
航は、ひじきの行を探して、首をかしげた。
航：ほしひじき……ステンレス釜で6.2mg。鉄釜で58mg。なにこれ、十倍くらい違う。
楠木：ひじきは、ゆでて乾かす加工をします。昔は鉄の釜でゆでていたので、釜の鉄がひじきに移っていたんです。今はステンレスの釜が主流になって、八訂からは、こうして分けて載るようになりました。
航：ひじきの鉄、半分は釜の鉄だったんだ。
楠木：成分表は、そういう食べ物の歴史まで教えてくれます。
航：じゃあ、鉄のフライパンで料理すれば、鉄が増える？
楠木：少しは移ります。特に、トマトソースのような酸味のある料理を長く煮込むと、移りやすい。ただ、それだけで貧血が治るほどではありません。おまけ、くらいに考えてください。
航：吸収率って、どれくらい違うんですか。ヘム鉄と、非ヘム鉄で。
楠木：ヘム鉄は、だいたい15〜25%くらい。非ヘム鉄は、2〜20%くらいと幅があって、食べ合わせや、その人の体の鉄の状態で大きく変わります。体の鉄が足りないときは、吸収率が上がる。足りているときは、下がる。体は、鉄の入り口をちゃんと調整しているんです。
航：賢いな。
楠木：鉄は、とりすぎると体から出ていく道がほとんどないので、入り口で調整するしかないんです。だからこそ、注射のように入り口を通らずに入れると、危ないことがある。
＊
航：先生、スポーツをしてる人も、鉄が足りなくなりやすいって聞いたことがあるんですけど。
楠木：あります。汗と一緒にも少し失われますし、走るときに足の裏に強い衝撃がかかると、赤血球が壊れることもある。それに、激しい運動のあとは、鉄の吸収を抑えるホルモンが一時的に増えることもわかっています。持久系の競技、特に女性の長距離選手には、鉄欠乏がとても多いんです。
楠木先生は、少しだけ声の調子を落とした。
楠木：数年前、高校の駅伝の世界で、問題になったことがあります。貧血の治療ではなく、記録を伸ばすために、選手に鉄剤の注射が使われていた、と。鉄は、とりすぎると体にたまって、肝臓や心臓などに害を与えることがあります。日本陸連は、不適切な鉄剤注射を防ぐためのガイドラインを出しました。
航：記録のために。
楠木：速くなりたい、という気持ちは、とても強いものです。本人にとっても、周りの大人にとっても。だからこそ、隣にいる大人が、正しい知識を持っていないといけない。
航は、その言葉の中に、先生自身の何かが含まれているような気がした。
＊
帰り際、楠木先生は、航に言った。
楠木：奥さんに、伝えてください。お薬をきちんと飲むこと。そして、自分で食事を調整するのは、お医者さんの治療と一緒に、補う形にすること。サプリメントの鉄を自己判断で足すのは、やめておいたほうがいい。
航：わかりました。
楠木：それと、もうひとつ。疲れやすいのを、ずっと我慢していたことを、ねぎらってあげてください。
航は、少し驚いて先生を見た。
楠木：鉄が足りないときの疲れは、本人にとっては「気合が足りない」「年のせい」と感じやすいんです。体の問題なのに、自分を責めてしまう。
＊
その夜、航は、千夏にノートを見せながら、今日の話をした。ヘム鉄と非ヘム鉄。ビタミンC。食後のコーヒー。ひじきの釜。
千夏は、最後まで黙って聞いていた。
千夏：ずっと、自分がだらしないんだと思ってた。家事も中途半端で、結衣にもイライラして。
航：体の問題だったんだよ。
千夏：……そうだね。
航は、少し迷ってから言った。
航：気づかなくて、ごめん。ずっと、疲れてるの、我慢してたんだよね。
千夏は、何も言わずに、航の肩に少しだけ頭をあずけた。
翌朝、航は朝ごはんに、あさりの缶詰を使った味噌汁を作った。千夏は少し驚いて、それから、笑って全部飲んだ。食後のコーヒーは、一時間後にした。`,

q:["非ヘム鉄の吸収を高める組み合わせはどれ？","小松菜のおひたしにパプリカを添える","ほうれん草と一緒に緑茶を飲む","食後すぐに濃いコーヒーを飲む","豆腐を紅茶と一緒にとる"],

{s:"スポーツ医学",t:"食べなさすぎが、体を壊すとき",sub:"先生が走れなくなった理由",
body:`運動会の二日前、金曜日の夜。ジムの照明が半分落とされ、相談室だけに明かりがついていた。
楠木先生は、いつもの木のテーブルに、紅茶をふたつ置いた。
楠木：今日は、私の話をする約束でしたね。
航：はい。
楠木：その前に、ひとつだけ、栄養の話をさせてください。私の話は、その話の、ひとつの例ですから。
＊
楠木：運動をする人にとって、いちばん大事な栄養の考え方に、エネルギー利用可能性というものがあります。
航：エネルギー……利用可能性。
楠木：むずかしい言葉ですね。食べたエネルギーから、運動で使ったエネルギーを引いた残り。それが、体が生きるために、ほかの仕事に使えるエネルギーです。心臓を動かす、体温を保つ、ホルモンを作る、骨を作り直す、傷を治す。
航：運動に全部使っちゃったら、そのほかの仕事に回らない。
楠木：そうです。そして、運動の量に対して食べる量が足りない状態が続くと、体は省エネを始めます。生きるのに必要ないと判断した仕事から、止めていく。
航：止めていく。
楠木：最初に止まりやすいのが、子どもを作るための仕事です。女性なら月経が止まる。男性でも、男性ホルモンが減る。次に、骨を作り直す仕事が後回しになる。免疫が落ちて、風邪をひきやすくなる。気持ちが落ち込みやすくなる。記録も、いずれ伸びなくなる。
航は、六月の、あの一週間を思い出していた。力が出ない。イライラする。眠れない。
航：……僕の、一週間で2.5キロのとき。
楠木：あれは、ほんの入り口でした。一週間で、あなたの体は、ちゃんとサインを出していたんです。
＊
楠木：この状態を、今は「スポーツにおける相対的エネルギー不足」、英語の頭文字でRED-Sと呼びます。国際オリンピック委員会が2014年に提唱して、その後も何度か内容が更新されています。もともとは、女性アスリートの三主徴といって、「食べる量が足りない」「月経が止まる」「骨が弱くなる」の三つが、つながって起きることが知られていました。それが、男性も含めて、もっと広い体の問題として整理されたんです。
航：男性にも。
楠木：男性にも起きます。自転車や長距離、体重で階級が決まる競技。あるいは、あなたのように、真剣に減量している一般の人にも。
航：目安みたいなものは、あるんですか。
楠木：研究では、脂肪を除いた体重1kgあたり、1日30kcalを下回るような状態が続くと、さまざまな体の働きに影響が出やすいとされています。ただ、これはきっちりした線というより、危険が高まっていく範囲だと考えてください。それより大事なのは、体のサインです。疲れが抜けない。月経が乱れる。けがが治りにくい。風邪をひきやすい。気持ちが沈む。
＊
楠木先生は、紅茶をひと口飲んで、カップを置いた。
楠木：大学二年の春、私は中距離の選手でした。800mと1500m。記録が伸び悩んでいて、コーチに「あと3キロ軽ければ」と言われました。
航は、六月に聞いた話の続きだとわかった。
楠木：私は、一か月で5キロ落としました。朝はりんご半分、昼はサラダ、夜はごはんを抜いて、鶏肉と野菜だけ。練習は、むしろ増やしました。最初の一か月、記録は伸びたんです。自己ベストが出ました。コーチにもほめられた。
航：最初は、伸びる。
楠木：グリコーゲンと水が抜けて、体が軽くなっただけです。でも、そのときの私には、それが努力の成果に見えた。だから、もっと削りました。
楠木先生は、少しのあいだ、窓の外を見ていた。
楠木：夏には、生理が止まりました。でも、陸上の世界では、長距離の女子選手の生理が止まるのは、当たり前のことのように言われていた。むしろ、それだけ練習している証拠だと。誰も止めなかったし、私も気にしなかった。疲れが抜けなくて、風邪ばかりひいて、夜は眠れなかった。それでも、走り続けました。
航：……。
楠木：冬の合宿の、三日目の朝でした。坂道を下っている途中で、右のすねに、ぴりっと痛みが走った。疲労骨折でした。そのとき測った骨密度は、二十歳なのに、同じ年代の平均を大きく下回っていた。
航は、火曜日の骨の話を思い出した。二十歳前後が、骨の貯金のピーク。
航：いちばん貯金するはずの時期に。
楠木：いちばん貯金するはずの時期に、私は貯金を崩していたんです。その骨は、今も完全には戻っていません。
＊
楠木：けがが治ったあと、走ろうとしても、もう走れませんでした。体ではなく、気持ちのほうが。食べると太るのが怖い。でも食べないと走れない。どうしていいかわからなくて、私は陸上をやめました。
航は、何も言えなかった。
楠木：そのあとで、栄養学を学び始めたんです。自分の体に何が起きていたのかを、知りたかった。知ってみたら、全部、説明がついた。食べる量が足りなかった。ただ、それだけのことでした。それだけのことを、私も、周りの大人も、誰も知らなかった。
航：だから、隣にいる人になりたかった。
楠木：前に、そう言いましたね。急いでいる人の隣で、「急がなくていい」と言える人に。
楠木先生は、そこで初めて、航のほうをまっすぐに見た。
楠木：あなたが六月に一週間で2.5キロ落としてここに来たとき、正直に言うと、怖かったんです。また、誰かが同じ道に入っていくのを見るのが。
航：先生が、怖かった。
楠木：でも、あなたは自分で戻ってきた。記録をつけていたから、何が起きたかを説明できた。私が言う前に、自分で体のサインに気づけた。それを見て、私も、少し救われた気がしました。
＊
長い沈黙のあと、航は、ようやく口を開いた。
航：先生、明日の、いや、あさっての運動会。何を食べればいいですか。
楠木先生は、少しだけ笑った。
楠木：あなたは、もうわかっているはずです。
航は、少し考えて、答えた。
航：前の晩は、ふつうに食べる。ごはんも抜かない。燃料を満タンにしておく。当日の朝は、走る三時間くらい前に、ごはんとたんぱく質の朝ごはん。直前は、おにぎりかバナナくらい。水分は、こまめに。走ったあとは、減った分を戻す。それと、早く寝る。
楠木：満点です。
航：特別なことは、何もないですね。
楠木：栄養学の答えは、たいてい普通だと言いましたね。
＊
相談室を出るとき、航は振り返った。
航：先生、今、走ってるんですか。
楠木先生は、少し驚いたような顔をして、それから答えた。
楠木：……この夏から、少しだけ。朝、川沿いを。
航：いつから。
楠木：あなたが、朝のジムに通い始めたころです。記録を見ていたら、なんだか、自分もやってみたくなって。
航は、思わず笑ってしまった。先生も、つられて笑った。
楠木：あさっては、がんばってください。いえ、がんばらなくていい。楽しんできてください。
＊
日曜日は、雲ひとつない秋晴れだった。
小学校の校庭には、万国旗がはためいていた。航の両親は、朝早くから、レジャーシートの一番いい場所をとってくれていた。父は、千夏が作ったお弁当の、卵焼きを一切れ食べて、言った。
父：主治医に聞いたら、今の数値なら、卵は一日一個にこだわらなくていいってさ。
航：聞いてくれたんだ。
父：お前がうるさいからな。
午後の最初の種目が、保護者リレーだった。航は、第三走者だった。百メートル。
スタートの位置に立つと、去年の秋の、息が戻らなかった五十メートルのことを思い出した。心臓が、どくどくと鳴っていた。でも、それが何なのか、今の航にはわかっていた。緊張で出たアドレナリンが、心拍を上げているだけだ。燃料は、昨日の夜のごはんと、今朝のおにぎりで、満タンにしてある。
バトンが来た。
走り出した瞬間、体が、思っていたよりずっと軽かった。七十八キロだった体は、今は七十一キロ台になっている。でも、軽いのは体重のせいだけではない気がした。地面を蹴るたびに、半年分のスクワットが、足の裏から返ってくる。
コーナーを曲がると、応援席が見えた。千夏が、結衣を抱き上げて手を振っていた。両親が、立ち上がって叫んでいた。
そして、そのずっと後ろ、校庭のフェンスの外に、ランニングウェア姿の女性がひとり、立っていた。
航は、最後の直線を走り抜けて、バトンを渡した。
ゴールのあと、息は上がっていた。でも、ちゃんと戻ってきた。三十秒もしないうちに、ふつうに話せるくらいに。
結衣が、走ってきて、航の脚に抱きついた。
結衣：パパ、はやかった！
航：パパの骨と筋肉と、ごはんのおかげ。
結衣：ごはんは、走るための、ちから！
航は、フェンスのほうを振り返った。
もう、そこには誰もいなかった。川沿いのほうへ続く道を、小さな後ろ姿が、ゆっくりと走っていくのが見えた気がした。`,
pt:"運動量に対して食べる量が足りない状態（相対的エネルギー不足、RED-S）は、月経やホルモン、骨、免疫、気分、成績に影響する。男性にも起こる。最初の「軽くなって記録が出る」は危険なサイン。",
q:["スポーツにおける相対的エネルギー不足（RED-S）について正しいのは？","男性にも起こり、ホルモンや骨、免疫などに影響する","女性アスリートだけに起こる","月経が止まるのは練習量が十分な証拠である","体重が減って記録が伸びていれば問題ない"],
e:"IOCが2014年に提唱し、その後更新されてきた概念で、女性アスリートの三主徴（低エネルギー利用可能性・月経異常・低骨密度）を男性も含めて広げたもの。脂肪を除いた体重1kgあたり約30kcal/日を下回る状態が続くと影響が出やすいとされます。",
r:"Mountjoy M et al. Br J Sports Med 2014;48:491-497 / Mountjoy M et al. Br J Sports Med 2023;57:1073-1097"}
];

{s:"成長期の栄養",t:"子どもは「小さな大人」ではない",sub:"結衣、ボールを蹴る",
body:`運動会から一週間後の土曜日。結衣は、近所の小学校のグラウンドで、少年サッカーの体験練習に参加していた。

＊
楠木：最初に覚えてほしいのは、ひとつだけです。子どもは、小さな大人ではない。

楠木：もうひとつ、子どもと大人で違うのが、暑さへの強さです。
航：夏の佐伯みたいな。
楠木：子どもは、大人ほどたくさん汗をかけません。体の大きさのわりに体の表面積が大きいので、気温が体温より高いときは、外から熱を受けやすい。それに、背が低いぶん、熱くなった地面からの照り返しにも近い。
航：ベビーカーの赤ちゃんが暑いって、聞いたことがあります。
楠木：同じ理屈です。そして、子どもは遊びに夢中になると、のどが渇いたことに気づきにくい。だから、大人が時間を決めて、休憩と水分をとらせる必要があります。
航：喉が渇く前に、こまめに。
楠木：大人と同じ原則ですが、子どもは自分では気づけない分、周りの大人の役目が大きいんです。
＊
楠木：補食の話は、また詳しくします。今日は、地図を描いておきましょう。この章で話したいことです。
楠木先生は、ノートに書き始めた。
楠木：一、子どもは小さな大人ではない。今日の話。二、成長曲線。子どもの体が順調に育っているかを見る、いちばん大事な道具。三、背を伸ばす食べ物はあるのか。親御さんに、いちばんよく聞かれる質問です。四、思春期。体が大人に変わる時期の、特別な必要量。五、補食。六、子どもとプロテインやサプリメント。七、思春期のスポーツと、食べなさすぎ。八、保護者向けの教室。
航は、七番目のところで、ペンを止めた。
航：七番目は。
楠木：私の話と、同じ話です。今度は、子どもの側から。
＊
その夜、航は、結衣の母子手帳を出してきた。後ろのほうのページに、身長と体重の曲線のグラフがあった。生まれたときから、何本もの線のあいだを、点が少しずつ右上に上っていく。
千夏：懐かしい。それ、何に使うの。
航：先生が、次は成長曲線だって。
千夏は、母子手帳のページをめくりながら、ぽつりと言った。
千夏：結衣が小さかったとき、体重が増えないって、すごく悩んだ時期があったんだよ。あなたは仕事で、ほとんど家にいなかったけど。
航は、何も言えなかった。そんな時期があったことを、知らなかった。
千夏：保健師さんに、曲線の中に入ってるから大丈夫って言われて、やっと安心した。
航：……ごめん。
千夏：謝らなくていいよ。今はこうやって、一緒に見てるし。
二人は、しばらく黙って、小さな点の並びを眺めていた。七年分の、結衣の体の記録だった。`,
pt:"子どもは体重あたりで大人の1.5倍以上のエネルギーが必要（成長の分も上乗せ）。体重が増えていくのが正常。胃が小さいので、3食で足りない分は補食で補う。",
q:["7歳女児（体重23kg、推定エネルギー必要量1,450kcal）の体重1kgあたりの必要量は約何kcal？","約63kcal","約38kcal","約25kcal","約100kcal"],
e:"1,450 ÷ 23 ≒ 63kcal/kg。成人男性（約38kcal/kg）の1.5倍以上で、成長に必要なエネルギーも上乗せされています。",
r:"厚生労働省 日本人の食事摂取基準（2020年版）推定エネルギー必要量"},

{s:"成長期の栄養",t:"成長曲線は、点ではなく線で見る",sub:"肥満度という物差し",
body:`次の相談の日、航は、母子手帳と、結衣の小学校の健康手帳を両方持ってきた。
楠木：持ってきてくれたんですね。
航：千夏が、学校の分も出してくれました。
楠木先生は、まず母子手帳のグラフをゆっくり眺め、それから健康手帳の数字を見た。
楠木：きれいな線ですね。
航：きれい、ですか。
楠木：ええ。今日は、これがなぜ「きれい」なのかを話しましょう。
＊
楠木：成長曲線は、たくさんの子どもの身長と体重を測って、年齢ごとにどれくらいの範囲に入るかを示したグラフです。真ん中の線が平均、その上下に何本も線がある。
航：この線、なんの線なんですか。
楠木：標準偏差、SDの線です。統計の言葉ですが、ざっくり言うと、真ん中から上下に2本目の線、プラス2SDとマイナス2SDのあいだに、だいたい95%の子どもが入ります。
航：じゃあ、その外に出たら、何かあるってこと？
楠木：何かあるかもしれないので、一度、詳しく調べたほうがいい、というサインです。たとえば身長がマイナス2SDより下なら、低身長として小児科で相談する目安になります。でも、外にいても、まったく問題のない子もたくさんいます。両親ともに小柄なら、子どもも小柄なのは自然なことです。
＊
楠木：それより大事なのは、ここからです。成長曲線は、点ではなく、線で見ます。
航：線？
楠木：ある一回の測定で、平均より少し小さい。それだけでは、あまり意味がありません。大事なのは、その子が、自分の線に沿って伸びているかどうか。
楠木先生は、母子手帳のグラフを指でなぞった。
楠木：結衣ちゃんの身長は、生まれてからずっと、平均より少し下の線に沿って、平行に伸びています。途中で線から外れて、下の線に向かって落ちていったり、急に上に向かって跳ね上がったりしていない。だから、きれいなんです。
航：途中で、線を横切ったら？
楠木：そこに、何かが起きている可能性があります。たとえば、ずっと平均に沿っていた子の身長の伸びが、ある時期から鈍くなって、線を一本、二本と下に横切っていく。そういうときは、甲状腺や成長ホルモンの病気、あるいは栄養が足りていないことが隠れていることがあります。逆に、身長が急に伸び始めて上の線に向かって跳ね上がるときは、思春期が早く始まっているのかもしれない。
航：一回の数字じゃ、わからない。
楠木：大人の体重と同じですね。一日の数字に一喜一憂せず、週の平均で見る。子どもは、それを何年もかけて見るんです。
航は、自分の体重のグラフの、なめらかな線を思い出した。数字で見当をつけて、線で確かめる。大人でも子どもでも、同じだった。
＊
楠木：もうひとつ、親御さんからよく聞かれるのが、子どもの体重の評価です。うちの子は太りすぎでしょうか、やせすぎでしょうか、と。
航：BMIで見るんじゃないんですか。
楠木：大人はBMIで見ます。でも、子どものBMIは、年齢によって正常の範囲が大きく変わるので、大人と同じ基準では使えません。日本の学校では、肥満度という物差しをよく使います。
楠木先生は、ノートに式を書いた。
楠木：肥満度は、実際の体重から、その子の身長に対する標準体重を引いて、標準体重で割って、100をかけたもの。標準体重は、性別と年齢と身長ごとに、表や式で決まっています。
航：標準より、何%重いか。
楠木：そうです。学童では、肥満度が20%以上で肥満傾向、マイナス20%以下でやせ傾向とします。
航：結衣は？
楠木：健康手帳に書いてありますよ。
航は、手帳をめくった。身長、体重、その横に、肥満度の欄があった。マイナス3%。
航：ほぼ、標準だ。
楠木：成長曲線のグラフは、日本小児内分泌学会などのホームページから、誰でもダウンロードできます。母子手帳の続きとして、学校の身体測定の結果を書き込んでいくと、その子の線が見えてきます。
航：小学校に入ってから、書いてなかった。
楠木：多くの家庭がそうです。母子手帳のグラフは六歳で終わってしまうので。でも、本当に成長の変化が大きくなるのは、そこから先の思春期なんです。
航：今日、帰ったら書きます。
楠木：書いてみると、気づくことがあります。たとえば、体重がしばらく増えていない時期があれば、それも大事なサインです。大人なら喜ぶところですが、子どもでは、病気や食事の問題、あるいは心の問題が隠れていることがある。
航は、自分の体重のグラフが平らになって喜んでいた夏を思い出した。同じ平らな線でも、子どもでは意味がまったく違う。
＊
航：でも、サッカーの体験練習のとき、ほかのお父さんに聞かれたんです。うちの子、ちょっと太ってるんだけど、運動させたら痩せますかって。小学三年生の男の子で。
楠木：あなたは、なんと答えましたか。
航：……わからないって答えました。下手なことを言いたくなくて。
楠木：それで正解です。そのうえで、知っておいてほしいことがあります。子どもの肥満は、大人の肥満とは考え方が少し違います。子どもは身長が伸びていくので、体重を減らすのではなく、体重を「増やさない」か「ゆっくり増やす」ことで、身長が追いついてくるのを待つ、という考え方が基本です。
航：減らさなくていい。
楠木：成長期の子どもに大人のような食事制限をすると、身長の伸びや骨の成長に必要な栄養まで削ってしまうことがあります。それに、食べることへの罪悪感を植えつけてしまうのも怖い。運動を楽しむこと、甘い飲み物やお菓子を減らすこと、家族みんなで同じ食事をすること。そういう生活全体の工夫が中心になります。
航：運動は、いい？
楠木：運動は、とてもいいです。体重のためというより、体力や骨、気分、それに、ほかの子と遊ぶ楽しさのために。
楠木先生は、少し考えてから、付け加えた。
楠木：ただ、肥満度がとても高い子や、急に体重が増えている子は、その陰に病気が隠れていることもあります。成長曲線で、身長の伸びが鈍っているのに体重だけが増えているような場合は、特に、小児科で相談してもらうのがいい。
航：身長が伸びないのに、体重だけ。
楠木：ホルモンの病気のサインのことがあるんです。だから、成長曲線は、身長と体重を両方並べて見る。それも、線で。
＊
その週の土曜日、サッカーの練習のあと、航は、あのお父さんにもう一度声をかけた。
航：この前の話なんですけど、僕も勉強中で、正確なことは言えないんですが。学校の健康手帳に、肥満度っていう数字が書いてあると思うんです。それと、母子手帳の成長曲線に、今の身長と体重を書き込んでみると、どういうふうに育ってきたかがわかるらしくて。
お父さん：成長曲線か。そういえば、小さいころは書いてたけど、最近はやってないな。
航：もし身長の伸びが止まってるのに体重だけ増えてたりしたら、小児科で相談したほうがいいって、教わりました。
お父さん：へえ。痩せさせなきゃって、そればっかり考えてたよ。
航：僕もそうでした。大人の考え方で、子どもを見ちゃってて。
お父さんは、少し考えてから、笑った。
お父さん：帰ったら、嫁さんと一緒に書いてみるわ。
＊
次の火曜日、航がそのことを報告すると、楠木先生は、静かにうなずいた。
楠木：診断はしない。でも、どこを見ればいいか、誰に相談すればいいかは伝える。教室でも、それがいちばん大事なことです。
航：栄養の知識って、答えを言うことじゃなくて、正しい場所に案内することなんですね。
楠木：……それも、私が何年もかかってわかったことですよ。
楠木先生は、少しだけ困ったように笑った。`,
pt:"成長曲線は1回の点でなく、その子の線に沿って伸びているかを見る。線を横切る変化は受診のサイン。子どもの体重評価は肥満度（学童で+20%以上は肥満傾向、−20%以下はやせ傾向）。",
q:["身長120cm・標準体重22kgの子の体重が27.5kgのとき、肥満度は？","+25%","+5.5%","+20%","−25%"],
e:"(27.5 − 22) ÷ 22 × 100 = 25%。学童では20%以上で肥満傾向とします。子どもでは体重を減らすより、増やしすぎずに身長の伸びを待つのが基本です。",
r:"日本学校保健会 児童生徒等の健康診断マニュアル / 日本小児内分泌学会 成長曲線"},

{s:"成長期の栄養",t:"背を伸ばす食べ物は、あるのか",sub:"身長サプリの広告",
body:`十一月に入って、結衣は正式にサッカークラブに入った。土曜日の午前中は練習、たまに日曜日に試合。航は、送り迎えを担当するようになった。
練習を見ているあいだ、保護者同士で話すことが増えた。そして、航が「栄養の勉強をしている」と知られるようになると、いろいろな質問をされるようになった。
その日も、一人のお母さんが、スマートフォンの画面を見せてきた。
お母さん：青木さん、これってどうなんですか。うちの子、クラスで一番背が低くて。
画面には、子ども向けの身長サプリメントの広告が出ていた。「成長期の今しかない」「カルシウム・アルギニン配合」「飲んだ子の9割が実感」。
航は、画面をしばらく見つめた。
航：……すみません、ちょっと調べてから、答えてもいいですか。
＊
火曜日、航は、広告のスクリーンショットを楠木先生に見せた。
楠木：ああ、この手の広告は、本当に多いですね。
航：先生、正直なところ、どうなんですか。
楠木：では、順番に考えましょう。まず、子どもの身長は、何で決まると思いますか。
航：遺伝、ですか。
楠木：大きな部分は遺伝です。双子の研究などから、身長のばらつきのうち8割くらいは、遺伝で説明できると考えられています。
航：8割。じゃあ、残りの2割は。
楠木：栄養、睡眠、病気、運動、育った環境。そういうものです。
航：じゃあ、栄養で2割は変えられる？
楠木：そこが、誤解しやすいところです。栄養が影響するのは、主に「足りない場合」です。食べ物が足りなくて成長に必要な材料が不足すれば、背は伸びにくくなる。戦後の日本人の平均身長がぐっと伸びたのも、栄養状態がよくなったことが大きい。でも、もう十分に足りている子に、さらに何かを足しても、遺伝で決まっている上限を超えて伸ばすことはできません。
航：たんぱく質と同じだ。1.6gで頭打ち。
楠木：考え方は、まったく同じです。足りない状態から十分な状態にするのは大きな意味がある。十分を超えた分には、ほとんど意味がない。
＊
航：じゃあ、このサプリのカルシウムは。
楠木：カルシウムは骨を硬くする材料ですが、骨を伸ばすわけではありません。骨が長く伸びるのは、骨の端にある成長板という軟骨の部分で、細胞が増えていくからです。そこに働いているのは、成長ホルモンや甲状腺ホルモン、思春期には性ホルモン。カルシウムをたくさんとっても、成長板の細胞が増えるわけではないんです。
航：アルギニンは？
楠木：アルギニンは、点滴で大量に入れると、成長ホルモンの分泌を一時的に刺激することがあります。病院で、成長ホルモンの分泌を調べる検査に使われることもある。でも、サプリメントで口からとる程度の量で、子どもの身長が伸びたという確かな証拠はありません。
航：「飲んだ子の9割が実感」は。
楠木：何を実感したのか、何人に聞いたのか、比べる相手はいたのか。それがわからない数字は、Mortonのメタ解析の何万分の一の重みもありません。それに、子どもは何もしなくても毎年背が伸びますから、飲んで「伸びた」と感じるのは、当たり前です。
航は、思わず苦笑した。たしかに、子どもは放っておいても伸びる。
楠木：実際、消費者庁が、子どもの身長が伸びるかのような根拠のない広告に対して、措置命令を出した例もあります。
＊
楠木：では、身長のために、本当に意味があることは何か。
航：十分に食べること。
楠木：はい。特に、エネルギー、たんぱく質、それにカルシウムやビタミンDのような骨の材料が、不足しないこと。それから。
航：……睡眠？
楠木：そうです。成長ホルモンは、寝ついてから最初の深い眠りのときに、たくさん分泌されます。夜ふかしで睡眠が短くなったり、浅くなったりするのは、身長の面からも望ましくない。
航：寝る子は育つ。
楠木：昔の言葉は、よくできています。
航：結衣、最近、寝るのが遅くなってるんです。夜にタブレットで動画を見たがって。
楠木：小学一年生なら、夜は9〜12時間くらいの睡眠が目安とされています。寝る前の画面は、明るさで眠気を遠ざけてしまうこともある。
航：九時に寝ても、七時に起きたら十時間。今、十時近くまで起きてるから、九時間ちょっと。
楠木：ぎりぎりですね。サッカーで体を動かす日が増えれば、なおさら睡眠は大事になります。
航：……動画、寝る一時間前で終わりにしようかな。僕も、一緒にスマホやめます。
楠木：それは、いいですね。子どもに言うより、家族で決めるほうが、ずっと続きます。
＊
楠木：もうひとつ、親御さんに知っておいてほしいことがあります。両親の身長から、子どもの最終的な身長の目安を計算する方法があるんです。
航：そんなことができるんですか。
楠木：あくまで目安ですが。男の子なら、お父さんとお母さんの身長を足して、13cm足して、2で割る。女の子なら、足して、13cm引いて、2で割る。そこから上下に8〜9cmくらいの幅をもって考えます。日本では、少し補正を加えた式が使われることもあります。
航は、自分と千夏の身長を思い浮かべた。
航：僕が172、千夏が158で、足して330。女の子だから、13引いて317。2で割って、158.5cm。
楠木：結衣ちゃんの今の成長曲線の線と、だいたい合っていると思いますよ。平均より少し下の線に沿っていましたから。
航：合ってる。……なんか、ほっとしました。
楠木：あのお母さんにも、それを伝えてあげるといいかもしれません。クラスで一番小さくても、ご両親が小柄で、成長曲線の線に沿って伸びているなら、それはその子らしい伸び方です。逆に、線から外れて落ちてきている、あるいはご両親から予想されるよりずっと小さいなら、サプリメントではなく、小児科、できれば子どもの成長を専門にしている先生に相談するべきです。
航：小児科の、成長の専門の先生。
楠木：低身長の陰には、治療できる病気が隠れていることがあります。成長ホルモンの不足や、甲状腺の病気。早く見つけて治療すれば、伸びる身長がある。サプリメントにお金と時間を使って、その時期を逃すのが、いちばんもったいないんです。
＊
楠木：それと、もうひとつ。太りすぎも、実は身長に関係することがあります。
航：太ると、背が伸びない？
楠木：一時的には、太っている子のほうが背が伸びるのが早いことが多いんです。でも、特に女の子では、太っていると思春期が早く始まりやすいことが知られています。思春期が早く来ると、成長のスパートも早く来て、早く終わる。結果として、最終的な身長は、期待されるより低くなることがある。
航：食べさせすぎても、だめなのか。
楠木：子どもの栄養は、足りなすぎても、多すぎても、成長に影響します。だから、成長曲線の線で見るんです。
＊
次の土曜日、練習を見ながら、航はあのお母さんに話をした。遺伝が大きいこと。足りていない子にしか、食べ物で伸ばす余地はないこと。カルシウムは骨を硬くするけれど、伸ばすわけではないこと。睡眠。両親の身長からの目安。それに、成長曲線の線。
お母さんは、しばらく黙って聞いていた。
お母さん：……実は、旦那も私も、背が低いんです。

{s:"成長期の栄養",t:"思春期は、一生でいちばん食べる時期",sub:"美月という中学生",
body:`十一月の半ば。相談室の扉を開けた航は、そこに見慣れない先客がいることに気づいて、立ち止まった。
楠木先生の向かいに、ジャージ姿の女の子が座っていた。中学生くらいだろうか。細い肩が、少しこわばっている。その隣に、見覚えのある顔があった。
佐伯：あ、青木さん。
航：佐伯？
佐伯：すみません、急に。妹の美月です。中二で、陸上部で。
美月は、ぺこりと頭を下げた。
楠木：航さん、ちょうどよかった。もしよければ、今日は一緒に聞いていてもらえますか。美月さんとお兄さんが、いいと言ってくれれば。
佐伯が美月の顔を見ると、美月は小さくうなずいた。
＊
佐伯：美月、八百と千五百をやってるんです。中距離。秋の大会で、自己ベストが出なくて。部活の顧問の先生に、体を絞ったほうがいいって言われたらしくて。
美月：……絞ったほうがいいとは言われてないです。軽いほうが有利だって、一般論として言われただけです。
声は小さかったが、はっきりしていた。
楠木：今、どんなふうに食べていますか。
美月：朝は、ヨーグルトとバナナ。昼は、お弁当を半分くらい。部活のあとは、あんまりお腹すかないので、夜は、サラダとお味噌汁と、ちょっとおかず。
航は、思わず楠木先生の顔を見た。先生は、何も表情を変えずに、ノートに美月の言葉を書き留めていた。
＊
楠木：美月さん、ひとつ教えてもらえますか。中学二年生の女の子が、一日にどれくらいのエネルギーを必要としているか、想像がつきますか。
美月：……1,500くらい？ ダイエットの本に、女の人は1,500って書いてあったので。
楠木：日本人の食事摂取基準では、十二〜十四歳の女の子で、ふつうの活動レベルの場合、1日約2,400kcalです。
美月は、驚いたように顔を上げた。
美月：2,400？
楠木：そして、それは「ふつうの活動」の場合です。毎日、陸上部で何キロも走っている人は、さらに多く必要になります。大人の女性よりも、ずっと多い。
美月：なんで、大人より。
楠木：思春期は、一生のうちで、体がいちばん大きく変わる時期だからです。身長が一年に何センチも伸びる。骨が、一生分の骨の貯金のかなりの部分を、この数年でためる。筋肉がつき、ホルモンの働きで、体が大人の形に変わっていく。その全部に、エネルギーと材料が必要なんです。
航は、口をはさまずにいた。でも、頭の中では、数字が並んでいた。大人の自分が2,700。中学二年生の女の子が2,400、それに部活の分。
＊
楠木：材料のほうも、見てみましょう。食事摂取基準では、十二〜十四歳の女の子のたんぱく質の推奨量は、1日55g。カルシウムは800mg。鉄は、月経がある場合、12mgです。
航：カルシウム800。僕より多い。
楠木：男の子なら、十二〜十四歳でカルシウムは1,000mg。一生でいちばん多い時期です。骨の貯金がいちばん増える時期ですから。
美月：鉄も、多いんですか。
楠木：月経が始まると、毎月、鉄が失われます。それに加えて、体が大きくなるときには、血液の量も増える。運動をしていれば、汗や、足の裏の衝撃でも少しずつ失われる。思春期の女の子のスポーツ選手は、鉄が足りなくなりやすい、いちばん条件がそろった人たちなんです。
楠木：それに、思春期には、身長が一気に伸びる時期があります。成長のスパートです。女の子では、だいたい十歳から十二歳ごろ、男の子は十二歳から十四歳ごろに、身長の伸びがいちばん大きくなる。多い子では、一年に八センチや十センチ伸びることもあります。
美月：私、去年、七センチ伸びました。
楠木：まさに、その時期だったんですね。身長が伸びるということは、骨も、筋肉も、血液も、全部が一緒に増えているということです。家を建て増ししている最中に、材料の仕入れを減らしたら、どうなると思いますか。
美月は、少し考えてから、小さな声で言った。
美月：……建て増しが、止まる。
楠木：止まるか、どこかを手抜きして建てることになります。体の場合、手抜きされやすいのが、骨なんです。
美月は、また、うつむいて黙ってしまった。
＊
楠木：美月さん、最近、走っていて、どうですか。
美月：……体は軽いです。でも、後半で足が動かなくなる。前はラスト二百でスパートできたのに、今は、それができない。
楠木：疲れは、翌日まで残りますか。
美月：残ります。朝、起きるのがつらくて。
楠木先生は、ペンを置いた。
楠木：美月さん。私も、昔、中距離をやっていました。
美月が、顔を上げた。
楠木：八百と千五百。大学まで。私も、軽いほうが有利だと思って、食べる量を減らしました。最初は、体が軽くなって、記録も出た。でも、そのうち後半で足が動かなくなって、疲れが抜けなくなって、最後は、走れなくなりました。
美月は、じっと楠木先生を見ていた。
楠木：あなたが今、私と同じ道にいるとは言いません。でも、今の食べ方は、あなたの体が必要としている量に、たぶん、かなり届いていない。それは、知っておいてほしいんです。
＊
しばらく、誰も何も言わなかった。
沈黙を破ったのは、佐伯だった。
佐伯：美月、俺さ、夏に熱中症になりかけたとき、青木さんに助けてもらったんだよ。そのとき、知らないって怖いなって思って。だから、お前をここに連れてきたんだ。
美月は、兄の顔をちらりと見た。
美月：……食べたら、太らないですか。
声が、少し震えていた。
楠木先生は、すぐには答えなかった。それから、ゆっくり言った。
楠木：思春期の体は、成長するために、体重が増えていくのが自然なことです。それは、太るということとは違います。大人になっていく、ということです。そして、ちゃんと食べている選手の体は、練習をちゃんと筋肉や骨に変えられる。
楠木：それに、何をどれくらい食べるかは、私が一方的に決めることではありません。美月さんが、自分の体と相談しながら、一緒に決めていきましょう。今日は、それだけ約束してもらえますか。
美月は、長いあいだ黙っていた。それから、小さく、うなずいた。
＊
美月と佐伯が帰ったあと、航は、しばらく椅子から立ち上がれなかった。
航：先生、僕、何も言えませんでした。
楠木：それで、よかったんです。
航：え。
楠木：あの場で、あなたが数字を並べ始めたら、美月さんは、たぶん心を閉じていました。中学生にとって、知らない大人が二人で何か言ってくるのは、それだけで怖いものです。黙って、隣にいてくれた。それが、今日いちばん大事なことでした。
航は、自分の手を見た。半年前、ルールを欲しがっていた自分。数字を覚えるたびに、誰かに言いたくなっていた自分。
航：知ってることを、言わないのも、大事なんですね。
楠木：言うべきときに、言うべき人に、言うべき量だけ。栄養と、同じです。
楠木先生は、少しだけ疲れた顔で、窓の外を見た。
楠木：それと、美月さんのこと、私ひとりで抱えるつもりはありません。必要なら、親御さんとも話して、小児科や婦人科の先生にもつなぎます。あの年代の子の体は、栄養士だけで見るものではないので。
航：チームで見る。
楠木：B群のビタミンと同じですね。
航は、思わず笑った。先生も、少しだけ笑った。窓の外は、もう暗くなり始めていた。`,
pt:"思春期は一生で必要量が最も多い時期。12〜14歳女子で約2,400kcal（ふつうの活動）、たんぱく質55g、カルシウム800mg、鉄12mg（月経あり）。男子のカルシウムは1,000mg。運動をすればさらに多く必要。",
q:["食事摂取基準（2020年版）で、12〜14歳女子（活動レベルふつう）の推定エネルギー必要量は約何kcal？","約2,400kcal","約1,500kcal","約1,800kcal","約3,500kcal"],
e:"12〜14歳女子で約2,400kcal、男子で約2,600kcal。運動部で毎日練習していればさらに必要です。成人女性の量やダイエット本の数字を当てはめないことが大切です。",
r:"厚生労働省 日本人の食事摂取基準（2020年版）"}

{s:"成長期の栄養",t:"補食は、四回目の食事",sub:"部活のあとの空白",
body:`二週間後。美月は、また相談室に来ていた。今度は、母親が一緒だった。

航は、隅でメモをとっていた。前に自分で作った「トレーニングの前と後の食事」の決まりと、ほとんど同じだった。違うのは、成長の分が上乗せされていることだけだ。
楠木：そして、夕食。夕食の量が、補食のせいで減るのは、ある程度は仕方ありません。一日の合計で見れば、補食を入れたほうが、ずっと多く食べられます。

楠木：いいですね。準備は、前の晩にしておく。
航は、自分が朝のジムに通い始めたとき、ウェアを枕元に出しておいたことを思い出した。体のことも、続けることも、仕組みは同じだった。

楠木：もうひとつ大事なのは、補食を「お菓子」にしないことです。スナック菓子や甘いジュースは、エネルギーはとれますが、ビタミンやミネラルが少なく、脂質や砂糖が多い。たとえば、清涼飲料水500mlには、砂糖が50g前後入っているものもあります。

相談の終わりに、楠木先生は、美月の目をまっすぐ見て言った。

body:`十二月の最初の火曜日。航は、A4のプリントを一枚、テーブルに置いた。
航：先生、これ、見てもらえますか。サッカークラブの保護者向けに作った、補食のプリントです。
楠木先生は、眼鏡をかけて、ゆっくり読み始めた。航は、その手元に置かれた赤ペンを見て、少しだけ緊張していた。
楠木：よく書けていますね。主食、乳製品、果物。迷ったら、いつもの食事の小さい版。
航：最後の一行、いちばん悩みました。
楠木先生は、二か所に、小さく赤で丸をつけた。
楠木：ひとつは、「スポーツドリンクで水分補給」のところ。七歳から十歳くらいの子の、一時間半の練習なら、ふだんは麦茶や水で十分です。スポーツドリンクは糖分も入っていますから、真夏の長い練習や、汗をたくさんかく日に使う、と書いておくといいでしょう。
航：あ、毎回飲ませる前提で書いてました。
楠木：もうひとつは、ここ。
赤い丸は、プリントの下のほう、「よくある質問」の欄についていた。「Q. 子どもにプロテインは必要？」。航は、その答えの欄を、まだ空欄のままにしていた。
楠木：ここは、空欄にしたんですね。
航：わからなくて。実は、先週、クラブのお父さんに聞かれたんです。小学三年生の子に、プロテインを飲ませたほうがいいかって。体が細いから、筋肉をつけさせたいって。
楠木：今日は、その空欄を一緒に埋めましょう。
＊
楠木：子どものたんぱく質の推奨量は、六〜七歳で1日30g、八〜九歳で40gくらいです。
航：思ったより少ない。
楠木：体重あたりにすると、大人より少し多いくらいです。成長の分が上乗せされていますから。では、八歳の子が、ふつうの食事でどれくらいとれていると思いますか。
航は、自分が作った「たんぱく質の物差し」を思い出した。
航：朝に卵とごはんで10g、給食で20gくらい、夜に肉か魚と、ごはんで20gとして……50gくらい。
楠木：日本の子どもは、多くの場合、ふつうに食事をしていれば、推奨量を十分に超えています。たんぱく質が足りないことは、むしろまれなんです。
航：じゃあ、プロテインは。
楠木：ほとんどの子には、必要ありません。食事でとれているところに足しても、前に話したように、十分を超えた分は筋肉にはなりません。それに、子どもの体が細いのは、たいていの場合、筋肉の材料が足りないからではなく、まだ成長の途中だからです。思春期が来て、ホルモンが変わるまでは、筋肉は大人のようにはつきにくい。
航：材料をいくら入れても、工場が動いてない。
楠木：いいたとえですね。
＊
楠木：それより心配なのは、プロテインがあることで、食事がおろそかになることです。食事なら、たんぱく質と一緒に、エネルギーも、ビタミンも、ミネラルも、食物繊維もとれる。プロテインで満腹になって夕食が入らなければ、本末転倒です。
航：プロテインは、魔法の粉じゃない。
楠木：大人と同じですね。ただ、例外もあります。食が細くて、どうしても量が食べられない子や、偏食がとても強い子、病気がある子。そういう場合に、医師や管理栄養士と相談しながら補助的に使うことはあります。でも、それは個別の判断です。
航は、プリントの空欄に、下書きを書き込んだ。「ほとんどの子は、食事で十分足りています。まずは三食と補食を。気になる場合は、かかりつけの小児科で相談を」。
楠木：それでいいと思います。
＊
航：もうひとつ、よく聞かれるのが、好き嫌いなんです。野菜を全然食べない子がいて、どうしたらいいかって。
楠木：偏食は、親御さんの悩みの上位ですね。子どもは、新しい食べ物を警戒するのが自然なんです。初めて見るものを、すぐに口に入れない。それは、毒を避けるための、生き物としての本能でもあります。
航：結衣も、きのこはまだ食べません。
楠木：研究では、子どもが新しい食べ物を受け入れるまでに、何度も繰り返し目にしたり、少しずつ口にしたりすることが必要で、十回前後かかることも珍しくないとされています。一、二回で「この子はこれが嫌い」と決めて出さなくなるのが、いちばんもったいない。
航：十回。
楠木：無理に食べさせる必要はありません。食卓に出し続ける。大人がおいしそうに食べてみせる。一口だけ、なめるだけでもほめる。それを、気長に続けることです。
航は、プリントの裏に書き足した。「苦手な食べ物も、無理強いせず、食卓に出し続ける」。
＊
楠木：プリントにはなかったですが、もうひとつ、親御さんに知っておいてほしいことがあります。エナジードリンクです。
航：佐伯が会社で飲んでるやつ。
楠木：最近は、中学生や高校生、ときには小学生も飲んでいることがあります。大人にとっても、カフェインの量に注意が必要な飲み物ですが、子どもはもっと敏感です。
航：子どもにも、カフェインの目安があるんですか。
楠木：日本には公的な基準はありませんが、カナダの保健省は、子どもは体重1kgあたり1日2.5mgまでを目安にしています。体重40kgの中学生なら、1日100mg。エナジードリンクは、1本で80mgから、商品によっては150mgくらい入っているものもあります。
航：1本で、超えちゃうこともある。
楠木：それに、コーヒーやお茶、コーラと合わせれば、すぐに超えます。カフェインのとりすぎで、動悸や不眠、気持ち悪さが出ることがあって、海外では、大量に飲んで亡くなった例も報告されています。
航は、八月の、自分の睡眠の記録を思い出した。大人の自分でも、200mgのプレワークアウトで眠れなくなっていた。
楠木：それに、子どもにとって睡眠は、身長を伸ばす時間でもあります。夜にエナジードリンクを飲んで勉強する中学生は、成長ホルモンがいちばん出る時間を、自分で削っていることになる。
＊
航：先生、これも、プリントに入れていいですか。
楠木：小学生向けのクラブなら、少し早いかもしれません。でも、上にきょうだいがいる家もありますから、一行あってもいいでしょう。
航は、プリントの一番下に、小さく書き足した。「エナジードリンクは、子どもには向きません（カフェインが多いため）」。
＊
楠木先生は、赤ペンを置いて、プリントを航に返した。
楠木：これで、配って大丈夫です。
航：ありがとうございます。
楠木：ひとつだけ、聞いてもいいですか。
航：はい。
楠木：プロテインの質問の欄、空欄にしたのは、どうしてですか。
航は、少し考えた。
航：……わからないことを、わかったふりして書きたくなかったんです。前に、サプリの棚の前で何も言えなかったとき、先生が「わからないことをわからないと言えたのは大事」って言ってくれたので。
楠木先生は、しばらく航を見ていた。それから、ふっと笑った。
楠木：教室のとき、親御さんからたくさん質問が来ます。その中には、私にもわからないことが、必ずあります。そのとき、あなたが隣にいてくれると、心強いです。
航：先生にも、わからないことがあるんですか。
楠木：たくさん。だから、毎日、論文を読み返しているんです。
＊
土曜日、航はプリントを人数分コピーして、練習のあとに配った。ほとんどの保護者は、ちらっと見て鞄にしまった。でも、何人かは、その場でじっくり読んでいた。
あの、プロテインのことを聞いてきたお父さんも、そのひとりだった。
お父さん：食事で、十分足りてるんだ。
航：ほとんどの子は、そうみたいです。うちも、プロテインは飲ませてないです。
お父さん：じゃあ、プロテインの代わりに、夜の肉を一切れ増やすか。
航：それなら、ビタミンも鉄も一緒にとれますね。
お父さんは、プリントを丁寧に折りたたんで、上着の胸ポケットにしまった。
グラウンドの隅では、結衣が、おにぎりを片手に、友だちと何かを話して笑っていた。`,
pt:"日本の子どもは、ふつうに食べていればたんぱく質の推奨量（6〜7歳30g、8〜9歳40g）を超えていることが多く、プロテインはほとんど不要。エナジードリンクはカフェインが多く子どもに不向き（カナダ保健省の目安は2.5mg/kg/日まで）。",
q:["カナダ保健省の目安で、体重40kgの子どもの1日のカフェイン上限の目安は？","約100mg","約400mg","約10mg","約250mg"],
e:"子どもは2.5mg/kg/日までが目安とされ、40kgなら100mg。エナジードリンク1本で80〜150mg程度含むものもあり、コーヒーやお茶と合わせると簡単に超えます。",
r:"厚生労働省 日本人の食事摂取基準（2020年版）/ Health Canada: Caffeine in foods"},

{s:"スポーツ医学",t:"思春期の「食べなさすぎ」に、隣で気づく",sub:"三か月、来ない",
body:`年が明けて、一月の半ば。相談室の空気は、いつもより重かった。
美月と母親が、並んで座っていた。航は、いつもの隅の椅子にいた。美月が、今日も航がいていいと言ってくれたと、先生から聞いていた。
十二月までの二か月で、美月は少しずつ変わっていた。練習のあとに牛乳とおにぎりを食べるようになり、お弁当を残さなくなった。駅伝の区間では、秋より少しいいタイムが出た、と佐伯がうれしそうに話していた。
それでも、今日の母親の顔は、こわばっていた。
母親：……生理が、三か月来ていないんです。本人が、昨日になって、やっと話してくれて。
美月は、うつむいたまま、膝の上で手を握りしめていた。
＊
楠木先生は、しばらく黙っていた。それから、美月のほうを向いて、静かに言った。
楠木：話してくれて、ありがとう。言うのは、勇気がいったと思います。
美月の肩が、小さく震えた。
楠木：まず、ひとつ大事なことを言わせてください。これは、美月さんが何か悪いことをしたからではありません。体が、「今は、エネルギーが足りない」と教えてくれているサインです。体が、ちゃんと美月さんを守ろうとしているんです。
美月：……でも、陸上部の先輩も、生理止まってるって言ってました。走ってたら、そうなるのは普通だって。
楠木先生は、ほんの一瞬、目を閉じた。航には、その一瞬の意味がわかった気がした。三十年前、同じ言葉を、先生自身も聞いていたのだ。
楠木：昔は、そう言われていました。私が選手だったころも。でも、今は違うことがわかっています。生理が止まるのは、練習をがんばった証拠ではなくて、食べる量が、使う量に追いついていないサインなんです。
＊
楠木：前に、航さんには話したことがあります。スポーツにおける相対的エネルギー不足、RED-Sという考え方。運動に使うエネルギーに対して、食べるエネルギーが足りない状態が続くと、体は省エネを始めて、生きるのにすぐには必要ない仕事から止めていく。その最初のほうに止まりやすいのが、月経なんです。
母親：生理が止まると、何が困るんですか。
楠木：いちばん心配なのは、骨です。月経を起こすホルモン、エストロゲンは、骨を守る働きもしています。それが少ない状態が続くと、骨の貯金がうまく増えない。思春期は、一生でいちばん骨の貯金が増える時期なのに。
母親は、口に手を当てた。
楠木：その結果、若いうちから疲労骨折を起こしやすくなったり、大人になってからの骨の強さに影響が残ったりすることがあります。
美月：……先生の、すねの骨みたいに。
美月は、顔を上げて、楠木先生を見た。いつか、兄から聞いていたのかもしれない。
楠木：そうです。私のような思いを、美月さんにはしてほしくないんです。
＊
楠木：ここから先は、私ひとりで見ることではありません。
楠木先生は、母親のほうを向いて、はっきりと言った。
楠木：まず、婦人科を受診してください。思春期の女の子の月経が三か月以上止まっている場合は、きちんと調べる必要があります。原因が食べる量だけとは限りませんし、ほかの病気が隠れていないかを確かめることが大事です。できれば、スポーツをしている女の子を診ている先生がいいですね。必要に応じて、骨の検査もしてもらえると思います。
母親：婦人科……。中学生で、ですか。
楠木：中学生だからこそ、です。今は、学生アスリートの月経の問題を専門に診てくれる外来も増えています。かかりつけの小児科の先生に相談して、紹介してもらうのもいいと思います。
＊
楠木：それと、もうひとつ。顧問の先生にも、お母さんから、状況を伝えてもらえますか。
母親：顧問に、ですか。
楠木：練習の量と、食べる量。その両方を見ないと、バランスは戻りません。食べる量を増やすのに時間がかかるなら、そのあいだ、練習の量を少し調整する必要があるかもしれない。それを判断するには、顧問の先生の協力が要ります。それと、部の中で、体重を毎日みんなの前で量るようなことがあれば、それも相談してください。
美月：体重、毎朝、部室で量って、ノートに書いてます。
楠木先生は、少しだけ眉を寄せた。
楠木：体重の数字ばかりを気にするようになると、食べることが怖くなってしまう子もいます。体重を測ること自体が悪いわけではありませんが、誰が、何のために見るのかは、大事なことです。
航は、隅で、四月の自分を思い出していた。毎朝、体重計に乗る。でも、それは自分のための答え合わせだった。誰かに比べられるためではなかった。
＊
相談の最後に、楠木先生は、美月の手をそっととった。
楠木：美月さん、ひとつだけ覚えておいてください。あなたの体は、あなたが走るための道具ではありません。あなたの体は、あなた自身です。速く走るのは、ちゃんと育った体が、ついでにしてくれることです。
美月は、声を出さずに泣いていた。母親が、その背中を、ゆっくりさすっていた。
＊
二人が帰ったあと、楠木先生は、長いあいだ窓の外を見ていた。
航は、何と声をかけていいかわからなかった。
航：先生、大丈夫ですか。
楠木：……大丈夫です。少し、昔のことを思い出していただけです。
楠木先生は、ゆっくりと航のほうを向いた。
楠木：航さん、今日、あなたがあの席にいてくれて、よかった。
航：僕、何もしてないです。
楠木：あの子にとって、大人が一人増えることの意味は、大きいんです。お兄さんの先輩で、自分の子どもがいて、栄養の勉強をしている大人。私のような専門家とは違う距離で、あの子を見ていられる。
航：隣にいる人。
楠木：そうです。私が三十年前に、いてほしかった人。
航は、しばらく考えてから、言った。
航：先生、僕、栄養の知識って、自分を変えるための道具だと思ってたんです。体重を減らしたり、筋肉をつけたり。でも、違ったんですね。
楠木：違いましたか。
航：誰かの隣に、ちゃんといるための道具なんだって。わからないことを、わからないと言って、正しい場所に案内して、黙って隣にいる。
楠木先生は、何も言わなかった。ただ、少しだけ、目が赤くなっていた。
＊
二週間後、佐伯から航に連絡があった。美月は婦人科を受診し、検査を受けた。骨密度は、同年代の平均を少し下回っていたが、大きな異常ではなかった。月経が止まっている原因は、医師の診断でも、運動に対して食べる量が足りないことの影響が大きいだろう、ということだった。
顧問の先生は、話を聞いて、しばらく練習量を調整すると約束してくれた。部室の体重測定は、個人ごとに記録して、顧問とだけ共有する形に変わった。
佐伯：美月、最近、夜ごはんおかわりするようになったんですよ。母さんが、泣きそうになってました。
航は、その言葉を聞いて、自分も少し泣きそうになった。
＊
その夜、航は、夕食のあとで千夏に美月の話をした。もちろん、名前やくわしいことは伏せて。
千夏：中学生で、そんなことになるんだ。
航：周りの大人が、気づきにくいんだって。本人も、がんばってるつもりだから。
千夏は、しばらく黙っていた。それから、リビングでお絵かきをしている結衣のほうを見た。
千夏：この前、結衣が「おなかぽっこりしてる」って、自分のお腹さわって言ってたの。
航：七歳で？
千夏：保育園のときの友だちのお母さんが、自分のこと「太った太った」って、いつも言ってたらしくて。
航は、楠木先生が美月に言った言葉を思い出していた。体重の数字ばかりを気にするようになると、食べることが怖くなってしまう子もいる。
航：俺も、去年、体重のことばっかり言ってたよな。結衣の前で。
千夏：言ってた。「パパ太った」って、結衣もまねしてた。
航は、自分の口から出ていた言葉を、ひとつずつ思い出した。太った。痩せなきゃ。ごはんがこわい。
航：これから、結衣の前では言わないようにする。体重じゃなくて、「元気」とか「走れた」とか、そういう言葉にする。
千夏：私も。
二人は、リビングの結衣を見た。結衣は、二人の視線に気づいて、描いていた絵を高く掲げた。サッカーボールを蹴る女の子と、その横で走る、少し太めのお父さんの絵だった。
`,
pt:"成長期の女子選手の月経が止まるのは「がんばった証拠」ではなく、エネルギー不足のサインでありうる。骨の貯金に影響するため、3か月以上止まっていれば婦人科へ。顧問・家族・医療者のチームで、練習量と食事の両方を見る。",
q:["中学生の女子陸上選手の月経が3か月来ていない。もっとも適切な対応は？","婦人科（できればスポーツに詳しい医師）を受診し、顧問とも状況を共有する","練習量が十分な証拠なので様子を見る","体重をさらに落として記録を狙う","サプリメントで鉄だけ補えばよい"],
e:"エネルギー不足による月経の停止はエストロゲン低下を通じて骨量の獲得を妨げ、疲労骨折のリスクを高めます。ほかの病気の除外も含め、医療機関で評価し、食事と練習量の両面から調整します。",
r:"Mountjoy M et al. Br J Sports Med 2023;57:1073-1097 / De Souza MJ et al. Br J Sports Med 2014;48:289"},

{s:"成長期の栄養",t:"家族で、同じものを食べる",sub:"はじめての栄養教室",
body:`二月の最初の土曜日。ジムの多目的室には、パイプ椅子が二十脚並べられていた。
「子どものスポーツと栄養　保護者のための小さな教室」。入口の貼り紙は、航が作ったものだった。
始まる十分前、航は、前に置かれた小さなテーブルの横で、手のひらにかいた汗を何度もズボンでぬぐっていた。
楠木：緊張していますね。
航：先生は、しないんですか。
楠木：しますよ。毎回。
楠木先生は、少しだけ笑って、航の肩を軽くたたいた。
＊
集まったのは、十六人だった。サッカークラブの保護者が六人、ジムの会員で子どものいる人が数人、それに、美月の母親もいた。後ろのほうの席には、佐伯と美月の姿もあった。美月は、今日は手伝いだと言って、資料を配ってくれていた。
最初の三十分は、楠木先生が話した。子どもは小さな大人ではないこと。成長曲線を、点ではなく線で見ること。補食。思春期の必要量。説明は短く、具体的で、ときどき会場から小さな笑いが起きた。
そして、先生がマイクを置いた。
楠木：ここからは、青木さんにお願いします。去年の春までは、皆さんと同じように、何もわからなかった方です。
会場の視線が、航に集まった。
＊
航は、深呼吸をしてから、話し始めた。
航：青木です。小学一年生の娘が、サッカークラブにいます。
去年の春まで、僕は、ゆで卵のカロリーがわかりませんでした。パッケージには1個あたり、ネットには100gあたり。どっちを信じればいいのか、わからなかった。
何人かが、くすりと笑った。
航：そこから、楠木先生に、いろいろ教わってきました。でも、今日、皆さんにお伝えしたいのは、細かい数字ではありません。僕が、この十か月で、いちばん大事だと思ったことを、三つだけ話させてください。
＊
航：ひとつ目は、「何のための数字か」を見ることです。
世の中には、栄養の数字があふれています。たんぱく質は何g、カルシウムは何mg、カロリーは何kcal。でも、その数字が、誰のための、何のための数字なのかを見ないと、間違えます。大人の減量の数字を、成長期の子どもに当てはめると、大変なことになる。逆に、子どもの数字を、そのまま自分に当てはめても、うまくいかない。
最前列のお母さんが、メモをとりながらうなずいていた。
＊
航：ふたつ目は、「ルールより、物差し」です。
僕は最初、ルールが欲しかったんです。夜は炭水化物を抜け、卵は一日一個まで、トレーニングのあと三十分以内にプロテイン。でも、ルールは、守れなかった日に、全部を投げ出す原因になりました。
物差し、というのは、たとえば、自分の手のひらです。
航は、会場に向かって、自分の右手を開いて見せた。
航：手のひら一枚分の肉や魚で、たんぱく質がだいたい20g。握りこぶし一つで、ごはん一杯。子どもの手は小さいので、子どもの手で測れば、自然と子どもの量になります。
会場のあちこちで、保護者たちが自分の手のひらを見ていた。何人かは、隣に座った子どもの手と並べていた。
＊
航：三つ目が、いちばん大事なことです。
航は、少し間を置いた。後ろの席の美月と、目が合った。
航：子どもの食事は、家族の食事です。
子どもにだけ、特別なものを食べさせる必要はありません。プロテインも、身長サプリも、ほとんどの子には要りません。お父さんとお母さんが、主食と主菜と副菜がそろったごはんを食べていれば、子どもも、同じものを食べればいい。量を、その子に合わせるだけです。
うちは、去年まで、僕だけが唐揚げとビールで、妻と娘とは違うものを食べていました。今は、みんなで同じものを食べています。生姜焼きと、ほうれん草のごま和えと、豆腐の味噌汁。
会場から、また小さな笑いが起きた。
航：それと、もうひとつだけ。子どもの前で、自分の体や、子どもの体のことを、「太った」「痩せなきゃ」と言わないこと。僕は、それをこの一年で、何人かの人から教わりました。食べることを怖がる子どもを、作らないために。
美月の母親が、ハンカチで目元を押さえていた。
＊
最後の二十分は、質問の時間だった。
ジュースはどれくらいまでならいいか。朝ごはんを食べない子にはどうすればいいか。牛乳が嫌いな子のカルシウムは。偏食が激しい子は。
航が答えられる質問には航が答え、わからないものは、正直に「わかりません」と言って、楠木先生に渡した。ジュースの質問には、航が答えた。果汁100%のジュースでも、糖分は果物そのものより多くなりやすいし、食物繊維は少ない。だから、毎日たくさんではなく、量を決めて。アメリカの小児科学会は、小学生以上でも1日コップ1杯程度までにすることをすすめている。それより、果物をそのまま食べるほうがいい。
朝ごはんを食べない子の質問には、美月の母親が、自分から手を挙げて答えた。前の晩に、バナナとヨーグルトを机に置いておくようにしたら、娘が少しずつ食べるようになった、と。
先生は、どの質問にも、短く、具体的に答えた。そして、成長や病気に関わる質問には、必ず最後に、「気になるときは、小児科の先生に相談してください」と付け加えた。
最後に手を挙げたのは、サッカークラブの、あの背の低い子のお母さんだった。
お母さん：青木さんに言われて、小児科に行ってきました。成長曲線を見てもらって、今のところ、その子らしい伸び方だと言われました。サプリは、やめました。そのお金で、毎週、魚を一回増やしています。
会場から、拍手が起きた。航は、どう反応していいかわからず、ただ頭を下げた。
＊
教室が終わって、片づけをしているとき、美月が、航のところに来た。
美月：青木さん、今日の話、よかったです。
航：ほんと？ 緊張して、何言ったか覚えてない。
美月：「子どもの前で太ったって言わない」っていうの。うちの部でも、言ってほしい。
美月は、少し照れくさそうに笑った。
美月：先月、生理、戻りました。
航は、一瞬、言葉が出なかった。それから、ゆっくりうなずいた。
航：……よかった。本当に、よかった。
美月：楠木先生が、春になったら、一緒に川沿いを走ろうって。ゆっくりペースで。
＊
最後に部屋に残ったのは、航と楠木先生だけだった。
楠木：お疲れさまでした。
航：先生、僕の話、大丈夫でしたか。
楠木：私が話すより、ずっと伝わっていました。
楠木先生は、パイプ椅子をたたみながら言った。
楠木：去年の春、この部屋の前で三十秒くらい立ち止まっていた人がいましたね。
航：……見てたんですか。
楠木：扉の札が傾いていたので、気になって。
航は、思わず吹き出した。
楠木：航さん。来年も、この教室、続けたいと思っています。一緒にやってもらえますか。
航は、窓の外を見た。冬の夕日が、ジムのガラスを橙色に染めていた。去年の春、ゆで卵がわからなくて、この部屋の扉の前で立ち止まった自分が、今は、たたんだパイプ椅子を両手に抱えている。
航：はい。でも、まだまだ教わることがたくさんあります。
楠木：私もです。
楠木先生は、テーブルの上に残っていたプリントを一枚とって、裏返した。そこには、航が書いた最後の一行があった。「迷ったら、いつもの食事の小さい版を」。
楠木：この一行、来年は私のプリントにも、使わせてください。`,
pt:"子どもの食事は家族の食事。特別なものより、主食・主菜・副菜のそろった家族と同じごはんを、その子に合った量で。子どもの前で体型について否定的に言わない。成長が気になれば小児科へ。",

function storyHTML(t){ return t.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>{
  if(x==="＊") return `<div class="brk">＊</div>`;
  const m=x.match(/^([^：]{1,6})：(.+)$/);
  if(m) return `<div class="ln ${SPK[m[1]]||"o"}"><span class="who">${esc(m[1]==="楠木"?"楠木先生":m[1])}</span><p>${esc(m[2])}</p></div>`;
  return `<p class="nar">${esc(x)}</p>`; }).join(""); }
function fuelDay(k){ return Object.values(D.fread).includes(k) || !!(D.fq[k]&&D.fq[k].n>0); }
function fuelToday(){ for(let i=0;i<FLESSONS.length;i++) if(!D.fread[i]) return i; return daysBetween(pkey(D.start),new Date())%FLESSONS.length; }
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
const r0=x=>Math.round(x), r1=x=>Math.round(x*10)/10;

let fmode="read", fgroup="すべて", fsort="k";
function fuelTab(){
  const done=Object.keys(D.fread).length, qa=Object.values(D.fq).reduce((s,x)=>({n:s.n+x.n,ok:s.ok+x.ok}),{n:0,ok:0});

    <div><div class="eyebrow">FUEL</div><h1 class="title">NUTRITION LAB</h1><p class="small muted" style="margin:4px 0 0">栄養士の知識を、根拠つきで少しずつ。読み物 ${done}/${FLESSONS.length} ・ クイズ正答 ${qa.ok}/${qa.n}</p></div>

  const rd=document.getElementById("frd"); if(rd) rd.onclick=()=>{ D.fread[i]=TODAY(); save(); toast("1話読みました ・ LEARNに一票"); fuelTab(); };

function fuelFood(){ const v=document.getElementById("fBody");
  const groups=["すべて",...new Set(FOODS.map(f=>f.g))];
  let list=FOODS.filter(f=>fgroup==="すべて"||f.g===fgroup);
  const key={k:f=>f.k,P:f=>f.P,pk:f=>f.k?f.P/f.k*100:0}[fsort]; if(key) list=list.slice().sort((a,b)=>key(b)-key(a));
  v.innerHTML=`<div class="chips">${groups.map(g=>`<button class="chip ${g===fgroup?"on":""}" data-g="${g}">${g}</button>`).join("")}</div>
    <div class="row" style="justify-content:space-between;align-items:center"><span class="small muted">並べかえ</span><div class="seg" id="fSort">${[["k","kcal"],["P","たんぱく質"],["pk","P/100kcal"]].map(([s,l])=>`<button data-s="${s}" class="${fsort===s?"on":""}">${l}</button>`).join("")}</div></div>
    <div class="flist">${list.map(f=>`<div class="fitem"><div class="fh"><b>${esc(f.n)}</b><span class="fk">${f.k}<small>kcal</small></span></div>
      <div class="small muted">${esc(f.p)}${f.p===f.w+"g"?"":"（"+f.w+"g）"}</div>
      <div class="pfc"><span style="--w:${Math.min(100,f.P*4/Math.max(f.k,1)*100)}%" class="p">P ${r1(f.P)}g</span><span class="f">F ${r1(f.F)}g</span><span class="c">C ${r1(f.C)}g</span></div>
      ${f.x?`<div class="fx">${esc(f.x)}</div>`:""}</div>`).join("")}</div>
    <p class="small muted" style="margin:0">日本食品標準成分表（八訂）の可食部100gあたりの値を目安量に換算し、四捨五入した値です。商品や調理で変わります。</p>`;
  v.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ fgroup=b.dataset.g; fuelFood(); });
  v.querySelectorAll("#fSort button").forEach(b=>b.onclick=()=>{ fsort=b.dataset.s; fuelFood(); });
}
let fqz=null;
function newQ(){
  const type=Math.random()<.6?"kcal":"prot";
  if(type==="kcal"){ const f=FOODS[Math.floor(Math.random()*FOODS.length)];
    const mult=shuffle([.5,.7,1.5,2]).slice(0,3); const round=x=>x<50?Math.round(x):Math.round(x/5)*5;
    const set=new Set([f.k]); const opts=[{t:f.k,ok:true}];
    mult.forEach(m=>{ let x=round(f.k*m); if(x===f.k||set.has(x)) x=round(f.k*m)+5; set.add(x); opts.push({t:x,ok:false}); });
    return {q:`${f.n}　${f.p}${f.p===f.w+"g"?"":"（"+f.w+"g）"}は何kcal？`,o:shuffle(opts).map(o=>({t:o.t+" kcal",ok:o.ok})),e:`${f.n} ${f.p}は約${f.k}kcal（P ${r1(f.P)} / F ${r1(f.F)} / C ${r1(f.C)}g）。`}; }
  const pool=shuffle(FOODS).slice(0,4); const best=pool.reduce((a,b)=>b.P>a.P?b:a);
  if(pool.filter(f=>f.P===best.P).length>1) return newQ();
  return {q:"いちばん たんぱく質が多いのは？（目安量あたり）",o:shuffle(pool).map(f=>({t:`${f.n}　${f.p}`,ok:f===best})),
    e:pool.slice().sort((a,b)=>b.P-a.P).map(f=>`${f.n} ${r1(f.P)}g`).join("　/　")};
}
function fuelQuiz(){ const v=document.getElementById("fBody"); if(!fqz) fqz=newQ(); const k=TODAY(), t=D.fq[k]||{n:0,ok:0};
  v.innerHTML=`<div class="card"><div class="eyebrow">今日 ${t.ok}/${t.n} 正解</div>
    <div style="font-weight:700;font-size:16px;margin:8px 0 10px">${esc(fqz.q)}</div>
    <div class="fopts">${fqz.o.map((o,j)=>`<button class="fo" data-j="${j}">${esc(o.t)}</button>`).join("")}</div>
    <div class="fexp" hidden></div>
    <div style="text-align:right;margin-top:12px"><button class="cta" id="fNext" hidden>次の問題</button></div></div>
    <p class="small muted" style="margin:0">数字は食材図鑑と同じ（成分表八訂ベースの目安）。毎日数問で、外食でもカロリーが浮かぶ感覚を育てます。</p>`;
  v.querySelectorAll(".fo").forEach(b=>b.onclick=()=>{ if(v.querySelector(".fo.done")) return; const ok=fqz.o[+b.dataset.j].ok;
    v.querySelectorAll(".fo").forEach((x,j)=>{ x.classList.add("done"); if(fqz.o[j].ok) x.classList.add("ok"); }); if(!ok) b.classList.add("ng");
    D.fq[k]={n:t.n+1,ok:t.ok+(ok?1:0)}; save();
    const ex=v.querySelector(".fexp"); ex.hidden=false; ex.innerHTML=`<b>${ok?"正解":"ざんねん"}</b>　${esc(fqz.e)}`;
    const nx=document.getElementById("fNext"); nx.hidden=false; nx.onclick=()=>{ fqz=newQ(); fuelQuiz(); }; });
}

    <div class="card">
      <h3>バックアップ</h3>
      <p class="small muted" style="margin:0 0 8px">記録はこのiPhoneのこのブラウザに保存されています。内分泌アカデミーと合体したあとは「引き継ぎ」でまとめて移せます。</p>
      <div class="row"><button class="ghost" id="bkOut">書き出す（コピー）</button><button class="ghost" id="bkIn">読み込む</button></div>
    </div>
  </section>`;
  app.querySelectorAll("[data-el]").forEach(b=>b.onclick=()=>{ const e=D.ex[+b.dataset.el], l=+b.dataset.l;
    e.lv=e.lv.includes(l)? e.lv.filter(x=>x!==l) : [...e.lv,l].sort(); b.classList.toggle("on"); });
  app.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{ if(confirm("この種目を削除しますか？（過去の記録は残ります）")){ collect(); D.ex.splice(+b.dataset.ed,1); save(); setTabScreen(); } });
  document.getElementById("exAdd").onclick=()=>{ collect(); D.ex.push({id:"x"+Date.now().toString(36),n:"新しい種目",u:"回",lv:[2,3],d:[10,10,12],s:[1,2,3]}); save(); setTabScreen(); };
  document.getElementById("exReset").onclick=()=>{ if(confirm("種目をはじめの状態に戻しますか？")){ D.ex=JSON.parse(JSON.stringify(EX_DEFAULT)); save(); setTabScreen(); } };
  document.getElementById("sSave").onclick=()=>{ collect();
    D.identity=val("sId")||D.identity; D.vision=[...app.querySelectorAll(".vis")].map(i=>i.value.trim()); D.trigger={when:val("sW"),what:val("sT")}; D.target=+document.getElementById("sTg").value;
    D.height=parseFloat(val("sH"))||0; D.goalW=parseFloat(val("sG"))||0; save(); toast("保存しました"); };
  document.getElementById("bkOut").onclick=async()=>{ const t=JSON.stringify(D); try{ await navigator.clipboard.writeText(t); toast("コピーしました。メモ等に貼って保管してください"); }catch(e){ prompt("これをコピーして保管",t); } };
  document.getElementById("bkIn").onclick=()=>{ const t=prompt("書き出したデータを貼り付けてください"); if(!t) return;
    try{ const o=JSON.parse(t); if(!o||!o.log) throw 0; D=Object.assign(D,o); save(); toast("読み込みました"); setTab("today"); }catch(e){ toast("読み込めませんでした"); } };
}
function collect(){ app.querySelectorAll("[data-en]").forEach(inp=>{ const e=D.ex[+inp.dataset.en]; if(e) e.n=inp.value.trim()||e.n; });
  app.querySelectorAll("[data-eu]").forEach(s=>{ const e=D.ex[+s.dataset.eu]; if(e) e.u=s.value; }); }

setTab("today");
</script>
</body></html>
