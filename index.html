{s:"長く健康でいるために",t:"高齢になったら、やせるより筋肉を守る",sub:"父の体重が減りすぎた",
body:`四月。父は、七十歳になった。
半年前の健診から、父の体重は、71キロから66キロまで減っていた。7%の目標を、少し超えていた。母は、うれしそうに電話で報告してきた。
母：お父さん、がんばったのよ。麦ごはんも、野菜から食べるのも、ちゃんと続けて。おやつも半分にして。
航：すごいじゃん。
でも、その週末、実家に行った航は、玄関で父を見て、少しどきりとした。
父は、たしかに、お腹まわりがすっきりしていた。でも、それだけではなかった。首筋が細くなり、腕が、前より細く見えた。立ち上がるとき、テーブルに手をついて、ひと呼吸おいていた。
航：父さん、最近、疲れやすくない？
父：まあ、年だからな。階段は、ちょっときつくなった。
航は、その言葉が、ずっと頭から離れなかった。
＊
火曜日の相談室。航は、父の様子を、そのまま話した。
楠木先生は、真剣な顔で聞いていた。
楠木：お父さんが、自分でがんばったのは、本当にすごいことです。でも、半年前に私が言った「気をつけないといけないこと」が、少し起き始めているのかもしれません。
航：やせることで、筋肉まで落ちる。
楠木：そうです。今日は、その話をしましょう。
＊
楠木：人の筋肉は、何もしなければ、三十代を過ぎたころから、少しずつ減っていきます。そして、六十代、七十代になると、そのスピードが速くなる。年をとって筋肉の量や力が落ちた状態を、サルコペニアと呼びます。
航：さるこぺにあ。
楠木：ギリシャ語で、「筋肉が足りない」という意味です。そして、筋肉が減ることも含めて、体の力や心の元気が全体として弱くなり、介護が必要になる手前の状態を、フレイルと呼びます。
航：フレイル。
楠木：フレイルには、目安になるサインがあります。半年で2〜3キロ以上、意図せず体重が減った。疲れやすくなった。握力が落ちた。歩くのが遅くなった。体を動かす機会が減った。
航は、ノートに書きながら、父の姿を思い浮かべていた。体重の減少は、意図したものだった。でも、疲れやすい。階段がきつい。立ち上がるのに手をつく。
航：……当てはまるもの、いくつかあります。
楠木：意図した減量でも、そのやり方によっては、脂肪と一緒に筋肉が大きく減ることがあります。特に、高齢の方は、食べる量を減らしたとき、筋肉が落ちやすいんです。
＊
楠木：二年前に、あなたが一週間で2.5キロ落としたとき、何が減っていたか、覚えていますか。
航：水と、グリコーゲンと、筋肉。
楠木：若いあなたでも、急いで減らすと筋肉が落ちた。高齢の方は、もっと落ちやすく、しかも、一度落ちた筋肉を取り戻すのが、ずっとむずかしい。
航：じゃあ、父は、やせないほうがよかったんですか。
楠木：いいえ。お腹まわりの脂肪が減ったことは、血糖や血圧にとって、とても良いことです。問題は、減らし方です。お父さんの食事を、もう一度、見せてもらえますか。
航は、母の新しいノートを見せた。朝は、麦ごはん少なめ、味噌汁、漬物少し。昼は、そばを半分。夜は、麦ごはん少なめ、焼き魚、野菜。おやつは、半分のまんじゅう。
楠木先生は、ノートを指でたどって、言った。
楠木：主食も、主菜も、全体的に少なくなっていますね。特に、たんぱく質が足りない。朝は、納豆が消えています。昼は、そばだけ。
航：食べる量を減らせばいいって、父も母も、思い込んでたのかもしれません。
楠木：糖尿病の予防というと、多くの人が「減らす」ことばかり考えます。でも、お父さんの年代では、「減らす」より「守る」ほうが大事なことがあるんです。
＊
楠木：高齢の方の、たんぱく質の話をしましょう。二年前、たんぱく質の配分の話で、年をとると筋肉の反応が鈍くなる、と言いましたね。
航：同じ量でも、高齢の人は、ほぼ倍必要だって。
楠木：そうです。日本の食事摂取基準でも、フレイルの予防のために、高齢の方は、少なくとも体重1kgあたり1日1.0g以上のたんぱく質をとることが望ましいとされています。
航：父は66キロだから、66g以上。
楠木：そして、それを、朝昼晩に分けること。特に、朝と昼に。
航：……朝は納豆が消えて、昼はそばだけ。
楠木：お父さんの今の食事だと、たぶん、40gくらいではないでしょうか。
航は、ノートに計算した。朝、麦ごはん少なめで3g、味噌汁の豆腐で2g。昼、そば半分で4g。夜、麦ごはん少なめで3g、焼き魚で15g、野菜で2g。
航：……29g。半分も、ない。
＊
楠木：それと、もうひとつ。食事だけでは、筋肉は守れません。
航：筋トレ。
楠木：そうです。何歳になっても、筋肉は、使えば応えてくれます。九十代の方でも、筋力トレーニングで筋力が伸びたという研究があるくらいです。特に、たんぱく質をしっかりとることと、筋力トレーニングを組み合わせると、効果が大きくなる。
航：九十代でも。
楠木：ただ、高齢の方が、いきなりジムで重いものを持つのは危険です。椅子からの立ち上がり、かかと上げ、壁を使った腕立て伏せ。自宅で、安全にできるものから始める。そして、持病がある方は、運動を始める前に、主治医に相談すること。
航：PRIMEの、ミニのメニューみたいだ。
楠木：始めは、ばかばかしいほど小さくていい。あなたが二年前に、スクワット十回から始めたように。
＊
楠木：大事なことを、もう一度言っておきます。糖尿病の予防は、たしかに大切です。でも、お父さんの年齢では、筋肉が落ちて、転んで、骨を折って、寝たきりになることのほうが、ずっと身近な危険かもしれない。だから、体重の数字だけを見るのではなく、筋肉と、元気さと、両方を見てください。
航：体重計の数字だけじゃなくて。
楠木：握力や、歩く速さ、階段の上り下り。そういう、毎日の体の動きを見ること。それと、この先の食事と運動の方針は、お父さんの主治医と、必ず相談してください。糖尿病の予防と、フレイルの予防は、ときどき、方向が逆になることがありますから。そのバランスを決めるのは、お父さんの体をいちばんよく知っている人です。
＊
その週末、航は、実家で、父と母を前に、話をした。
楠木先生の話を、できるだけそのまま伝えた。たんぱく質が足りないこと。朝と昼に、肉や魚や卵や大豆を入れること。そして、筋肉を使うこと。
父は、腕を組んで聞いていた。そして、聞き終わると、ため息をついた。
父：減らせと言われたり、食えと言われたり、忙しいな。
航：ごめん。減らせって言ったのは、俺だった。
父：いや。お前のせいじゃない。俺が、極端にやりすぎたんだ。昔から、そういう性格だ。
航は、少し驚いた。父が、自分のことをそう言うのを、初めて聞いた。そして、その性格は、たぶん、自分にもそのまま受け継がれていた。プロテイン三杯。一週間で2.5キロ。
航：……俺も、同じだった。
父は、少しだけ笑った。
父：親子だな。
＊
その日の夕方、航は、居間で、父と並んで、椅子からの立ち上がりをした。座って、立って、座って、立って。十回。
父：これだけか。
航：最初は、これだけ。俺も、スクワット十回から始めたんだ。
父：二年前のお前が、か。
航：ミニでも、一回は一回。
父は、もう一度、椅子に座った。それから、テーブルに手をつかずに、立ち上がった。
父：……もう十回、やっとくか。
台所から、母が、二人の様子を見て、こっそり笑っていた。冷蔵庫には、明日の朝の分の納豆と、卵が、ちゃんと並んでいた。`,
pt:"高齢期は脂肪より筋肉を守ることが重要。意図しない体重減少・疲れやすさ・筋力や歩行速度の低下はフレイルのサイン。たんぱく質は体重1kgあたり1.0g以上を朝昼晩に分け、安全な筋力トレーニングと組み合わせる。方針は主治医と相談。",
q:["フレイル予防のために高齢者で望ましいとされるたんぱく質の量は？","少なくとも体重1kgあたり1日1.0g以上","体重1kgあたり1日0.3g","体重1kgあたり1日3.0g以上","高齢者はたんぱく質を控えるべき"],
e:"食事摂取基準（2020年版）では、フレイル予防の観点から高齢者は少なくとも1.0g/kg/日以上が望ましいとされます。腎機能が低下している場合などは主治医と相談します。",
r:"厚生労働省 日本人の食事摂取基準（2020年版）/ 日本サルコペニア・フレイル学会 / Fiatarone MA et al. JAMA 1990;263:3029-3034"},

{s:"長く健康でいるために",t:"地中海食と和食、いいとこどり",sub:"何を食べるかより、どう食べ続けるか",
body:`五月の連休。航の家族と、父と母は、一緒に、近くの海辺の町へ一泊旅行に出かけた。
宿の夕食は、地元の魚の刺身、焼き魚、煮物、炊き込みごはん、それに、海藻の酢の物と、茶碗蒸し。父は、刺身を、しょうゆを小皿に少しだけとって、つけて食べていた。
母：お父さん、しょうゆ、つけるだけになったのね。
父：航がうるさいからな。
結衣は、茶碗蒸しを三口で食べ終えて、おかわりをねだっていた。
航は、その光景を眺めながら、なんだか不思議な気持ちになっていた。二年前、自分が唐揚げとビールだけを食べていたころには、家族と旅行に来て、こんなふうに食卓を眺めることなど、想像もしていなかった。
＊
連休明けの火曜日。航は、旅行の写真を楠木先生に見せながら、ずっと気になっていたことを聞いた。
航：先生、結局、いちばん体にいい食事って、何なんですか。和食がいいとか、地中海食がいいとか、いろいろ聞くんですけど。
楠木：いい質問ですね。今日は、それを考えましょう。
楠木先生は、ノートに二つの円を描いた。ひとつに「地中海食」、もうひとつに「和食」と書いた。
＊
楠木：まず、地中海食。イタリアやギリシャ、スペインなど、地中海沿岸の地域の、伝統的な食事をもとにした食べ方です。特徴は、野菜、果物、豆、全粒の穀物、ナッツをたっぷりとること。油は、オリーブオイルを中心にする。魚を、よく食べる。肉、特に赤身の肉や加工肉は、少なめ。乳製品は、チーズやヨーグルトを適度に。食事と一緒に、ワインを少し。
航：前回の、脂の話と同じだ。オリーブオイルと、青魚。
楠木：そうです。スペインで行われた、大規模な研究があります。心臓や血管の病気のリスクが高い人、七千人以上を、地中海食にオリーブオイルを足すグループ、地中海食にナッツを足すグループ、脂を控える食事のグループに分けて、何年も追いかけました。その結果、地中海食のグループでは、心筋梗塞や脳卒中などが、およそ3割少なかった。
航：3割。
楠木：この研究は、途中で、グループの分け方に問題があったことがわかって、一度、論文が取り下げられ、分析し直したものが改めて発表されています。それでも、結果の方向は大きくは変わりませんでした。研究の世界には、そういうこともある、ということも、覚えておいてください。
航：取り下げられることも、あるんですね。
楠木：研究は、間違いを見つけて、直していくものです。その話は、次の章でもっと詳しくしましょう。
＊
楠木：では、和食。2013年に、ユネスコの無形文化遺産に登録されました。特徴は、ごはんを主食にして、魚や大豆製品、野菜、海藻、きのこを組み合わせる。だしのうま味を生かして、脂を少なく調理する。発酵食品が多い。
航：一汁三菜。
楠木：そうです。和食の強みは、魚や大豆が多く、脂、特に飽和脂肪酸が少ないこと。食物繊維や、いろいろな食材を少しずつ組み合わせること。日本人の長寿の理由のひとつとも言われてきました。
航：弱みは。
楠木：あなたは、もう知っていますよ。
航：……塩分。
楠木：そうです。しょうゆ、味噌、漬物、干物。和食は、どうしても塩分が多くなりやすい。それと、白いごはんが中心で、食物繊維が少なくなりやすいことや、カルシウムが不足しやすいこと。
＊
楠木：では、どちらがいいか。私は、どちらか一つを選ぶ必要はないと思っています。
楠木先生は、二つの円が重なる部分を、ペンで塗った。
楠木：共通しているところを見てください。野菜、豆、魚が多い。加工された食べ物や、甘いもの、赤身の肉が少ない。食物繊維が多い。いろいろな食材を、少しずつ組み合わせる。そして、どちらも、家族や仲間と一緒に、時間をかけて食べる文化がある。
航：重なってるところが、大事。
楠木：世界中で長生きの人が多い地域の食事を比べても、だいたい、この重なったところに集まってきます。特定の食べ物ではなく、食べ方の形が似ている。
航：じゃあ、和食に、地中海食のいいところを足す。
楠木：そうです。和食の減塩をして、オリーブオイルやナッツを少し使う。全粒の穀物や豆を増やす。地中海食から見れば、和食の魚と大豆と発酵食品は、うらやましい強みです。
＊
航：ナッツって、カロリー高いですよね。アーモンド十粒で73kcal。
楠木：食材図鑑で、覚えていましたね。たしかに、ナッツはカロリーが高い。でも、いくつもの研究で、ナッツを習慣的に食べている人は、心臓の病気が少なく、体重も増えにくい傾向があると報告されています。
航：カロリーが高いのに、太りにくい。
楠木：食物繊維やたんぱく質が多くて、満腹感が続きやすいこと。それに、硬い細胞の壁に包まれているので、全部が吸収されるわけではないこと。そういう理由が考えられています。目安は、一日に片手に軽くひとつかみ、二十から三十グラムくらい。塩味のついていないものを。
航：おやつの、ポテトチップスの代わりに。
楠木：一袋のかわりに、ひとつかみ。それなら、カロリーも塩分も、ずっと少なくなりますね。
＊
航：でも、結局、特別な食事法じゃないんですね。
楠木：特別な食事法は、たいてい続きません。この二年間で、あなたが何度も経験したことです。
楠木先生は、ペンを置いて、少しのあいだ、窓の外を見た。
楠木：私が、いちばん大事だと思っているのは、何を食べるかより、どう食べ続けるかです。どんなに体にいい食事でも、つらくて、楽しくなくて、一か月でやめてしまったら、意味がない。逆に、そこそこの食事でも、楽しく、家族と一緒に、十年続けられるなら、それは、その人にとっての最高の食事です。
航：旅行の夕食、楽しかったです。父がしょうゆを小皿にとってて、結衣が茶碗蒸しをおかわりして、母が笑ってて。
楠木：それが、地中海食の研究でも、和食の研究でも、なかなか数字にできない部分です。でも、たぶん、いちばん大事なところです。
＊
楠木：それと、ひとつ、付け加えておきます。地中海食の中に、ワインが入っていましたね。
航：はい。
楠木：前に話したように、少量の飲酒が体を守るという考え方は、今では疑問視されています。地中海食のよさは、ワインのおかげというより、食事全体の形のおかげだと考えたほうがいい。飲まない人が、わざわざ飲み始める必要はありません。
航：純アルコールで、数える。
楠木：そうです。
＊
その夜、航は、千夏と一緒に、台所で、新しい料理に挑戦した。いわしと、トマトと、オリーブオイルのパスタ。それに、ひよこ豆とわかめのサラダ。
千夏：和食じゃないじゃん。
航：和食と地中海食の、いいとこどり。
千夏：いわしは和食で、トマトとオリーブオイルは地中海食？
航：そう。わかめも和食で、ひよこ豆は地中海食。
結衣が、パスタをフォークに巻きつけながら、ふしぎそうに聞いた。
結衣：ちちゅうかいって、どこ？
航：海の名前。イタリアとか、ギリシャとか、遠くの国のあいだにある海。
結衣：そこのひとも、いわし、たべるの？
航：食べるよ。たくさん。
結衣は、しばらく考えて、それから、満足そうに言った。
結衣：じゃあ、いわしは、せかいのたべもの。
航と千夏は、顔を見合わせて、笑った。和食でも、地中海食でもない、青木家の食卓が、そこにあった。`,
pt:"地中海食（野菜・豆・全粒穀物・ナッツ・オリーブ油・魚中心）は心血管イベントの減少が示されている。和食は魚・大豆・発酵食品が強みで、塩分が弱点。共通点（野菜・豆・魚が多く、加工食品が少ない）を取り入れ、続けられる形で食べることが大切。",
q:["スペインの大規模研究（PREDIMED）で、地中海食群に見られた結果として正しいのは？","心筋梗塞・脳卒中などの心血管イベントがおよそ3割少なかった","体重が平均20kg減った","すべての病気がゼロになった","脂を控える食事より心血管イベントが増えた"],
e:"オリーブオイルまたはナッツを加えた地中海食で、主要な心血管イベントがおよそ30%少なくなりました。無作為化の問題から論文は取り下げ・再解析を経て再発表されています。",
r:"Estruch R et al. N Engl J Med 2018;378:e34 / 農林水産省 和食；日本人の伝統的な食文化"},

{s:"長く健康でいるために",t:"体重を維持している人が、続けていること",sub:"ストレスと、夜中のアイス",
body:`六月。主任になって一年がたった航は、いちばん大きな仕事を任されていた。取引先との大型の契約。毎日、夜遅くまで資料を作り、休日も、頭の片隅から仕事が消えなかった。
そして、ある夜、航は、自分が台所でアイスクリームを食べていることに気づいた。夜中の一時。冷凍庫の前に立ったまま、カップを半分以上食べていた。
次の夜も、その次の夜も、同じだった。
一年以上ずっと70キロ前後だった体重が、二週間で、72キロになっていた。
＊
航：先生、またやらかしました。
火曜日の相談室。航は、うなだれていた。
航：夜中に、アイスを食べるのが止まらなくて。仕事のストレスだって、わかってるんです。でも、気づいたら、冷凍庫の前にいる。
楠木：記録は、つけていますか。
航：つけてます。アイス、って書くたびに、自分が情けなくなります。
楠木：書いているなら、大丈夫です。二年前にも、同じことを言いましたね。
楠木先生は、記録を見て、少し考えてから言った。
楠木：今日は、二つの話をしましょう。ひとつは、ストレスと食欲の話。もうひとつは、体重を維持し続けている人が、何をしているかの話です。
＊
楠木：強いストレスがかかると、体の中では、コルチゾールというホルモンが増えます。コルチゾールは、体を「戦うか、逃げるか」の状態にするホルモンで、そのために、すぐに使えるエネルギーを欲しがる。だから、ストレスがかかると、甘いものや、脂っこいものが欲しくなる人が多いんです。

楠木：同じかもしれないし、本当に朝食が原因として効いている部分もあるかもしれない。この調査だけでは、どちらとも言えない。それが、正確な答えです。
＊
楠木：では、本当に原因かどうかを確かめるには、どうすればいいと思いますか。
航は、少し考えて、顔を上げた。
航：……くじ引き。
楠木：そうです。二年前、Mortonのメタ解析の話をしたときに、ランダム化比較試験の話をしましたね。たくさんの人を、くじ引きで二つのグループに分けて、片方だけに何かをしてもらう。くじ引きで分けるので、生活のリズムや家庭の環境は、両方のグループに、だいたい同じように散らばる。そうすれば、違いが出たときに、それは「何かをしたこと」のせいだと、かなり強く言えるんです。
航：朝ごはんの研究でも、できるんですか。
楠木：実際に、朝食を食べるグループと食べないグループにくじ引きで分けた研究も、海外にはあります。でも、子どもにずっと朝食を抜いてもらうのはむずかしいので、期間が短かったり、規模が小さかったりして、結果はまちまちです。
航：じゃあ、朝ごはんは、意味がないんですか。
楠木：そうは言っていません。朝ごはんは、この二年間で何度も話したように、たんぱく質の配分の面でも、体を動かす燃料の面でも、意味があります。結衣ちゃんは、毎朝食べたほうがいい。ただ、「朝ごはんを食べさせれば成績が上がる」という言い方は、この調査からは言えない、ということです。
＊
楠木：研究には、いくつかの種類があって、それぞれ、どこまで言えるかが違います。
楠木先生は、ノートに、ピラミッドのような三角形を描いた。いちばん下に「専門家の意見・体験談」。その上に「観察研究」。その上に「ランダム化比較試験」。いちばん上に「系統的レビュー・メタ解析」。
楠木：下にいくほど、たくさんあって手に入りやすいけれど、間違いも多い。上にいくほど、少なくて手間がかかるけれど、確かさが高い。ただ、これはあくまで目安です。上のほうでも、質の低い研究はありますし、下のほうでも、とても大事な発見はあります。
航：朝ごはんの調査は。
楠木：観察研究です。たくさんの人を調べて、関係を見つけるのは得意。でも、原因かどうかを決めるのは苦手。
航：体験談は、いちばん下。
楠木：「私はこれで痩せました」は、その人にとっては本当かもしれない。でも、ほかの人にも当てはまるかどうかは、わかりません。
航：僕の、二年間の記録も。
楠木：あなたの記録は、あなたにとって、いちばん確かな答えです。でも、それを誰かに伝えるときには、「僕の場合は」と添える。それが、正直な伝え方です。
＊
航：メタ解析がいちばん上なら、メタ解析を見つければ、それで安心ですか。
楠木：そうとも限りません。メタ解析は、集めた研究の質に左右されます。質の低い研究ばかりを集めれば、まとめても質の低い答えしか出てこない。それに、どの研究を集めるか、どう分析するかで、結果が変わることもある。
航：まとめ方にも、くせがある。
楠木：だから、結論だけでなく、何人を、どれくらいの期間、どんな方法で調べたのかを、少しだけ見る癖をつけるといい。全部を読む必要はありません。論文の最初の要約に、たいてい書いてあります。
航：要約だけなら、読めそうです。
楠木：Mortonのメタ解析も、要約なら、あなたにも読めますよ。英語ですけど。
航は、苦笑した。英語の勉強も、そろそろ始めないといけないかもしれなかった。
＊
帰り道、航は、もう一度、朝食のニュースを開いた。今度は、記事の最後まで読んだ。小さな字で、こう書かれていた。「本調査は、朝食摂取と学力の因果関係を示すものではない」。
最初に読んだとき、その一文には、まったく気づかなかった。
その夜、航は、夕食のあとで、結衣に聞いてみた。
航：結衣、朝ごはん食べると、テストの点、よくなると思う？
結衣：うーん。わかんない。でも、朝ごはん食べないと、二時間目におなかがなる。
航：おなかがなると、どうなる。
結衣：はずかしくて、先生の話、聞いてない。
航は、思わず笑った。そして、ノートに書いた。「関係がある、と、原因である、は違う。でも、原因かもしれない理由を、考えることはできる」。
その下に、もうひとつ。「二時間目に、おなかがならないように」。`,
pt:"観察研究でわかるのは「関係がある」まで。原因かどうかは、交絡因子（後ろに隠れた三つ目の要因）の影響を除いたランダム化比較試験などで確かめる。体験談は「その人の場合」。記事は最後の一文まで読む。",
q:["「朝食を毎日食べる子はテストの点数が高い」という調査結果について、正しい解釈は？","関係はあるが、朝食が点数を上げる原因かどうかはこの調査だけではわからない","朝食を食べさせれば必ず点数が上がると証明された","朝食と点数にはまったく関係がない","点数が高い子ほど朝食を食べたくなることが証明された"],
e:"観察研究では、生活リズムや家庭環境などの交絡因子が両方に影響している可能性があります。原因と結果を確かめるには、無作為化比較試験などの研究デザインが必要です。",
r:"Guyatt G et al. JAMA Users' Guides to the Medical Literature / 文部科学省 全国学力・学習状況調査"},

{s:"情報との付き合い方",t:"「リスク18%増」は、何から何%か",sub:"ハムとソーセージのニュース",
body:`十月。結衣の、小学校で三回目の運動会が終わった週、千夏が、少し青い顔で、航にスマートフォンを見せてきた。
千夏：ねえ、これ、本当？ ハムとかソーセージって、がんになるの？
画面には、「加工肉は発がん性あり　たばこと同じグループに分類」という見出しの記事が出ていた。何年も前の記事が、なぜか今になって、SNSで広まっているらしかった。
千夏：結衣のお弁当に、毎日ウインナー入れてるんだけど。
航は、記事を読んだ。世界保健機関の専門機関が、ハムやソーセージ、ベーコンなどの加工肉を、「ヒトに対して発がん性がある」グループに分類した。加工肉を1日50g食べるごとに、大腸がんのリスクが18%高くなる。
航：……18%。
数字だけを見ると、たしかに怖かった。でも、航は、先週の楠木先生の言葉を思い出していた。記事は、最後まで読む。
航：先生に、聞いてくる。
千夏：また？
航：うん。でも、たぶん、自分でも半分くらいは答えられる気がする。
＊
楠木：自分でも、半分くらいは答えられる。そう言ったんですか。
火曜日の相談室。楠木先生は、少し楽しそうに航を見た。
楠木：では、まず、あなたの半分を聞かせてください。
航は、ノートを開いた。前の晩、自分なりに考えてきたことを書いておいた。
航：まず、「たばこと同じグループ」っていうのが、引っかかりました。たばこと加工肉が、同じくらい危ないとは、とても思えなくて。
楠木：いいところに気づきましたね。
航：それと、「18%高くなる」の、18%。何から、何%になるのかが、書いてない。
楠木：完璧な半分です。では、残りの半分を一緒に考えましょう。
＊
楠木：まず、「同じグループ」の話です。この専門機関は、いろいろなものを、発がん性の「証拠の確かさ」で、グループに分けています。グループ1は、「ヒトに対して発がん性があることの証拠が十分にある」もの。
航：証拠の確かさ。
楠木：そうです。大事なのは、これは「どれくらい危ないか」の分類ではなく、「危ないという証拠が、どれくらい確かか」の分類だということです。たばこも、加工肉も、がんのリスクを上げるという証拠は、どちらも確か。でも、どれくらいリスクを上げるかは、まったく違います。たばこは、肺がんのリスクを何倍、何十倍にも上げます。加工肉の影響は、それよりずっと小さい。
航：同じグループでも、危なさの大きさは、全然違う。
楠木：見出しは、そこを省略してしまうことが多いんです。
航：じゃあ、赤い肉は。牛肉とか豚肉とか。
楠木：加工していない赤身の肉は、ひとつ下のグループ、「おそらく発がん性がある」に分類されています。こちらは、証拠がもう少し限られているということです。それに、赤身の肉には、たんぱく質も、鉄も、ビタミンB群も多い。千夏さんの貧血のときも、大事な食べ物でしたね。
航：食べないほうがいい、じゃなくて。
楠木：食べすぎない、です。世界がん研究基金は、赤身の肉は週に350〜500g程度までを目安にしています。毎日、手のひら一枚くらいまで、という感覚です。
航：また、手のひらだ。
＊
楠木：次に、18%の話。これを、相対リスクと呼びます。「もともとのリスクに比べて、何%増えたか」という数字です。
航：もともとのリスクが、わからないと。
楠木：そうです。たとえば、一生のうちに大腸がんになる人が、もともと100人に5人だったとしましょう。そのリスクが18%増えると、何人になりますか。
航は、計算した。
航：5人の18%で、0.9人。だから……5.9人。だいたい6人。
楠木：100人に5人が、100人に6人になる。これを、絶対リスクで見ると、1ポイントほどの増加です。
航：「18%増える」と、「100人に1人くらい増える」。同じことなのに、聞こえ方が全然違う。
楠木：どちらも、嘘ではありません。でも、見出しにするとき、どちらを使うかで、読む人の受け止め方は大きく変わる。だから、相対リスクの数字を見たら、必ず「もともと何%で、何%になったのか」を探すんです。
＊
楠木：それと、もうひとつ。1日50gの加工肉は、どれくらいの量だと思いますか。
航：ウインナー……三本くらい？ ハムなら、三、四枚。
楠木：それを、毎日、何年も食べ続けた場合の話です。結衣ちゃんのお弁当のウインナーは、一日何本ですか。
航：一本か、二本。毎日じゃなくて、週に三、四回。
楠木：では、あなたなら、どう考えますか。
航は、しばらく考えた。
航：……加工肉が、大腸がんのリスクを上げるという証拠は、確か。だから、毎日たくさん食べるのは、やめたほうがいい。でも、結衣のお弁当のウインナー一、二本を、週に何回か入れるくらいで、怖がる必要はない。それより、塩分も多いし、毎日入れるなら、ほかのおかずとローテーションにする。魚の日とか、卵の日とか。
楠木：型で、決めるんですね。
航：型は、こういうときにも使えるんだ。
楠木：それに、加工肉のリスクを考えるなら、大腸がんのリスクを下げることがわかっているものも、一緒に考えるといい。
航：食物繊維。
楠木：そうです。それと、運動。お酒を控えること。太りすぎないこと。ひとつの食べ物を怖がるより、全体を見る。それが、この二年間で、何度も出てきた考え方です。
＊
楠木：ニュースや見出しを読むときに、確かめるといいことを、まとめておきましょう。
楠木先生は、ノートに、短い問いを並べた。
楠木：その研究は、人で調べたのか、動物や細胞で調べたのか。観察研究か、ランダム化比較試験か。何人くらいを調べたのか。相対リスクか、絶対リスクか。どれくらいの量を、どれくらいの期間とった場合の話か。誰がお金を出した研究か。ほかの研究と、結果は一致しているか。
航：多いですね。
楠木：全部を毎回確かめるのは、私でも大変です。でも、ひとつか二つ、確かめるだけでも、見出しに振り回されることは、ずっと少なくなります。
航：先生、これ、ゆで卵の日と同じですね。数字を見たら、何gあたりかを確かめる。ニュースを見たら、何から何%かを確かめる。
楠木先生は、少しのあいだ、航を見ていた。
楠木：……そうですね。最初の日から、同じことを話していたのかもしれません。
＊
その夜、航は、千夏に、楠木先生と話したことを伝えた。グループは、証拠の確かさの分類であること。18%は、相対リスクであること。100人に5人が、100人に6人くらいになるという話。毎日たくさんでなければ、怖がりすぎなくていいこと。
千夏は、最後まで聞いてから、ほっとしたように息をついた。
千夏：じゃあ、ウインナー、やめなくていいのね。
航：毎日じゃなくて、ローテーションにしよう。月曜は卵焼き、火曜は鮭、水曜はウインナー、みたいに。
千夏：型だ。
航：型。
千夏は、笑いながら、自分のスマートフォンを開いた。
千夏：この記事、ママ友のグループで回ってきたんだよね。みんな、すごく不安がってて。
航：……送ってあげたら。「18%は、何から何%かを見てね」って。
千夏：あなたが書いてよ。
航は、少し考えて、短い文を書いた。専門用語は使わず、数字は一つだけにして、最後に「心配なときは、かかりつけの先生に」と添えた。送信ボタンを押す前に、もう一度だけ読み直した。言うべきときに、言うべき人に、言うべき量だけ。`,
pt:"「発がん性グループ1」は危険の大きさではなく証拠の確かさの分類。「リスク18%増」は相対リスクで、もともとの絶対リスク（例：100人に5人→約6人）とあわせて見る。量・期間・研究の種類・他の研究との一致も確かめる。",
q:["もともとの生涯リスクが100人に5人の病気で、相対リスクが18%増えると、おおよそ何人になる？","約6人","約23人","約18人","約50人"],
e:"5 × 1.18 ≒ 5.9人。相対リスク18%増は、絶対リスクでは約1ポイントの増加です。見出しの相対リスクだけで判断しないことが大切です。",
r:"Bouvard V et al. Lancet Oncol 2015;16:1599-1600（IARC Monographs Working Group）"},

{s:"情報との付き合い方",t:"「自然だから安全」とは限らない",sub:"サプリメントの事故から学ぶ",
body:`十一月。佐伯が、相談室の前で航を待っていた。ここ最近、昼休みに、何か深刻そうな顔でスマートフォンを見ていることが多かった。
佐伯：青木さん、ちょっと相談があって。母のことなんですけど。
佐伯の母親は、六十代の半ばで、最近、いくつものサプリメントを飲んでいるらしかった。コレステロールを下げるもの、血圧にいいもの、関節のためのもの、目のためのもの。テレビの通販や、知り合いのすすめで、少しずつ増えていったという。
佐伯：全部、天然由来とか、自然の成分とか書いてあって。母は、自然のものだから体にいいって言うんです。でも、毎月一万円以上かかってるし、なんか、病院の薬も飲んでるのに、大丈夫なのかなって。
航：楠木先生に、聞いてみよう。
＊
楠木：佐伯さん、お母さんのことを心配して、よく相談してくれましたね。
相談室で、楠木先生は、佐伯の話を最後まで聞いてから、静かに言った。
楠木：今日は、とても大事な話をします。航さんにも、聞いておいてほしい話です。
楠木先生は、少しのあいだ、言葉を選ぶように黙っていた。
楠木：2024年の春、日本で、サプリメントによる大きな健康被害が明らかになりました。紅麹という、米に麹菌の一種を育てたものを使った、コレステロールを下げることをうたったサプリメントです。それを飲んでいた人たちに、腎臓の障害などの健康被害が多数報告され、亡くなった方も報告されました。
佐伯：……覚えてます。ニュースで、ずっとやってた。
楠木：国に届け出た、機能性表示食品として売られていた商品でした。そして、原因として、製造の過程で混入した可能性がある物質が指摘されています。
航：国に届け出てたのに。
楠木：前に話しましたね。機能性表示食品は、企業が自分たちの責任で届け出るもので、国が一つ一つ審査して許可したものではありません。この事故のあと、健康被害の報告を企業に義務づけるなど、制度の見直しが行われました。
佐伯：じゃあ、トクホなら安全なんですか。
楠木：トクホは、国が個別に審査しているので、根拠の確かさは高いほうです。でも、どんな食品でも、たくさんとればいいわけではありませんし、体質に合わない人もいます。「国が許可した」も「自然」も「天然」も、安全を保証する言葉ではない。それぞれの言葉が、何を意味していて、何を意味していないのかを知っておくことが大事なんです。
航：何のための言葉か。
楠木：数字と同じですね。
＊
楠木：この事故から、学ぶべきことがいくつかあります。
楠木先生は、ノートに書いた。
楠木：ひとつ目。「自然」や「天然」は、「安全」と同じ意味ではありません。毒きのこも、トリカブトも、自然のものです。紅麹も、昔から食品に使われてきたものでした。でも、サプリメントとして、成分を濃縮して、毎日、何か月も飲み続けると、食べ物としてとるのとは、まったく違う量が体に入ります。
佐伯：濃縮してる。
楠木：食べ物の形でとるのと、サプリメントの形でとるのは、別のことだと考えてください。ビタミンAやDのとりすぎの話を覚えていますか、航さん。
航：脂溶性は、たまる。食事でとりすぎることはまずないけど、サプリで大量にとると、過剰症になる。
楠木：それと同じです。
＊
楠木：ふたつ目。サプリメントと、薬の飲み合わせ。サプリメントの中には、薬の効き目を強めたり、弱めたりするものがあります。お母さんが、病院で薬をもらっているなら、なおさら注意が必要です。
佐伯：母、血圧の薬と、コレステロールの薬を飲んでます。
楠木先生は、少しだけ眉を寄せた。
楠木：コレステロールの薬を飲みながら、コレステロールを下げるサプリメントを飲んでいる。そうなると、何が起きているのか、主治医にもわからなくなります。数字が下がったのは、薬のおかげなのか、サプリのおかげなのか。もし体に何か起きたとき、原因がどちらなのか。
航：二年前の、僕のクレアチンと同じだ。問診に書かなかった。
楠木：そうです。サプリメントを飲んでいることを、主治医や薬剤師に伝えていない人は、とても多いんです。「薬じゃないから、言わなくていい」と思ってしまう。
＊
楠木：三つ目。もし、サプリメントを飲み始めてから、体の調子がおかしいと感じたら、すぐに飲むのをやめて、医師に相談すること。そして、何という商品を、いつから、どれくらい飲んでいたかを伝えること。地域の保健所でも、健康食品の相談を受けつけています。
佐伯：母、最近、なんとなく体がだるいって言ってたんです。年のせいだと思ってたけど。
楠木：それが、サプリメントのせいかどうかは、私にはわかりません。でも、一度、お薬手帳と、飲んでいるサプリメントの袋を全部持って、主治医か、かかりつけの薬局に行ってもらうのが、いちばんだと思います。
＊
楠木：最後に、四つ目。これが、いちばん大事なことかもしれません。
楠木先生は、佐伯の目を見て言った。
楠木：お母さんを、責めないであげてください。
佐伯：え。

{s:"情報との付き合い方",t:"物差しを渡す",sub:"最終話",
body:`三月の最後の火曜日。
相談室の扉の前で、航は、三十秒ほど立ち止まっていた。木の札は、まっすぐにかかっていた。三年前、この扉の前で立ち止まったときとは、まったく違う理由だった。
扉をノックすると、「どうぞ」と、いつもの落ち着いた声がした。
部屋の中は、ほとんど片づいていた。本棚は空になり、段ボール箱が三つ、壁ぎわに積まれていた。木のテーブルと、二脚の椅子と、体重計だけが、三年前と同じ場所にあった。テーブルの上に、あの分厚い本が一冊、置かれていた。
楠木：来てくれて、ありがとう。
＊
二人は、いつものように、テーブルをはさんで座った。紅茶が二つ。
楠木：最後の相談です。何か、聞きたいことはありますか。
航は、少し考えた。聞きたいことは、たくさんあったはずだった。でも、ノートの「先生に聞くことリスト」は、いつのまにか、ほとんど全部に線が引かれていた。
航：……ひとつだけ。最初の日、僕に、ルールを渡さなかったのは、なんでですか。
楠木先生は、少し笑った。
楠木：あなたが、ルールを欲しがっていたからです。
航：え。
楠木：ルールを欲しがる人に、ルールを渡すと、その人は、ルールが合わなくなった日に止まります。でも、ルールを欲しがる人は、真剣な人です。真剣な人には、物差しを渡せば、自分で目盛りを刻んでいける。あなたは、最初の日から、ずっと真剣でした。プロテインを三杯飲んだときも、一週間で2.5キロ落としたときも。
航：あれは、失敗です。
楠木：失敗を、記録して、ここに持ってきてくれた。だから、そこから一緒に学べたんです。
＊
楠木：最後に、私からも、ひとつ聞いていいですか。
航：はい。
楠木：この三年間で、あなたが、いちばん大事だと思ったことは、何ですか。ひとつだけ。
航は、ノートを開かなかった。開かなくても、答えはわかっていた。
航：……数字を見たら、「何のための数字か」を考えること。
楠木先生は、黙って続きを待っていた。
航：最初は、何gあたりか、でした。ゆで卵の日。それが、何のための数字か、になって、どれくらい確かか、になって、誰のための数字か、になって、何から何%か、になって、どこで確かめるか、になった。全部、同じ質問だったんです。この数字は、誰の、何のために、どれくらい確かなのか。それを、ちゃんと考えれば、ルールはいらなかった。
楠木：それが、物差しです。
＊
楠木先生は、テーブルの上の分厚い本を、両手で、航のほうへ押した。
楠木：約束の、成分表です。
今度は、航は、受け取った。思っていたより重かった。表紙の角がすり切れ、ページのあいだから、色とりどりの付箋が飛び出している。開くと、ところどころに、先生の小さな字で、書き込みがあった。
卵のページを開いた。全卵、生、エネルギー142kcal、たんぱく質12.2g、コレステロール370mg。その横に、鉛筆で、小さく書いてあった。
「青木さん、最初の日」。
航は、顔を上げた。
楠木：あの日、あなたが帰ったあとに、書いたんです。この人は、たぶん、長く来てくれる気がして。
航は、何も言えなかった。本を閉じて、胸に抱えた。
＊
楠木：最後に、少し、走りませんか。
二人は、ジムの裏口から出て、川沿いの道を、ゆっくり走った。三月の終わりの夕方。桜が、まだ少しだけ咲いていた。
楠木先生の走り方は、思っていたより、ずっときれいだった。背筋がまっすぐで、足音が静かだった。
航：先生、速いですね。
楠木：昔、中距離でしたから。
航：今、骨は、大丈夫なんですか。
楠木：少しずつ、戻ってきています。ちゃんと食べて、ちゃんと寝て、少しずつ走って。三十年かかりましたけど。
航：遅すぎることは、ないんですね。
楠木：七十歳のお父さんが、教えてくれましたよ。
二人は、笑いながら、しばらく黙って走った。川の水面に、夕日が映っていた。
＊
楠木：航さん。
橋のたもとで、楠木先生は、足をゆるめた。
楠木：三年前、私は、あなたの隣にいる人になりたいと思いました。でも、途中から、あなたが、私の隣にいてくれていた。美月さんのときも、お父さんのときも。私が、昔の自分を思い出して立ち止まりそうになったとき、あなたが、隣にいてくれた。
航：僕は、ただ、聞いてただけです。
楠木：それが、隣にいるということです。
楠木先生は、まっすぐ航を見た。
楠木：物差しは、渡しました。これからは、あなたが、誰かに渡す番です。
＊
＊
それから、一年がたった。
四月の最初の土曜日。ジムの多目的室では、三回目の「子どものスポーツと栄養　保護者のための小さな教室」が、ちょうど終わったところだった。
新しく来た管理栄養士の女性が、最後の質問に答えていた。航は、部屋の後ろで、パイプ椅子をたたんでいた。前の年に、通信で勉強して、食生活に関する資格をひとつとった。それでも、自分は専門家ではないことを、いつも、はじめに伝えるようにしていた。
後片づけを終えて、廊下に出たとき、航は、小さな扉の前で立ち止まっている男性に気づいた。三十代の前半くらい。スーツ姿で、手には、コンビニの袋を持っていた。木の札の前で、入ろうか、入るまいか、迷っているようだった。
航は、少し迷ってから、声をかけた。
航：相談、ですか。
男性は、驚いたように振り返った。
男性：あ、いや……痩せたくて。いや、痩せたいっていうか、ちゃんとした体になりたいっていうか。
航は、思わず、笑いそうになるのをこらえた。
男性は、照れくさそうに、コンビニの袋を少し持ち上げた。中に、ゆで卵が二つ、入っていた。
男性：正直、何を信じていいかわからなくて。このゆで卵、パッケージには「1個あたり」って書いてあるのに、ネットだと「100gあたり」で、どっちが本当なのか。
航は、しばらく黙っていた。それから、ゆっくり言った。
航：どっちも、たぶん本当です。
男性：え。
航：数字が違うのは、どっちかが嘘だからじゃなくて、何をはかったかが違うからなんです。
航は、扉を軽くノックした。中から、新しい管理栄養士の「どうぞ」という声がした。
航：中に、管理栄養士の先生がいます。僕は、専門家じゃないんですけど、最初の一歩だけ、一緒に入りましょうか。
男性は、少し迷ってから、うなずいた。
航は、扉を開けた。部屋の中の本棚には、新しい版の、分厚い本が並んでいた。
＊
その夜、航は、自分の家の本棚から、すり切れた成分表を取り出して、卵のページを開いた。
「青木さん、最初の日」。
その鉛筆の字の下に、航は、自分のペンで、小さく書き足した。
「次の人、最初の日」。
窓の外では、結衣が、庭で、サッカーボールを蹴っていた。台所からは、千夏が作る、具だくさんの味噌汁のにおいがしていた。
航は、本を閉じて、本棚に戻した。それから、台所へ行って、千夏の隣に立った。
今夜の献立は、結衣のリクエストで、たまごの日だった。

（完）`,

const FLESSONS=[...STORY1,...STORY2A,...STORY2B,...STORY3A,...STORY3B,...STORY4A,...STORY4B,...STORY5A,...STORY5B,...STORY6A,...STORY6B,...STORY7A,...STORY7B];
/* 記録：D.fread[i]=読んだ日のkey、D.fq[day]={n,ok} */
if(!D.fread||typeof D.fread!=="object") D.fread={};
if(!D.fq||typeof D.fq!=="object") D.fq={};
const SPK={"楠木":"t","航":"s"};
function storyHTML(t){ return t.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>{
  if(x==="＊") return `<div class="brk">＊</div>`;
  const m=x.match(/^([^：]{1,6})：(.+)$/);
  if(m) return `<div class="ln ${SPK[m[1]]||"o"}"><span class="who">${esc(m[1]==="楠木"?"楠木先生":m[1])}</span><p>${esc(m[2])}</p></div>`;
  return `<p class="nar">${esc(x)}</p>`; }).join(""); }
function fuelDay(k){ return Object.values(D.fread).includes(k) || !!(D.fq[k]&&D.fq[k].n>0); }
function fuelToday(){ for(let i=0;i<FLESSONS.length;i++) if(!D.fread[i]) return i; return daysBetween(pkey(D.start),new Date())%FLESSONS.length; }
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
const r0=x=>Math.round(x), r1=x=>Math.round(x*10)/10;

let fmode="read", fgroup="すべて", fsort="k";
function fuelTab(){
  const done=Object.keys(D.fread).length, qa=Object.values(D.fq).reduce((s,x)=>({n:s.n+x.n,ok:s.ok+x.ok}),{n:0,ok:0});
  app.innerHTML=`<section class="screen">
    <div><div class="eyebrow">FUEL</div><h1 class="title">NUTRITION LAB</h1><p class="small muted" style="margin:4px 0 0">栄養士の知識を、根拠つきで少しずつ。読み物 ${done}/${FLESSONS.length} ・ クイズ正答 ${qa.ok}/${qa.n}</p></div>
    <div class="seg" id="fSeg">${[["read","読み物"],["food","食材図鑑"],["quiz","kcalクイズ"]].map(([m,l])=>`<button data-m="${m}" class="${fmode===m?"on":""}">${l}</button>`).join("")}</div>
    <div id="fBody"></div>
  </section>`;
  app.querySelectorAll("#fSeg button").forEach(b=>b.onclick=()=>{ fmode=b.dataset.m; fuelTab(); });
  ({read:fuelRead,food:fuelFood,quiz:fuelQuiz})[fmode]();
}
function fuelRead(){ const v=document.getElementById("fBody");
  v.innerHTML=`<div id="lesson"></div>${FCH.map(c=>{ const cur=fuelToday(), rd=FLESSONS.slice(c.from,c.to).filter((_,j)=>D.fread[c.from+j]).length; return `<details class="fch" ${cur>=c.from&&cur<c.to?"open":""}><summary class="eyebrow" style="margin:10px 0 6px;cursor:pointer">${c.n} ・ ${esc(c.t)} <span style="color:var(--dim)">${rd}/${c.to-c.from}</span></summary><div class="clist">${FLESSONS.slice(c.from,c.to).map((l,j)=>{ const i=c.from+j;
      return `<button class="citem ${D.fread[i]?"read":""}" data-i="${i}"><span class="no">${String(i+1).padStart(2,"0")}</span><span>${esc(l.t)}<br><span class="small muted">${esc(l.s)}</span></span></button>`; }).join("")}</div></details>`; }).join("")}
    <p class="small muted" style="margin:4px 0 0">全51話・完結。数値の多くは食事摂取基準2020年版に基づきます。最新値は厚生労働省の資料で確認してください。</p>`;
  v.querySelectorAll(".citem").forEach(b=>b.onclick=()=>openLesson(+b.dataset.i));
  openLesson(fuelToday(),true);
}
function openLesson(i,quiet){ const l=FLESSONS[i], v=document.getElementById("lesson"); if(!v) return;
  const opts=shuffle(l.q.slice(1).map((t,j)=>({t,ok:j===0})));
  v.innerHTML=`<article class="scroll fuel"><div class="src">${String(i+1).padStart(2,"0")} ・ ${esc(l.s)}</div>${l.sub?`<div class="epi">第${i+1}話「${esc(l.sub)}」<span>約${Math.max(1,Math.round(l.body.length/420))}分</span></div>`:""}<h2>${esc(l.t)}</h2>${l.body?storyHTML(l.body):l.b.map(p=>`<p>${esc(p)}</p>`).join("")}
    <div class="q"><b>今日のポイント</b><br>${esc(l.pt)}</div>
    <div class="fq"><div class="eyebrow" style="margin:14px 0 6px">CHECK</div><div style="font-weight:700;font-size:14px;margin-bottom:8px">${esc(l.q[0])}</div>
      <div class="fopts">${opts.map((o,j)=>`<button class="fo" data-ok="${o.ok?1:0}">${esc(o.t)}</button>`).join("")}</div><div class="fexp" hidden></div></div>
    <div class="small muted" style="margin-top:12px;line-height:1.6">根拠：${esc(l.r)}</div>
    <div style="margin-top:12px;text-align:right">${D.fread[i]?`<span class="small muted">読了 ${esc(D.fread[i].split("-").slice(1).join("/"))}</span>`:`<button class="cta" id="frd">読んだ</button>`}</div></article>`;
  v.querySelectorAll(".fo").forEach(b=>b.onclick=()=>{ if(v.querySelector(".fo.done")) return;
    v.querySelectorAll(".fo").forEach(x=>{ x.classList.add("done"); if(x.dataset.ok==="1") x.classList.add("ok"); }); if(b.dataset.ok!=="1") b.classList.add("ng");
    const ex=v.querySelector(".fexp"); ex.hidden=false; ex.innerHTML=`<b>${b.dataset.ok==="1"?"正解":"ざんねん"}</b>　${esc(l.e)}`; });
  const rd=document.getElementById("frd"); if(rd) rd.onclick=()=>{ D.fread[i]=TODAY(); save(); toast("1話読みました ・ LEARNに一票"); fuelTab(); };
  if(!quiet) v.scrollIntoView({behavior:"smooth",block:"start"});
}
function fuelFood(){ const v=document.getElementById("fBody");
  const groups=["すべて",...new Set(FOODS.map(f=>f.g))];
  let list=FOODS.filter(f=>fgroup==="すべて"||f.g===fgroup);
  const key={k:f=>f.k,P:f=>f.P,pk:f=>f.k?f.P/f.k*100:0}[fsort]; if(key) list=list.slice().sort((a,b)=>key(b)-key(a));
  v.innerHTML=`<div class="chips">${groups.map(g=>`<button class="chip ${g===fgroup?"on":""}" data-g="${g}">${g}</button>`).join("")}</div>
    <div class="row" style="justify-content:space-between;align-items:center"><span class="small muted">並べかえ</span><div class="seg" id="fSort">${[["k","kcal"],["P","たんぱく質"],["pk","P/100kcal"]].map(([s,l])=>`<button data-s="${s}" class="${fsort===s?"on":""}">${l}</button>`).join("")}</div></div>
    <div class="flist">${list.map(f=>`<div class="fitem"><div class="fh"><b>${esc(f.n)}</b><span class="fk">${f.k}<small>kcal</small></span></div>
      <div class="small muted">${esc(f.p)}${f.p===f.w+"g"?"":"（"+f.w+"g）"}</div>
      <div class="pfc"><span style="--w:${Math.min(100,f.P*4/Math.max(f.k,1)*100)}%" class="p">P ${r1(f.P)}g</span><span class="f">F ${r1(f.F)}g</span><span class="c">C ${r1(f.C)}g</span></div>
      ${f.x?`<div class="fx">${esc(f.x)}</div>`:""}</div>`).join("")}</div>
    <p class="small muted" style="margin:0">日本食品標準成分表（八訂）の可食部100gあたりの値を目安量に換算し、四捨五入した値です。商品や調理で変わります。</p>`;
  v.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ fgroup=b.dataset.g; fuelFood(); });
  v.querySelectorAll("#fSort button").forEach(b=>b.onclick=()=>{ fsort=b.dataset.s; fuelFood(); });
}
let fqz=null;
function newQ(){
  const type=Math.random()<.6?"kcal":"prot";
  if(type==="kcal"){ const f=FOODS[Math.floor(Math.random()*FOODS.length)];
    const mult=shuffle([.5,.7,1.5,2]).slice(0,3); const round=x=>x<50?Math.round(x):Math.round(x/5)*5;
    const set=new Set([f.k]); const opts=[{t:f.k,ok:true}];
    mult.forEach(m=>{ let x=round(f.k*m); if(x===f.k||set.has(x)) x=round(f.k*m)+5; set.add(x); opts.push({t:x,ok:false}); });
    return {q:`${f.n}　${f.p}${f.p===f.w+"g"?"":"（"+f.w+"g）"}は何kcal？`,o:shuffle(opts).map(o=>({t:o.t+" kcal",ok:o.ok})),e:`${f.n} ${f.p}は約${f.k}kcal（P ${r1(f.P)} / F ${r1(f.F)} / C ${r1(f.C)}g）。`}; }
  const pool=shuffle(FOODS).slice(0,4); const best=pool.reduce((a,b)=>b.P>a.P?b:a);
  if(pool.filter(f=>f.P===best.P).length>1) return newQ();
  return {q:"いちばん たんぱく質が多いのは？（目安量あたり）",o:shuffle(pool).map(f=>({t:`${f.n}　${f.p}`,ok:f===best})),
    e:pool.slice().sort((a,b)=>b.P-a.P).map(f=>`${f.n} ${r1(f.P)}g`).join("　/　")};
}
function fuelQuiz(){ const v=document.getElementById("fBody"); if(!fqz) fqz=newQ(); const k=TODAY(), t=D.fq[k]||{n:0,ok:0};
  v.innerHTML=`<div class="card"><div class="eyebrow">今日 ${t.ok}/${t.n} 正解</div>
    <div style="font-weight:700;font-size:16px;margin:8px 0 10px">${esc(fqz.q)}</div>
    <div class="fopts">${fqz.o.map((o,j)=>`<button class="fo" data-j="${j}">${esc(o.t)}</button>`).join("")}</div>
    <div class="fexp" hidden></div>
    <div style="text-align:right;margin-top:12px"><button class="cta" id="fNext" hidden>次の問題</button></div></div>
    <p class="small muted" style="margin:0">数字は食材図鑑と同じ（成分表八訂ベースの目安）。毎日数問で、外食でもカロリーが浮かぶ感覚を育てます。</p>`;
  v.querySelectorAll(".fo").forEach(b=>b.onclick=()=>{ if(v.querySelector(".fo.done")) return; const ok=fqz.o[+b.dataset.j].ok;
    v.querySelectorAll(".fo").forEach((x,j)=>{ x.classList.add("done"); if(fqz.o[j].ok) x.classList.add("ok"); }); if(!ok) b.classList.add("ng");
    D.fq[k]={n:t.n+1,ok:t.ok+(ok?1:0)}; save();
    const ex=v.querySelector(".fexp"); ex.hidden=false; ex.innerHTML=`<b>${ok?"正解":"ざんねん"}</b>　${esc(fqz.e)}`;
    const nx=document.getElementById("fNext"); nx.hidden=false; nx.onclick=()=>{ fqz=newQ(); fuelQuiz(); }; });
}

/* ================= 設定 ================= */
function setTabScreen(){
  app.innerHTML=`<section class="screen">
    <div><div class="eyebrow">SETUP</div><h1 class="title">SETUP</h1></div>
    <div class="card">
      <h3>なりたい自分</h3>
      <p class="small muted" style="margin:0">「わたしは〜人」の〜に入る言葉。トレーニングは、この自分への一票になります。</p>
      <input class="txt" id="sId" value="${esc(D.identity)}" style="margin-top:8px">
      <h3 style="margin-top:16px">VISION ・ 30代でこうなっている</h3>
      <p class="small muted" style="margin:0">3つまで。TODAYの一番上にいつも出ます（何のためにやるか）。</p>
      ${[0,1,2].map(i=>`<input class="txt vis" data-i="${i}" value="${esc(D.vision[i]||"")}" placeholder="例：家族と全力で遊べる体力がある" style="margin-top:6px">`).join("")}
      <h3 style="margin-top:16px">きっかけ（〜したら、〜する）</h3>
      <label class="f">〜したら</label><input class="txt" id="sW" value="${esc(D.trigger.when)}">
      <label class="f">〜する</label><input class="txt" id="sT" value="${esc(D.trigger.what)}">
      <label class="f">週の目標回数</label>
      <select id="sTg">${[2,3,4,5,6,7].map(n=>`<option ${D.target===n?"selected":""}>${n}</option>`).join("")}</select>
    </div>
    <div class="card">
      <h3>からだ</h3>
      <div class="grid2"><div><label class="f">身長（cm）</label><input class="num" id="sH" type="number" inputmode="decimal" step="0.1" value="${D.height||""}"></div>
      <div><label class="f">目標体重（kg・任意）</label><input class="num" id="sG" type="number" inputmode="decimal" step="0.1" value="${D.goalW||""}"></div></div>
    </div>
    <div class="card">
      <h3>種目</h3>
      <p class="small muted" style="margin:0">どのレベルに入れるかを選べます。名前の横は単位（回・秒）。</p>
      <div id="exEd">${D.ex.map((e,i)=>`<div class="exedit"><input class="txt" data-en="${i}" value="${esc(e.n)}"><select data-eu="${i}"><option ${e.u==="回"?"selected":""}>回</option><option ${e.u==="秒"?"selected":""}>秒</option></select>
        <div class="lvs">${[1,2,3].map(l=>`<button class="tg ${e.lv.includes(l)?"on":""}" data-el="${i}" data-l="${l}">${LV[l].n}</button>`).join("")}<button class="tg" data-ed="${i}" style="margin-left:auto">削除</button></div></div>`).join("")}</div>
      <div class="row" style="margin-top:10px;justify-content:space-between"><button class="ghost" id="exAdd">＋ 種目を追加</button><button class="ghost" id="exReset">はじめの種目に戻す</button></div>
    </div>
    <div style="text-align:center"><button class="cta" id="sSave">保存する</button></div>
    <div class="card">
      <h3>バックアップ</h3>
      <p class="small muted" style="margin:0 0 8px">記録はこのiPhoneのこのブラウザに保存されています。内分泌アカデミーと合体したあとは「引き継ぎ」でまとめて移せます。</p>
      <div class="row"><button class="ghost" id="bkOut">書き出す（コピー）</button><button class="ghost" id="bkIn">読み込む</button></div>
    </div>
  </section>`;
  app.querySelectorAll("[data-el]").forEach(b=>b.onclick=()=>{ const e=D.ex[+b.dataset.el], l=+b.dataset.l;
    e.lv=e.lv.includes(l)? e.lv.filter(x=>x!==l) : [...e.lv,l].sort(); b.classList.toggle("on"); });
  app.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{ if(confirm("この種目を削除しますか？（過去の記録は残ります）")){ collect(); D.ex.splice(+b.dataset.ed,1); save(); setTabScreen(); } });
  document.getElementById("exAdd").onclick=()=>{ collect(); D.ex.push({id:"x"+Date.now().toString(36),n:"新しい種目",u:"回",lv:[2,3],d:[10,10,12],s:[1,2,3]}); save(); setTabScreen(); };
  document.getElementById("exReset").onclick=()=>{ if(confirm("種目をはじめの状態に戻しますか？")){ D.ex=JSON.parse(JSON.stringify(EX_DEFAULT)); save(); setTabScreen(); } };
  document.getElementById("sSave").onclick=()=>{ collect();
    D.identity=val("sId")||D.identity; D.vision=[...app.querySelectorAll(".vis")].map(i=>i.value.trim()); D.trigger={when:val("sW"),what:val("sT")}; D.target=+document.getElementById("sTg").value;
    D.height=parseFloat(val("sH"))||0; D.goalW=parseFloat(val("sG"))||0; save(); toast("保存しました"); };
  document.getElementById("bkOut").onclick=async()=>{ const t=JSON.stringify(D); try{ await navigator.clipboard.writeText(t); toast("コピーしました。メモ等に貼って保管してください"); }catch(e){ prompt("これをコピーして保管",t); } };
  document.getElementById("bkIn").onclick=()=>{ const t=prompt("書き出したデータを貼り付けてください"); if(!t) return;
    try{ const o=JSON.parse(t); if(!o||!o.log) throw 0; D=Object.assign(D,o); save(); toast("読み込みました"); setTab("today"); }catch(e){ toast("読み込めませんでした"); } };
}
function collect(){ app.querySelectorAll("[data-en]").forEach(inp=>{ const e=D.ex[+inp.dataset.en]; if(e) e.n=inp.value.trim()||e.n; });
  app.querySelectorAll("[data-eu]").forEach(s=>{ const e=D.ex[+s.dataset.eu]; if(e) e.u=s.value; }); }

setTab("today");
</script>
</body></html>
